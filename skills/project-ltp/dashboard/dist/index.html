      marginal notes that define what "adopts" means here.

  # --- What adoption means (the two asterisked notes) ---

  - id: CSF-1
    type: critical_success_factor
    statement: A non-trivial subset of the movement is actively using LTP
    status: confirmed
    confidence: high
    evidence: [EVD-2]

  - id: CSF-2
    type: critical_success_factor
    statement: LTP is used in shared spaces such as the forum, so that even people who are not "bought in" benefit from it
    status: confirmed
    confidence: high
    evidence: [EVD-2]
    assumptions: [ASM-3]

  # --- What benefiting means (the Results boxes) ---

  - id: CSF-3
    type: critical_success_factor
    statement: Discussion on the 2R forum is more productive and cumulative
    status: provisional
    confidence: medium
    evidence: [EVD-4]
    reasoning: >-
      David wrote this box with a trailing question mark, so it is recorded as a
      candidate benefit rather than a settled one.

  - id: CSF-4
    type: critical_success_factor
    statement: The tools help the 2R movement learn and improve by assessing measurable progress toward its goals
    status: confirmed
    confidence: high
    evidence: [EVD-4]

  # --- What makes adoption possible ---

  - id: CSF-5
    type: critical_success_factor
    statement: 2R Research adopts updating the 2R goal tree as its own goal
    status: confirmed
    confidence: high
    evidence: [EVD-6, EVD-14]
    assumptions: [ASM-2]
    reasoning: >-
      Top of the right-hand whiteboard tree, and consistent with the earlier
      agreement with Rufus that duly improving the 2R LTP trees is the research
      group's throughput. It is the dogfooding condition: the group that built
      the method has to run on it.

  - id: CSF-6
    type: critical_success_factor
    statement: There are articulated reasons to adopt LTP that land with people
    status: confirmed
    confidence: high
    evidence: [EVD-5]
    reasoning: >-
      The "Reasons for adoption ..." box sits on the left-hand CSF line and was
      left unfinished. The four conditions beneath it are the whiteboard's own
      candidates for what such reasons would consist of.

  - id: CSF-7
    type: critical_success_factor
    statement: LTP is integrated into the forum
    status: confirmed
    confidence: high
    evidence: [EVD-5]

  - id: CSF-8
    type: critical_success_factor
    statement: People beyond David and Rufus, and beyond 2R, are discovering the vision and the tools
    status: confirmed
    confidence: high
    evidence: [EVD-7, EVD-16]
    reasoning: >-
      The whiteboard names Bluesky as an example, which matches the earlier
      "empty dancefloor" framing and the Bluesky bridge experiment.

  - id: CSF-9
    type: critical_success_factor
    statement: We have funding for this work to build the tools and docs we want
    status: confirmed
    confidence: high
    evidence: [EVD-7]

  # --- Necessary conditions under CSF-5 (the dogfooding chain) ---

  - id: NC-1
    type: necessary_condition
    statement: We can update the 2R goal tree
    status: confirmed
    confidence: high
    evidence: [EVD-6, EVD-15]
    assumptions: [ASM-8]
    reasoning: >-
      Second box of the right-hand chain. The June forum exchange shows this is
      not only a tooling question: who may change a consequential tree, and by
      what process, is still undecided.

  - id: NC-2
    type: necessary_condition
    statement: We have a tool for building trees and updating them
    status: confirmed
    confidence: high
    evidence: [EVD-6]

  - id: NC-3
    type: necessary_condition
    statement: We have a way of committing to action and tracking it against the trees
    status: confirmed
    confidence: high
    evidence: [EVD-9]
    assumptions: [ASM-4]

  - id: NC-4
    type: necessary_condition
    statement: There is one source of truth for the transition tree
    status: confirmed
    confidence: high
    evidence: [EVD-9]
    assumptions: [ASM-5]

  - id: NC-5
    type: necessary_condition
    statement: There is a known format for a transition tree in markdown
    status: confirmed
    confidence: high
    evidence: [EVD-9]

  - id: NC-6
    type: necessary_condition
    statement: There is a way to view the transition tree
    status: confirmed
    confidence: high
    evidence: [EVD-9]

  - id: NC-7
    type: necessary_condition
    statement: Tasks and actions are tracked against the tree nodes they serve
    status: confirmed
    confidence: high
    evidence: [EVD-9]

  # --- Necessary conditions under CSF-6 (reasons for adoption) ---

  - id: NC-8
    type: necessary_condition
    statement: We have evidence that the method and the tools work
    status: confirmed
    confidence: high
    evidence: [EVD-7, EVD-8]
    assumptions: [ASM-6]

  - id: NC-9
    type: necessary_condition
    statement: We have a convincing story of how and where LTP would help
    status: confirmed
    confidence: high
    evidence: [EVD-8]
    reasoning: >-
      Marked with one flame in the notes, and flagged there as possibly a UDE in
      its own right rather than a cause.

  - id: NC-10
    type: necessary_condition
    statement: We have an engaging and accessible vision, for others, of what we are doing
    status: confirmed
    confidence: high
    evidence: [EVD-7]

  - id: NC-11
    type: necessary_condition
    statement: We have agreed on user needs, offers, and vision
    status: confirmed
    confidence: high
    evidence: [EVD-7]

  # --- Necessary conditions under CSF-7 (integration into the forum) ---

  - id: NC-12
    type: necessary_condition
    statement: A finalized 2R goal tree exists that is fit to show
    status: confirmed
    confidence: high
    evidence: [EVD-10, EVD-17]

  - id: NC-13
    type: necessary_condition
    statement: It is decided which trees to show and how to present them usefully
    status: confirmed
    confidence: high
    evidence: [EVD-10]

  - id: NC-14
    type: necessary_condition
    statement: There is a process linking the trees to forum posts, so there is a pathway to discovering and enriching the trees
    status: confirmed
    confidence: high
    evidence: [EVD-10]

  # --- Cross-cutting necessary conditions ---

  - id: NC-15
    type: necessary_condition
    statement: The most salient information is presented to a viewer when they look at a tree
    status: confirmed
    confidence: high
    evidence: [EVD-12]
    assumptions: [ASM-7]
    reasoning: >-
      The notes call this "bespoke focusing", and the footnote says it is a UX
      cause sitting behind several other items, so it is attached to more than
      one success factor.

  - id: NC-16
    type: necessary_condition
    statement: Taking part in LTP is light enough that people do not have to master the formalism
    status: inferred
    confidence: high
    evidence: [EVD-12]
    reasoning: >-
      The inverse of the common cause "LTP is heavy duty and complex and
      taxing". Stated as a condition so that it can be tested.

  - id: NC-17
    type: necessary_condition
    statement: The trees are used as the source of truth for assessing progress and learning
    status: confirmed
    confidence: high
    evidence: [EVD-11]
    assumptions: [ASM-6]

  # --- Undesirable effects ---

  - id: UDE-1
    type: undesirable_effect
    statement: Nobody except Rufus and David is using LTP, so there is a lack of buy-in for it
    status: observed
    confidence: high
    evidence: [EVD-8]

  - id: UDE-2
    type: undesirable_effect
    statement: Rufus and David are not using LTP consistently
    status: observed
    confidence: high
    evidence: [EVD-9]
    reasoning: >-
      Marked with three flames in the notes, the highest priority of the four
      undesirable effects.

  - id: UDE-3
    type: undesirable_effect
    statement: LTP results and outputs are not showing up where the movement works, such as the forum and our presented materials
    status: observed
    confidence: high
    evidence: [EVD-10]

  - id: UDE-4
    type: undesirable_effect
    statement: The trees are not being used as a source of truth for assessing progress and learning
    status: observed
    confidence: high
    evidence: [EVD-11]

  # --- Causes ---

  - id: IC-1
    type: intermediate_cause
    statement: We do not have evidence that LTP is helping yet
    status: observed
    confidence: high
    evidence: [EVD-8]

  - id: IC-2
    type: intermediate_cause
    statement: People struggle with trees, structured thinking, and complexity
    status: observed
    confidence: high
    evidence: [EVD-8]

  - id: IC-3
    type: root_cause
    statement: We do not have a convincing story of how or where LTP would help
    status: observed
    confidence: high
    evidence: [EVD-8]
    reasoning: >-
      One flame in the notes, with David's own note that this could be an
      undesirable effect rather than a cause. Kept as a cause here and listed as
      an open question.

  - id: IC-4
    type: intermediate_cause
    statement: We have no way of committing to action
    status: observed
    confidence: high
    evidence: [EVD-9]
    assumptions: [ASM-4]
    reasoning: >-
      The named cause of the hottest undesirable effect, and the point every
      hypothesis in the notes aims at: a transition tree whose items are tracked
      in a tracker such as GitHub Issues. Treated as the current constraint.

  - id: IC-5
    type: root_cause
    statement: We have no tracker for tasks and actions
    status: observed
    confidence: high
    evidence: [EVD-9]

  - id: IC-6
    type: intermediate_cause
    statement: We have no source of truth for the transition tree
    status: observed
    confidence: high
    evidence: [EVD-9]
    assumptions: [ASM-5]

  - id: IC-7
    type: root_cause
    statement: We do not know the format for a transition tree in markdown
    status: observed
    confidence: high
    evidence: [EVD-9]

  - id: IC-8
    type: root_cause
    statement: We have no way to view a transition tree
    status: observed
    confidence: high
    evidence: [EVD-9]

  - id: IC-9
    type: intermediate_cause
    statement: We have not finalized a 2R goal tree
    status: observed
    confidence: high
    evidence: [EVD-10]

  - id: IC-10
    type: root_cause
    statement: It is not decided which trees we want to show
    status: observed
    confidence: high
    evidence: [EVD-10]

  - id: IC-11
    type: intermediate_cause
    statement: It is not decided how to present the trees usefully
    status: observed
    confidence: high
    evidence: [EVD-10]

  - id: IC-12
    type: root_cause
    statement: We have no automated process linking the trees to forum posts, so there is no pathway to discovering or enriching them
    status: observed
    confidence: high
    evidence: [EVD-10]

  - id: IC-13
    type: root_cause
    statement: The most salient information is not presented to the viewer when they look at a tree, for example on our website
    status: observed
    confidence: high
    evidence: [EVD-12]
    assumptions: [ASM-7]
    reasoning: >-
      Listed in the notes under causes common to several items, with the footnote
      that it is a UX cause behind several of them. Modelled as a cause of
      UDE-1, UDE-3, UDE-4, and of IC-11.

  - id: IC-14
    type: root_cause
    statement: LTP is heavy duty, complex, and taxing
    status: observed
    confidence: high
    evidence: [EVD-12]
    reasoning: >-
      The second cause common to several items. It bears on both the authors'
      own inconsistent use and other people's difficulty with the method.

  # --- Actions and expected effects ---

  - id: ACT-1
    type: action
    statement: Define a markdown format for a transition tree and commit one filled-in transition tree to the 2R-Research repo as its single source of truth
    status: inferred
    confidence: high
    evidence: [EVD-9]
    prerequisites: []
    likely_scope: "2R-Research: ltp/07-transition-tree.md, ltp/ltp-model.yaml"
    verification: A named path holds a transition tree whose actions each cite the tree entity they serve, and Rufus can read and comment on it without further explanation.
    risk: The format is designed once and abandoned because maintaining it is more onerous than the whiteboard it replaces.
    rollback: The file is text under version control and can be reverted or reduced to a flat action list.
    reasoning: >-

      repo knowledgebase"). It comes first because tracking and viewing both
      need something canonical to point at.

    status: inferred

    risk: Issues drift out of step with the tree and a second, contradictory source of truth appears.
    rollback: Issues are closed and the transition tree remains authoritative on its own.
    reasoning: >-
      The notes' hypothesis for IC-5, with its own stated purpose: replace verbal
      tracking and give a live display of progress as the method is dog-fooded.

  - id: TR-2
    type: expected_effect
    statement: Every committed action has a tracked item traceable to a tree node, and progress becomes visible while the method is dog-fooded
    status: inferred
    confidence: high
    evidence: [EVD-9]

  - id: ACT-3
    type: action
    statement: Ship a transition-tree view in the dashboard so current actions can be read without opening YAML
    status: inferred
    confidence: high
    evidence: [EVD-9]
    prerequisites: [ACT-1]
    likely_scope: "logical-thought-process-issue-trees-app: skills/project-ltp/dashboard/src"
    verification: David and Rufus each open the dashboard and correctly say what the current action is and which condition it serves, without help.
    risk: Effort goes into the viewer while the underlying commitments are still not being kept.
    rollback: The view is additive; the markdown transition tree stays readable if it is removed.
    reasoning: The notes' hypothesis for IC-8.

  - id: TR-3
    type: expected_effect
    statement: David and Rufus can see current actions against the tree, so reviewing progress does not require reading the model source
    status: inferred
    confidence: high
    evidence: [EVD-9]

  - id: ACT-4
    type: action
    statement: Decide which 2R trees to show and how, then finalize and publish that version of the 2R goal tree
    status: inferred
    confidence: medium
    evidence: [EVD-10, EVD-17]
    prerequisites: []
    likely_scope: "2R-Research: docs/ltp_trees/; the published site"
    verification: One named, dated version of the 2R goal tree is public and can be linked from a forum post.
    risk: Finalizing unilaterally repeats the June problem, where revisions had no agreed process and one person decided.
    rollback: Versions are dated, so a published version can be superseded rather than deleted.
    reasoning: >-
      Addresses IC-9, IC-10, and IC-11. It needs an answer to NC-1 first if it is
      not to be decided unilaterally.

  - id: TR-4
    type: expected_effect
    statement: One canonical, presentable 2R goal tree exists, so forum posts and presented materials have something stable to point at
    status: inferred
    confidence: medium
    evidence: [EVD-10]

  - id: ACT-5
    type: action
    statement: Link a batch of real forum and WhatsApp posts to tree nodes by hand, then judge from that what is worth automating
    status: inferred
    confidence: medium
    evidence: [EVD-10]
    prerequisites: [ACT-4]
    likely_scope: "2R-Research: an annotation log; forum posts"
    verification: A recorded batch of posts is mapped to tree nodes, with the time taken per post and the share of posts that map to nothing.
    risk: Manual mapping is done once, reads as busywork, and yields no decision about automation.
    rollback: The mapping log is an addition; nothing in the forum changes.
    reasoning: >-
      The notes raise automation as an open question ("How would we automate this
      from e.g. whatsapp posts?"). Measuring the manual path first is what makes
      that question answerable.

  - id: TR-5
    type: expected_effect
    statement: A measured manual pathway from discussion to tree exists, with evidence about which part of it is worth automating
    status: inferred
    confidence: medium
    evidence: [EVD-10]

  - Is "we don't have a convincing story of how or where LTP would help" a cause of low buy-in, or an undesirable effect in its own right? The notes flag it both ways.
  - "Which is the throughput unit for this system: new users of LTP and its outputs, as the whiteboard says, or duly improved 2R LTP trees, as David and Rufus agreed in July?"
  - What does the "Learning" box on the whiteboard mean, and is it distinct from the two Results boxes?
  - Is "discussion on the 2R forum is more productive and cumulative" the benefit to aim at? David wrote it with a question mark.
  - Who has standing to update the 2R goal tree, and by what process? Open since June and still unanswered.
  - What counts as a new user of LTP or its outputs, over what period, and how would it be observed?

contradictions:
  - The whiteboard defines throughput as new users of LTP and its outputs, while the July exchange with Rufus agreed the research group's throughput is duly improved 2R LTP trees. These are different units and imply different priorities.
  - Having no evidence that LTP is helping yet is given as a cause of low buy-in, but the trees are also not being used to assess progress, so that evidence cannot accumulate. The two reinforce each other and neither is prior.
  - Adoption is wanted movement-wide, yet the format, tracker, and viewer needed to sustain it do not exist even for the two people who built the method.
  - Discoverability work such as the Bluesky bridge was attempted while the trees were, by David's own account, not mature enough for the suggestions to be poignant.

  - No forum export, WhatsApp export, or website analytics was supplied, so the claims about the forum and about discoverability rest on the notes alone.
  - No funding target, budget, or funder conversation was supplied, so CSF-9 has no conditions beneath it beyond agreement on needs and offers.
  - The whiteboard's "Learning" and "Results" axis labels were transcribed in full but only partly interpreted.
  - The five prior trees under docs/ltp_trees/ describe 2R proper. They are cited as context and were not re-analysed.
  - No evidence was supplied about the third and fourth undesirable effects beyond the single lines in the notes.

evidence:
  - id: EVD-1
    source: examples/individual-swe-notes/journal.md
    lines: "3-8"
    observation: Outside-work groups (a reading group, an open-source project, the condo board) have real conversations that shift something, then the group's shared position reverts because nothing durable came out of the conversation itself.
    interpretation: Suggests the durable-vs-evaporating pattern is a general personal concern, not specific to one team.
  - id: EVD-2
    source: examples/individual-swe-notes/projects.md
    lines: "3-6"
    observation: The team relitigates the same three or four decisions every few months because the rationale, not just the message history, is unfindable.
    interpretation: Names a concrete undesirable effect and its likely cause — missing rationale, not missing information.
  - id: EVD-3
    source: examples/individual-swe-notes/projects.md
    lines: "8-14"
    observation: Proposed fix — give each decision a stable ID, a one-paragraph rationale, alternatives considered, and a status, designed so writing it down is the fast path.
    interpretation: A specific, already-designed injection, not just an aspiration.
  - id: EVD-4
    source: examples/individual-swe-notes/todo.md
    lines: "6"
    observation: A TODO item to migrate the team wiki off scattered pages into something with real structure.
    interpretation: A second, related structural fix for team knowledge findability.
  - id: EVD-5
    source: examples/individual-swe-notes/journal.md
    lines: "14-16"
    observation: Mentoring Sam and Dev this quarter was more energizing than almost anything else, with an explicit wish to do more of it deliberately.
    interpretation: Signals mentoring as a distinct, valued line of effort, not incidental.
  - id: EVD-6
    source: examples/individual-swe-notes/todo.md
    lines: "7"
    observation: A TODO item to mentor Sam and Dev through their first design doc each.
    interpretation: The concrete next mentoring action.
  - id: EVD-7
    source: examples/individual-swe-notes/todo.md
    lines: "3"
    observation: A TODO item to ship v2 of the decision-log tool.
    interpretation: The concrete next action on the decision-log injection.
  - id: EVD-8
    source: examples/individual-swe-notes/todo.md
    lines: "4"
    observation: A TODO item to write an internal post on why the team keeps re-deciding the same thing.
    interpretation: A communication action meant to build shared recognition of the problem, not just document it.
  - id: EVD-9
    source: examples/individual-swe-notes/journal.md
    lines: "10-12"
    observation: "An explicit generalization: there might be something more general here about how groups accumulate agreement instead of just accumulating meetings."
    interpretation: The clearest direct evidence for the inferred personal goal.
  - id: EVD-10
    source: examples/individual-swe-notes/todo.md
    lines: "8"
    observation: A TODO item to send a small PR upstream to a CRDT library for a tombstone garbage-collection edge case.
    interpretation: Routine open-source maintenance with no stated connection to the durable-learning theme; kept as a low-relevance control case.

    source: examples/individual-swe-notes/projects.md
    lines: "16-17"

    interpretation: The explicit target expected effect for the decision-log injection.

evidence:
  - id: EVD-1
    source: docs/ltp_trees/Goal Tree_ Second Renaissance.md
    lines: "1-24"
    observation: The document states the Second Renaissance goal and eight critical success factors.
    interpretation: It supplies the intended destination, but not participant confirmation that the hierarchy is necessary and sufficient.
  - id: EVD-2
    source: docs/ltp_trees/Current Reality Tree_ Second Renaissance.md
    lines: "5-13"
    observation: The system is a Second Renaissance group and throughput is defined as durable adoption by people, groups, and institutions.
    interpretation: The analysis boundary and candidate goal unit are explicit.
  - id: EVD-3
    source: docs/ltp_trees/Current Reality Tree_ Second Renaissance.md
    lines: "17-51"
    observation: Fifteen UDEs are listed, including weak practice conversion, organizer overload, fragile pockets, and weak replication.
    interpretation: These are candidate symptoms, not yet lived observations, because the same document calls the CRT provisional.
  - id: EVD-4
    source: docs/ltp_trees/Current Reality Tree_ Second Renaissance.md
    lines: "55-81"
    observation: Six candidate root causes are named, including missing map governance, throughput definition, conversion pathway, embodied practice, dense containers, and learning rhythm.
    interpretation: The wording explicitly treats them as candidates.
  - id: EVD-5
    source: docs/ltp_trees/Current Reality Tree_ Second Renaissance.md
    lines: "291-317"
    observation: The document identifies the likely constraint as a missing conversion architecture from interest through replication.
    interpretation: This is the strongest supplied constraint hypothesis, not a confirmed bottleneck.
  - id: EVD-6
    source: docs/ltp_trees/Current Reality Tree_ Second Renaissance.md
    lines: "321-346"
    observation: The document says a real CRT must test its UDEs, causal arrows, missing causes, and sphere of influence against lived evidence.
    interpretation: Model validation is the earliest unresolved prerequisite.
  - id: EVD-7
    source: docs/ltp_trees/Conflict Resolution_ Second Renaissance.md
    lines: "496-524"
    observation: The core cloud contrasts movement scale and visibility with monastery/laboratory depth and proposes broad invitation around protected practice pockets.
    interpretation: The proposed injection aims to pursue reach through depth rather than trade one for the other.
  - id: EVD-8
    source: docs/ltp_trees/Future Reality Tree_ Second Renaissance.md
    lines: "17-39"
    observation: The first injection is a versioned stewardship protocol with objections, evidence standards, decision rules, stewards, and review cadence.
    interpretation: The model itself is intended to be governed before it directs consequential work.
  - id: EVD-9
    source: docs/ltp_trees/Future Reality Tree_ Second Renaissance.md
    lines: "41-68"
    observation: The FRT proposes an operational throughput definition, staged conversion architecture, and layered participation.
    interpretation: These injections directly target the candidate constraint and an inclusivity/coherence conflict.
  - id: EVD-10
    source: docs/ltp_trees/Future Reality Tree_ Second Renaissance.md
    lines: "72-113"
    observation: The FRT proposes learning cadence, graduated stewardship, dense pockets, a replication library, and monthly constraint review.
    interpretation: The future state depends on a reinforcing operational system, not one standalone program.
  - id: EVD-11
    source: docs/ltp_trees/Future Reality Tree_ Second Renaissance.md
    lines: "522-629"
    observation: The negative-branch analysis identifies reductive metrics, manipulative conversion, status hierarchy, insular pockets, and shallow replication, with trims for each.
    interpretation: These risks must remain coupled to the injections during implementation.
  - id: EVD-12
    source: docs/ltp_trees/Prerequisite Tree_ Second Renaissance.md
    lines: "80-112"
    observation: The entry-level prerequisites require clear, plain-language, transparent, consent-based, exit-friendly pathways.
    interpretation: An entry pathway is only acceptable if it preserves participant agency.
  - id: EVD-13
    source: docs/ltp_trees/Prerequisite Tree_ Second Renaissance.md
    lines: "126-160"
    observation: The practice prerequisites call for recurring practice, progressive depth, and safety standards.
    interpretation: A first-practice step is insufficient without repetition, differentiation, and safeguards.
  - id: EVD-14
    source: docs/ltp_trees/Prerequisite Tree_ Second Renaissance.md
    lines: "173-215"
    observation: Contribution prerequisites include role clarity, graduated stewardship, and responsibility-not-worth norms.
    interpretation: Distributed leadership requires explicit quality and status safeguards.
  - id: EVD-15
    source: docs/ltp_trees/Prerequisite Tree_ Second Renaissance.md
    lines: "219-275"
    observation: Container prerequisites include dense practice, sangha support, outward service, governance, and conflict practice.
    interpretation: Pocket density and wider social connection must be designed together.
  - id: EVD-16
    source: docs/ltp_trees/Prerequisite Tree_ Second Renaissance.md
    lines: "278-322"
    observation: Replication prerequisites require documentation, maturity ratings, and explicit adaptation principles.
    interpretation: Portability should follow evidence of maturity rather than precede it.
  - id: EVD-17
    source: docs/ltp_trees/Prerequisite Tree_ Second Renaissance.md
    lines: "329-372"
    observation: Movement and institutional work are placed after pocket learning and concrete pattern packaging.
    interpretation: Scaling without grounded practice is treated as a negative branch.
  - id: EVD-18
    source: docs/ltp_trees/Prerequisite Tree_ Second Renaissance.md
    lines: "452-482"
    observation: The key dependency chain starts with update governance and provisional validation, then moves through throughput, entry, practice, stewardship, pockets, documentation, and replication; a Transition Tree is explicitly missing.
    interpretation: The first executable transition should establish a trusted provisional model before downstream implementation.
  - id: EVD-19
    source: PLAN.md (removed 2026-08-15; planning moved to GitHub issues — see git history for the file as of 2026-07-24)
    lines: "29-58"
    observation: The repository dashboard is implemented on a toy fixture and is intended to be checked on a new model.
    interpretation: This normalization is also the first documented non-toy dashboard use in the repository.

open_questions:
  - Do actual participants confirm G-1 as the operating goal and the supplied system boundary?
  - Which listed UDEs are observed now, by whom, and with what evidence?
  - Is conversion architecture truly the current constraint, or are governance, facilitator capacity, funding, trust, or another cause tighter?
  - What minimum duration and evidence qualifies an adoption event as durable?
  - Who has authority to accept, dispute, revise, or retire entities and causal links?
  - Which protected floors must no throughput optimization violate?

contradictions:
  - The CRT presents a likely system constraint while also stating that its UDEs and causal arrows have not been validated against lived evidence.
  - The source defines throughput operationally in prose while simultaneously naming the absence of an accepted operational throughput definition as a root cause.
  - The PRT calls governance and model validation first, whereas the CRT working conclusion foregrounds throughput definition and conversion architecture.
  - The source set contains no Transition Tree even though the PRT identifies it as the next required LTP artifact.

coverage_gaps:
  - No participant interviews, meeting records, activity logs, adoption records, or group decisions were supplied.
  - No owners, dates, resource limits, safeguarding policy, or external constraints accompany the proposed injections.
  - The documents reference Second Renaissance whitepapers and a How paper that were not present in docs/ltp_trees.
  - No historical observations support a throughput.yaml; none was created.
  - Five supplied documents were normalized; no separate Transition Tree source existed, so that view is inferred.
