evidence:
  - id: EVD-1
    source: docs/notes/2026-07-24-goal-and-throughput-whiteboard.md
    lines: "10-13"
    observation: Two vision boxes — the world thinks better and collaborates better using trees, and we are connecting solutions to problems.
    interpretation: These sit above the goal and are not conditions this system can be held to.
  - id: EVD-2
    source: docs/notes/2026-07-24-goal-and-throughput-whiteboard.md
    lines: "15-28"
    observation: >-
      "2R movement adopts LTP and benefits from it" leads by an if-then arrow,
      through a Learning box, to "A (more) effective and healthy 2R movement".
      Two marginal notes define adoption: a non-trivial subset of the movement
      actively using it, and it being used e.g. on the forum so that even people
      not bought in benefit.
    interpretation: The goal is adoption plus benefit; the marginal notes are the test for whether adoption has happened.
  - id: EVD-3
    source: docs/notes/2026-07-24-goal-and-throughput-whiteboard.md
    lines: "30"
    observation: "Throughput: new users of LTP and its outputs (people discover 2R via this)."
    interpretation: The goal unit is people newly using LTP or its outputs, not trees edited, papers written, or meetings held.
  - id: EVD-4
    source: docs/notes/2026-07-24-goal-and-throughput-whiteboard.md
    lines: "25-28"
    observation: >-
      Under the Results axis: discussion on the 2R forum is more productive and
      cumulative (written with a question mark), and these tools help the 2R
      movement learn and improve by assessing measurable progress towards its
      goals.
    interpretation: These are what "benefits from it" means. The question mark makes the first one provisional.
  - id: EVD-5
    source: docs/notes/2026-07-24-goal-and-throughput-whiteboard.md
    lines: "32-35"
    observation: Below the left CSF line, two unfinished boxes — "Reasons for adoption ..." and "Integrated into forum".
    interpretation: Two success factors were named but not decomposed on the board.
  - id: EVD-6
    source: docs/notes/2026-07-24-goal-and-throughput-whiteboard.md
    lines: "37-43"
    observation: A necessity chain — 2RR adopt 2R goal tree updating as their goal, then we can update the 2R goal tree, then we have a tool for building trees and updating them.
    interpretation: The dogfooding branch. Its top box becomes a success factor once movement-wide adoption is taken as the goal.
  - id: EVD-7
    source: docs/notes/2026-07-24-goal-and-throughput-whiteboard.md
    lines: "45-52"
    observation: >-
      Below the right CSF line: evidence this method and tools work; people
      discovering the vision and tools beyond David and Rufus and beyond 2R, for
      example Bluesky; an engaging and accessible vision for others; funding to
      build the tools and docs we want; agreement on user needs, offers, and
      vision.
    interpretation: Five success factors stated flat on the board; four of them are treated here as what "reasons for adoption" consists of.
  - id: EVD-8
    source: docs/notes/2026-07-30-problem-tree-notes.txt
    lines: "2-5"
    observation: >-
      UDE — people aren't using LTP other than Rufus and David, i.e. a lack of
      buy-in. Causes: no evidence it's helping yet; people struggle with trees,
      structured thinking, and complexity; no convincing story of how or where it
      would help (one flame, flagged as possibly a UDE).
    interpretation: Buy-in has three named causes, one of which David suspects is itself an effect.
  - id: EVD-9
    source: docs/notes/2026-07-30-problem-tree-notes.txt
    lines: "6-11"
    observation: >-
      UDE with three flames — Rufus and David are not using LTP consistently.
      Cause: no way of committing to action, with the hypothesis of a transition
      tree tracked in something like GitHub Issues. Beneath it: no tracker for
      tasks or actions (hypothesis — GitHub Issues or Linear linked 1:1 to
      transition and prerequisite tree nodes, replacing verbal tracking and
      giving a live display of progress as the method is dog-fooded); no source
      of truth for the transition tree (hypothesis — use the GitHub repo
      knowledgebase); no known markdown format for a transition tree; no way to
      view it.
    interpretation: The highest-priority effect, with the most fully specified cause chain and hypotheses in the notes. This is the basis for the transition tree.
  - id: EVD-10
    source: docs/notes/2026-07-30-problem-tree-notes.txt
    lines: "12-17"
    observation: >-
      UDE — LTP is not showing up on the forum or in presented materials.
      Causes: no finalized 2R goal tree, itself caused by undecided questions of
      which trees to show and how to present them usefully; and no automated
      process linking the tree to forum posts, so there is no pathway to
      discovering or enriching it. An open question asks how this could be
      automated from, for example, WhatsApp posts.
    interpretation: Output visibility has both a decision cause and a plumbing cause.
  - id: EVD-11
    source: docs/notes/2026-07-30-problem-tree-notes.txt
    lines: "18"
    observation: UDE — the trees are not being used as a source of truth for assessing progress and learning.
    interpretation: Stated without causes in the notes; connected here to the authors' inconsistent use and to the presentation cause.
  - id: EVD-12
    source: docs/notes/2026-07-30-problem-tree-notes.txt
    lines: "19-21, 37"
    observation: >-
      Causes common to several items — the most salient information is not
      presented to the viewer when they look at trees, for example on our website
      (bespoke focusing); and LTP is heavy duty, complex, and taxing. A footnote
      on the first says it is a UX cause behind several other items.
    interpretation: Two cross-cutting causes, one of which the notes explicitly mark as multi-effect.
  - id: EVD-13
    source: docs/notes/2026-07-30-problem-tree-notes.txt
    lines: "24-26"
    observation: A "Conflict Resolution" heading followed by two empty Intermediate Objective bullets.
    interpretation: The conflict work was started and left blank, so no evaporating cloud is built from these notes.
  - id: EVD-14
    source: docs/prompts/LTP_BACKGROUND_PROMPT.md
    lines: "153-169"
    observation: Rufus asks whether the focus is research circle throughput; David distinguishes 2R-wide throughput from research group throughput and says the latter is that the 2R LTP trees are duly updated; Rufus agrees.
    interpretation: Supports the dogfooding success factor, and stands in tension with the whiteboard's throughput unit.
  - id: EVD-15
    source: docs/prompts/LTP_BACKGROUND_PROMPT.md
    lines: "51-61"
    observation: Revision suggestions from Rufus and Margaret had no process for disposition; David argued that deciding how the trees get updated must precede defining throughput, and said he would not make further unilateral updates.
    interpretation: "\"We can update the 2R goal tree\" is a governance condition as much as a tooling one, and it has been open since June."
  - id: EVD-16
    source: docs/prompts/LTP_BACKGROUND_PROMPT.md
    lines: "115-121"
    observation: A platform experiment framed the central problem as the empty dancefloor, proposed a Bluesky bridge, and noted that suggestions were not poignant enough because the trees were immature and the matching was weak.
    interpretation: Prior evidence for the discoverability success factor, and a caution that discoverability work outran tree quality.
  - id: EVD-17
    source: "docs/ltp_trees/Goal Tree_ Second Renaissance.md"
    lines: "1-24"
    observation: A 2R goal tree exists in the repository, aiming at a wiser, weller, regenerative civilization through eight success factors.
    interpretation: The tree that "we have not finalized a 2R goal tree" refers to exists in draft; what is missing is an agreed, presentable version.

assumptions:
  - id: ASM-1
    statement: David and Rufus are, for the time being, the same system as the 2R Research Circle.
    status: confirmed
  - id: ASM-2
    statement: If the two people who built the method do not use it consistently, the rest of the movement will not adopt it.
    status: inferred
  - id: ASM-3
    statement: Adoption requires that people can benefit from LTP outputs without doing tree work themselves.
    status: confirmed
  - id: ASM-4
    statement: Written, tracked commitments are what turn a tree into consistent practice.
    status: provisional
  - id: ASM-5
    statement: A tree cannot function as a source of truth without one canonical location and format.
    status: inferred
  - id: ASM-6
    statement: Evidence that LTP helps can only accumulate if the trees are actually used to assess progress.
    status: inferred
  - id: ASM-7
    statement: Presentation, rather than the logic itself, is what currently stops people getting value from a tree.
    status: provisional
  - id: ASM-8
    statement: The 2R goal tree is consequential enough that it must not be revised unilaterally.
    status: confirmed
  - id: ASM-9
    statement: Throughput for this system is new users of LTP and its outputs, not papers, meetings, or tree edits.
    status: confirmed

