# from this repository's own statements of purpose, and from every open issue here. Nothing in it
# is accepted until it is ratified in the app; the report beside it (reason-commons.report.md)
# names every judgment call, every issue's placement, and what was deliberately left out.
#
# Provenance locators: a path with #L<n> is a line in this repository at the commit this file
# was authored against; a blob URL is a line in the app repository at a pinned commit; an issue
# URL is the issue itself (a fragment names the part of the issue a proposition comes from);
# reason-commons.report.md#... is a dated platform observation recorded in the report.
#
# Once commons 3 is connected to this repository, the platform's export at
# .reason-commons/<space-id>.ltp.json becomes the record of the model; this file stays as the
# candidate it was imported from. The views are listed last-tree-first, as the app's own example
# does: the order an import is agreed in is derived from what each claim waits for.
