      - {source_id: analysis-v2, locator: 'p. 2, G3', basis: reconstruction}
    - id: g2-g-control
      kind: necessary_condition
      text: Members retain substantive control, justified trust and meaningful freedom to disagree or leave.
      label: Members retain control, justified trust and freedom to disagree or leave.
      status: proposed
      contributions: *reconstruction
      source_refs:
      - {source_id: forum, post: 20, author: leif, basis: paraphrase}
      - {source_id: forum, post: 29, author: leif, basis: paraphrase}
      - {source_id: forum, post: 19, author: robert, basis: related}
      - {source_id: forum, post: 28, author: robert, basis: related}
      - {source_id: last-first, locator: sections 3–4, basis: cited}
      - {source_id: paradox, locator: sections 8–9, basis: cited}
      - {source_id: analysis-v2, locator: 'p. 2, G2, G4 and G5', basis: reconstruction}
    - id: g2-g-future
      kind: necessary_condition
      text: Ecological and catastrophic risks remain compatible with continued human life and collective agency.
      label: Ecological and catastrophic risks remain compatible with continued human agency.
      status: proposed
      contributions: *reconstruction
      source_refs:
      - {source_id: forum, post: 26, author: leif, basis: paraphrase}
      - {source_id: forum, post: 27, author: robert, basis: paraphrase}
      - {source_id: forum, post: 21, author: robert, basis: related}
      - {source_id: carbon-pulse, locator: ecological limits, basis: cited}
