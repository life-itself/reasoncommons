      - {source_id: analysis-v2, locator: 'p. 20, A06', basis: reconstruction}
      assumptions:
      - {by: assistant, text: An enabling route only where the corresponding obstacle is real; supporting policy must also address actual harms and capture risks.}
    backlog:
    - ref: g2-f-guidance
      work: test_causality
      label: Compare AI guidance with optional-AI and human approaches.
      note: Check useful output, total cost, energy, member control, fallback and competence without the tool. Participants have not committed to running this comparison.
    - ref: g2-f-rel-f05
      work: test_causality
      label: Decide in advance what evidence would change the hypothesis.
      note: Lower satisfaction scores or fewer complaints alone do not establish benefit. The first analysis asks whether small democratic groups gain more than hierarchies; the second distinguishes local improvements from the still-unclosed institutional-selection claim F17. One successful pilot cannot establish the larger claim.
    - ref: g2-f-rel-harm
      work: examine_assumption
      label: Assess suppressed grievances separately from satisfaction.
      note: Retain independent human support and a way to report costs, unfairness, dependency and increased concentration of authority.
    - ref: g2-f-rel-f02
      work: test_causality
      label: 'Test 1: does reflection become transferable judgment, not just agreeable dialogue?'
      note: 'Prediction: against a suitable comparison, participants identify and revise consequential assumptions, consider contrary perspectives and act differently on later tasks. Defeated if benefits vanish outside the dialogue, depend on agreeing with the facilitator, or weaken independent judgment. Protect voluntary participation, correction and human support; no ontology score as the outcome.'
      source_refs:
      - {source_id: forum, post: 20, author: leif, basis: related}
      - {source_id: forum, post: 23, author: leif, basis: related}
      - {source_id: analysis-v2, locator: 'p. 42, T1', basis: reconstruction}
    - ref: g2-f-rel-f05
      work: test_causality
      label: 'Test 2: does conflict guidance reduce destructive costs and the pressure to centralise?'
      note: 'Prediction: over a defined period and comparison, destructive conflict costs and unnecessary hierarchical intervention fall while fair treatment, independent competence and member influence hold or improve. Defeated if only satisfaction or complaint counts improve, costs move elsewhere, structural grievances are hidden or authority concentrates. Protect confidentiality, voluntariness and independent human help, and measure justice, capability and control separately.'
      source_refs:
      - {source_id: forum, post: 29, author: leif, basis: related}
      - {source_id: paradox, locator: section 9, basis: cited}
      - {source_id: analysis-v2, locator: 'p. 42, T2', basis: reconstruction}
    - ref: g2-f-rel-f06
      work: test_causality
      label: 'Test 3: does community-controlled AI give useful capability with practical autonomy?'
      note: 'Prediction: the same useful service meets agreed quality and whole-cost limits, and migration or disruption tests show acceptable continuity without depending on a provider’s discretion. Defeated if quality or cost is unacceptable, one specialist stays indispensable, or exit and continuity fail in practice. Stage investment, keep the baseline service and test a feasible fallback.'
      source_refs:
      - {source_id: forum, post: 28, author: robert, basis: related}
      - {source_id: forum, post: 30, author: robert, basis: related}
      - {source_id: forum, post: 33, author: leif, basis: related}
      - {source_id: forum, post: 34, author: robert, basis: related}
      - {source_id: analysis-v2, locator: 'p. 42, T3', basis: reconstruction}
    - ref: g2-f-rel-f07
      work: test_causality
      label: 'Test 4: does the Forge produce stable benefits and its claimed resource advantage?'
      note: 'Prediction: a reproducible adaptation beats controls on held-out useful tasks and critical reflection without relevant regressions, and any energy claim is measured for comparable output. Defeated if only philosophical self-reports change, gains reflect selected prompts, other capabilities regress or resource costs do not improve. Keep functional performance, consciousness claims, model preferences and energy separate, and retain rollback.'
      source_refs:
      - {source_id: bindings, locator: sections 11.4 and 13.2.1–13.5, basis: cited}
      - {source_id: analysis-v2, locator: 'p. 43, T4', basis: reconstruction}
    - ref: g2-f-rel-f09
      work: test_causality
      label: 'Test 5: does federation supply coordination without a new centre of domination?'
      note: 'Prediction: the joint service improves coordination at acceptable cost while decision rights, exit and continuity survive disputed decisions and the loss of a participant. Defeated if coordination costs exceed gains, a gatekeeper gains unilateral control, or nominal decentralisation hides dependence. Keep authority traceable, updates bounded and reversible, exit meaningful and evaluation independent.'
      source_refs:
      - {source_id: paradox, locator: section 7, basis: cited}
      - {source_id: bindings, locator: section 13.2.4, basis: cited}
      - {source_id: analysis-v2, locator: 'p. 43, T5', basis: reconstruction}
    - ref: g2-f-rel-f19
      work: test_causality
      label: 'Test 6: do AI-assisted innovation and distributed provision improve services within limits?'
      note: 'Prediction: a physically verified, deployed option meets the service requirements, whole costs, ownership conditions and total ecological limits within the transition window. Defeated if results stay at prediction or laboratory stage, essential inputs are unavailable, deployment comes too late, or total demand offsets efficiency. Keep readiness stages separate and preserve essential provision if the transition is delayed or fails.'
      source_refs:
      - {source_id: forum, post: 33, author: leif, basis: related}
      - {source_id: forum, post: 34, author: robert, basis: related}
      - {source_id: carbon-pulse, locator: maturity stages, basis: cited}
      - {source_id: analysis-v2, locator: 'p. 43, T6', basis: reconstruction}
    - ref: g2-f-rel-f13
      work: test_causality
      label: 'Test 7: do constructive practices reproduce and keep their mission under growth?'
      note: 'Prediction: independent sites enact the practice and keep useful performance, justified trust and member control through an agreed period and changes in scale. Defeated if originators stay essential, adoption is symbolic, costs are hidden, or market success comes with democratic erosion. Measure selection within institutions separately from survival and adoption between them.'
      source_refs:
      - {source_id: forum, post: 29, author: leif, basis: related}
      - {source_id: last-first, locator: sections 4 and 8, basis: cited}
      - {source_id: paradox, locator: sections 6 and 10, basis: cited}
      - {source_id: analysis-v2, locator: 'p. 43, T7', basis: reconstruction}
    - ref: g2-f-rel-f22
      work: test_causality
      label: 'Test 8: can security inquiry contribute to less escalatory institutions?'
      note: 'Prediction: a proposal survives critical review, is implemented by empowered actors and produces observable reciprocal compliance and less escalatory conduct without sacrificing protected rights. Defeated if only the discussion improves, powerful actors ignore the rules, or a coalition increases threats and armament. Require verification, accountability, rights protection and explicit review of escalatory effects.'
      source_refs:
      - {source_id: forum, post: 23, author: leif, basis: related}
      - {source_id: forum, post: 26, author: leif, basis: related}
      - {source_id: analysis-v2, locator: 'p. 44, T8', basis: reconstruction}
    - ref: g2-f-rel-f08
      work: test_causality
      label: 'Test 9: do voice participation and the field-learning loop improve real deliberation?'
      note: 'Prediction: against a conversational baseline, the group handles important assumptions and decisions better without reduced participation or unapproved collection, and approved learning material leads to a separately tested improvement. Defeated if latency or interruption reduces participation, the AI becomes an authority, or no benefit outlasts conversational appeal. Keep human interruption and correction, voluntary participation, confidentiality and separate permission for any training use.'
      source_refs:
      - {source_id: forum, post: 13, author: leif, basis: related}
      - {source_id: forum, post: 23, author: leif, basis: related}
      - {source_id: bindings, locator: section 13.2.2, basis: cited}
      - {source_id: analysis-v2, locator: 'p. 44, T9', basis: reconstruction}
    - ref: g2-f-rel-f14
      work: test_causality
      label: 'Test 10: does justified trust become a practical institutional advantage?'
      note: 'Prediction: where people have feasible alternatives and comparable service, trustworthy conduct supports voluntary participation, sustained cooperation and useful contributions while member agency stays intact. Defeated if reported confidence rises without warranted conduct, people cannot really choose, or resources and authority concentrate despite adoption. Record conduct, confidence, freedom to choose, cooperation and decision rights separately, and do not infer justice from market success.'
      source_refs:
      - {source_id: forum, post: 13, author: leif, basis: related}
      - {source_id: last-first, locator: sections 3–4 and 9, basis: cited}
      - {source_id: paradox, locator: section 6, basis: cited}
      - {source_id: analysis-v2, locator: 'p. 44, T10', basis: reconstruction}
    - ref: g2-f-rel-f17
      work: examine_assumption
      label: Is changing which institutions get selected the deepest leverage available?
      note: Show whether a capability, governance or material change improves durable humane outcomes more than a human-development, institutional or non-AI comparator. Leif argues AI may be the deepest leverage point; Robert locates it in the power to transcend paradigms, and Leif has asked him to confirm or correct that reading.
      source_refs:
      - {source_id: forum, post: 33, author: leif, basis: related}
      - {source_id: forum, post: 35, author: robert, basis: related}
      - {source_id: forum, post: 36, author: leif, basis: related}
      - {source_id: analysis-v2, locator: 'p. 46, open claims', basis: reconstruction}
    - ref: g2-f-i03
      work: examine_assumption
      label: Is engagement with AI necessary for lasting emancipation?
      note: Identify the particular function and competitive threat, and compare adequate non-AI and optional-AI arrangements. Historical recurrence alone does not establish future necessity.
      source_refs:
      - {source_id: forum, post: 20, author: leif, basis: related}
      - {source_id: forum, post: 30, author: robert, basis: related}
      - {source_id: forum, post: 33, author: leif, basis: related}
      - {source_id: analysis-v2, locator: 'p. 46, open claims', basis: reconstruction}
    - ref: g2-f-i04
      work: examine_assumption
      label: Does philosophical coherence give a computational or energy advantage?
      note: This needs matched useful-task and resource measurements on reproducible variants, with performance, inference effort, hardware and total costs kept distinct.
      source_refs:
      - {source_id: bindings, locator: sections 11.4 and 13, basis: cited}
      - {source_id: analysis-v2, locator: 'p. 46, open claims', basis: reconstruction}
    - ref: g2-f-i06
      work: examine_assumption
      label: Does a distributed architecture resist all three structural fates?
      note: Exercise actual dependencies, control rights, update integrity, loss of participants and credible capture routes; replace claims of immunity with bounded, demonstrated resilience.
      source_refs:
      - {source_id: bindings, locator: chapter 4 and section 13.2.4, basis: cited}
      - {source_id: analysis-v2, locator: 'p. 46, open claims', basis: reconstruction}
    - ref: g2-f-i08
      work: examine_assumption
      label: Can AI research change the energy transition in time?
      note: Track readiness and deployment at service scale, with financing, manufacturing, materials, ownership and continuing provision.
      source_refs:
      - {source_id: forum, post: 33, author: leif, basis: related}
      - {source_id: forum, post: 34, author: robert, basis: related}
      - {source_id: analysis-v2, locator: 'p. 47, open claims', basis: reconstruction}
    - ref: g2-f-a01
      work: examine_assumption
      label: Does reflective or spiritual maturity cause enduring institutional change?
      note: Observe actual behaviour and power over time, keeping inner experience, reported development, governance changes and survival apart.
      source_refs:
      - {source_id: forum, post: 19, author: robert, basis: related}
      - {source_id: forum, post: 35, author: robert, basis: related}
      - {source_id: forum, post: 36, author: leif, basis: related}
      - {source_id: analysis-v2, locator: 'p. 47, open claims', basis: reconstruction}
    - ref: g2-f-i11
      work: examine_assumption
      label: Is this a change of its own, or the combined effect of the other ten?
      note: In post 26 Leif expects these developments, taken together, to begin changing the selection pressures; in post 38 he names AI, human–AI collaboration and institutional design. If it is their combined effect, it belongs among the effects rather than the changes.
      source_refs:
      - {source_id: forum, post: 26, author: leif, basis: related}
      - {source_id: forum, post: 38, author: leif, basis: related}
