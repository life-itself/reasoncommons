      to: g2-g-goal
      relation: necessary_for
      status: proposed
      contributions: *reconstruction
      source_refs:
      - {source_id: forum, post: 26, author: leif, basis: paraphrase}
      - {source_id: analysis-v2, locator: 'p. 2, goal and necessary conditions', basis: reconstruction}
    backlog:
    - ref: g2-g-goal
      work: connect_or_explain
      label: Check this proposed common ground with the people in the discussion.
      note: The supplied analyses report apparent agreements. None is recorded here as accepted; compare the original posts before inviting participants to review the wording.
    - ref: g2-g-goal
      work: connect_or_explain
      label: Define realised progress, including survival and retention of the mission.
      note: The first analysis proposes adoption retained in practice, with viability and faithfulness measured separately. Agree a bounded system, period and observable outcome rather than equating publications, satisfaction or market growth with success.
    - ref: g2-g-goal
      work: connect_or_explain
      label: Review the wider programme before choosing further branches.
      note: The second analysis also covers reflective development, the Laboratory, Forge/model adaptation, Vocal Presence, federation, material and energy services, and enforceable security. Its spiritual root is a philosophical hypothesis. This compact map does not establish a single global constraint or make the pilot the whole programme.
