      work: examine_assumption
      label: Test an exit and a fallback before treating AI dependence as unavoidable.
    - ref: g2-c-k3-rel-conflict
      work: examine_assumption
      label: Can reciprocal limits be enforced against powerful defectors?
      note: Leif asks why the League of Nations and the United Nations failed to prevent major wars, and what would make rules hold when powerful actors find them inconvenient. Robert expects the arms race may worsen before it improves, and looks to a coalition of middle powers for leverage.
      source_refs:
      - {source_id: forum, post: 26, author: leif, basis: related}
      - {source_id: forum, post: 25, author: robert, basis: related}
      - {source_id: analysis-v2, locator: 'p. 16, K3', basis: reconstruction}
    - ref: g2-c-k4-rel-throughput
      work: examine_assumption
      label: Can essential services be kept without growing material throughput?
      note: Leif hopes AI can speed up the development of alternative energy and materials. Robert prefers Nate Hagens’s Great Simplification and hedging against bets on AI. Both are candidate ways through; neither has been tested.
      source_refs:
      - {source_id: forum, post: 33, author: leif, basis: related}
      - {source_id: forum, post: 34, author: robert, basis: related}
      - {source_id: analysis-v2, locator: 'p. 17, K4', basis: reconstruction}
    - ref: g2-c-k5-rel-engineer
      work: examine_assumption
      label: Can a service be funded without engineering attachment?
      note: Leif’s essay contrasts institutions that earn trust with those that depend on manipulation. Robert accepts AI only if people stay free to take it or leave it.
      source_refs:
      - {source_id: last-first, locator: sections 3–6, basis: cited}
      - {source_id: forum, post: 19, author: robert, basis: related}
      - {source_id: analysis-v2, locator: 'p. 18, K5', basis: reconstruction}
  future_reality:
    nodes:
    - id: g2-f-guidance
      kind: injection
      text: Test member-controlled AI conflict guidance with voluntary use, human support, a workable exit and competence checked without AI.
      label: Test voluntary, member-controlled AI conflict guidance with an exit and independent competence.
      status: proposed
      contributions: *reconstruction
      source_refs:
      - {source_id: forum, post: 29, author: leif, basis: paraphrase}
      - {source_id: forum, post: 13, author: leif, basis: related}
      - {source_id: forum, post: 20, author: leif, basis: related}
      - {source_id: forum, post: 30, author: robert, basis: related}
      - {source_id: forum, post: 19, author: robert, basis: related}
      - {source_id: analysis-v2, locator: 'pp. 18–19, I02 and I03; p. 42, T2 and T3', basis: reconstruction}
      - {source_id: analysis-v1, locator: 'Injections I1–I3 and negative branches 4–5', basis: reconstruction}
    - id: g2-f-protections
      kind: injection
      text: Members establish confidentiality, fair grievance handling and independent comparison before live use.
      label: Members establish confidentiality, fair grievance handling and independent comparison.
      status: proposed
      contributions: *reconstruction
      source_refs:
      - {source_id: forum, post: 20, author: leif, basis: related}
      - {source_id: paradox, locator: section 9, basis: cited}
      - {source_id: analysis-v2, locator: 'pp. 35–36, P03, P04 and P08; p. 42, T2', basis: reconstruction}
    - id: g2-f-benefit
      kind: predicted_effect
      text: Destructive conflict costs and unnecessary hierarchical intervention fall while fair treatment, independent competence and member influence are retained.
      label: Conflict costs and needless hierarchy fall while fair treatment, competence and influence remain.
      status: proposed
      contributions: *reconstruction
      source_refs:
      - {source_id: forum, post: 29, author: leif, basis: paraphrase}
      - {source_id: paradox, locator: section 9, basis: cited}
      - {source_id: analysis-v2, locator: 'p. 42, T2 prediction', basis: reconstruction}
    - id: g2-f-harm
      kind: undesirable_effect
      text: Conflict guidance may suppress justified grievances even when satisfaction improves.
      label: Conflict guidance may suppress justified grievances even when satisfaction improves.
      status: proposed
      contributions: *reconstruction
      source_refs:
      - {source_id: forum, post: 20, author: leif, basis: related}
      - {source_id: paradox, locator: section 9, basis: cited}
      - {source_id: analysis-v2, locator: 'p. 42, T2 defeating results and protected conditions', basis: reconstruction}
      - {source_id: analysis-v1, locator: 'Negative branch 4, Domesticated conflict', basis: reconstruction}
    links:
    - id: g2-f-rel-benefit
      from: [g2-f-guidance, g2-f-protections]
      to: g2-f-benefit
      relation: contributes_to
      status: proposed
      contributions: *reconstruction
      source_refs:
      - {source_id: forum, post: 29, author: leif, basis: related}
      - {source_id: analysis-v2, locator: 'p. 42, T2; combined trial design is an AI reconstruction', basis: inference}
      assumptions:
      - {by: assistant, text: 'The guidance fits the selected workflow, protections operate in practice, and observed gains exceed those from attention or ordinary human facilitation alone.'}
    - id: g2-f-rel-harm
      from: [g2-f-guidance]
      to: g2-f-harm
      relation: contributes_to
      status: proposed
      contributions: *reconstruction
      source_refs:
      - {source_id: paradox, locator: section 9, basis: cited}
      - {source_id: analysis-v2, locator: 'p. 42, T2; risk route reconstructed from the cautions', basis: inference}
      assumptions:
      - {by: assistant, text: 'The risk arises where guidance privileges agreement or management expectations over substantive fairness; it is not an inevitable effect of guidance.'}
    backlog:
    - ref: g2-f-guidance
      work: test_causality
      label: Compare AI guidance with optional-AI and human approaches.
      note: Check useful output, total cost, energy, member control, fallback and competence without the tool. Participants have not committed to running this comparison.
    - ref: g2-f-rel-benefit
      work: test_causality
      label: Decide in advance what evidence would change the hypothesis.
      note: Lower satisfaction scores or fewer complaints alone do not establish benefit. The first analysis asks whether small democratic groups gain more than hierarchies; the second distinguishes local improvements from the still-unclosed institutional-selection claim F17. One successful pilot cannot establish the larger claim.
    - ref: g2-f-rel-harm
      work: examine_assumption
      label: Assess suppressed grievances separately from satisfaction.
      note: Retain independent human support and a way to report costs, unfairness, dependency and increased concentration of authority.
