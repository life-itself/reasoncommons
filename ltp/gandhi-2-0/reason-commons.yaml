    backlog:
    - ref: g2-c-k1-rel-concentrate
      work: examine_assumption
      label: Can coordination and expertise be had without concentrating authority?
      note: The analysis names conflict guidance, local AI, federation and accountable governance as candidate ways through. Leif hopes widely available conflict competence could reduce reliance on hierarchical intervention; none of these routes has been tested. In post 38 Leif describes such routes as ways for decentralised institutions to acquire the capabilities they need to survive, and places Gandhi 2.0's deeper hypothesis in changing the selection pressures themselves; see the conflict between success and integrity.
      source_refs:
      - {source_id: forum, post: 29, author: leif, basis: related}
      - {source_id: analysis-v2, locator: 'p. 14, K1, candidate injections I02, I03, I06 and I10', basis: reconstruction}
      - {source_id: forum, post: 38, author: leif, basis: related}
    - ref: g2-c-rel-depend
      work: examine_assumption
      label: Does this function actually require AI to remain viable?
      note: Leif argues that communities may have no viable alternative to building AI in; Robert holds that relying on AI as a core social technology is asking for trouble, and Leif has asked him to say where he places that limit. Keep non-AI and optional-AI comparators. Neither has reviewed this wording.
      source_refs:
      - {source_id: forum, post: 33, author: leif, basis: related}
      - {source_id: forum, post: 30, author: robert, basis: related}
      - {source_id: forum, post: 34, author: robert, basis: related}
      - {source_id: forum, post: 36, author: leif, basis: related}
    - ref: g2-c-rel-conflict
      work: examine_assumption
      label: Test an exit and a fallback before treating AI dependence as unavoidable.
    - ref: g2-c-k3-rel-conflict
      work: examine_assumption
      label: Can reciprocal limits be enforced against powerful defectors?
      note: Leif asks why the League of Nations and the United Nations failed to prevent major wars, and what would make rules hold when powerful actors find them inconvenient. Robert expects the arms race may worsen before it improves, and looks to a coalition of middle powers for leverage.
      source_refs:
      - {source_id: forum, post: 26, author: leif, basis: related}
      - {source_id: forum, post: 25, author: robert, basis: related}
      - {source_id: analysis-v2, locator: 'p. 16, K3', basis: reconstruction}
    - ref: g2-c-k4-rel-throughput
      work: examine_assumption
      label: Can essential services be kept without growing material throughput?
      note: Leif hopes AI can speed up the development of alternative energy and materials. Robert prefers Nate Hagens’s Great Simplification and hedging against bets on AI. Both are candidate ways through; neither has been tested.
      source_refs:
      - {source_id: forum, post: 33, author: leif, basis: related}
      - {source_id: forum, post: 34, author: robert, basis: related}
      - {source_id: analysis-v2, locator: 'p. 17, K4', basis: reconstruction}
    - ref: g2-c-k5-rel-engineer
      work: examine_assumption
      label: Can a service be funded without engineering attachment?
      note: Leif’s essay contrasts institutions that earn trust with those that depend on manipulation. Robert accepts AI only if people stay free to take it or leave it.
      source_refs:
      - {source_id: last-first, locator: sections 3–6, basis: cited}
      - {source_id: forum, post: 19, author: robert, basis: related}
      - {source_id: analysis-v2, locator: 'p. 18, K5', basis: reconstruction}
    - ref: g2-c-k6-objective
      work: connect_or_explain
      label: Check whether the authority, AI, throughput and attachment conflicts are cases of this one.
      note: If they are, this is the core conflict behind four of the five others. Ask Leif whether it captures the countercurrent's paradox of success before treating it as the core.
      source_refs:
      - {source_id: forum, post: 38, author: leif, basis: related}
    - ref: g2-c-k6-rel-conflict
      work: examine_assumption
      label: Can the selection pressures themselves change, rather than only the institutions?
      note: Leif's deeper hypothesis, in posts 20, 26 and 38, is that human–AI collaboration and institutional design might change what lets institutions survive and spread. The change that would test it is the one about changing the selection pressures.
      source_refs:
      - {source_id: forum, post: 20, author: leif, basis: related}
      - {source_id: forum, post: 26, author: leif, basis: related}
      - {source_id: forum, post: 38, author: leif, basis: related}
