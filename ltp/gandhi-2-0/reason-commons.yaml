schema_version: 1
project: Gandhi 2.0
driver: david
participants:
  david: David Joseph
active_tree: conflict
import_context:
  recorded_on: '2026-10-22'
  basis: The Second Renaissance Forum thread What Would Make a Second Renaissance Possible? (posts 1–36, checked against the public topic on 22 October 2026), five essays Leif Eriksson shared in it, and two supplied analyses of the thread. The essays were not read here; their credits rest on the section citations in the supplied analysis.
  standing: All nodes and links are proposed reconstructions. Approval to build the demonstration is not endorsement of this reasoning by David or by the discussion participants.
  scope: Step 1 of a fuller import, accepted as gandhi-2-0-completeness-2026-10-22 revision 2. It holds the compact starting map and all five conflict clouds from the analysis. The causal tree, the full set of changes, risks, first steps and actions follow in a later step; until then reflection, model adaptation, voice participation, federation, material services and security remain in the review backlog.
  attribution: Every statement and connection credits the forum posts or essays it draws on, and each forum credit names that post’s actual author. The AI is responsible for selecting, paraphrasing and connecting them and is the only contributor. A credit says where an idea comes from, not that its author agrees with this wording or structure; none of the people credited has reviewed it. Nothing is quoted.
trees:
  goal:
    nodes:
    - id: g2-g-goal
      kind: goal
      text: Humane institutions can survive and spread while retaining autonomy and care, within ecological limits and without catastrophic destruction.
      label: Humane institutions survive and spread while retaining autonomy and care within liveable limits.
      status: proposed
      contributions: &reconstruction [{by: assistant, attribution: assistant, mode: text}]
      source_refs:
      - {source_id: forum, post: 26, author: leif, basis: paraphrase}
      - {source_id: forum, post: 20, author: leif, basis: related}
