schema_version: 1
project: Gandhi 2.0
driver: david
participants:
  david: David Joseph
active_tree: conflict
import_context:
  recorded_on: '2026-10-22'
  basis: Two supplied analyses of a Second Renaissance forum discussion and related essays; the underlying posts and manuscript have not been independently checked.
  standing: All nodes and links are proposed reconstructions. Approval to build the demonstration is not endorsement of this reasoning by David or by the discussion participants.
  scope: A compact starting map, not a transcription of the entire programme. Conflict guidance is one possible entry point; reflection, model adaptation, voice participation, federation, material services and security remain in the review backlog.
  attribution: The AI is responsible for this selection, paraphrasing and reconstruction. Source locators identify where to check the reported argument; they do not authenticate direct human authorship or agreement.
trees:
  goal:
    nodes:
    - id: g2-g-goal
      kind: goal
      text: Humane institutions can survive and spread while retaining autonomy and care, within ecological limits and without catastrophic destruction.
      label: Humane institutions survive and spread while retaining autonomy and care within liveable limits.
      status: proposed
      contributions: &reconstruction [{by: assistant, attribution: assistant, mode: text}]
      source_refs: [{source_id: analysis-v2, locator: 'p. 2, G0', basis: reconstruction}]
    - id: g2-g-capability
      kind: necessary_condition
      text: Communities can maintain useful material and organisational capabilities at viable cost.
      label: Communities maintain useful capabilities at viable cost.
      status: proposed
      contributions: *reconstruction
      source_refs: [{source_id: analysis-v2, locator: 'p. 2, G3', basis: reconstruction}]
    - id: g2-g-control
      kind: necessary_condition
      text: Members retain substantive control, justified trust and meaningful freedom to disagree or leave.
      label: Members retain control, justified trust and freedom to disagree or leave.
      status: proposed
      contributions: *reconstruction
      source_refs: [{source_id: analysis-v2, locator: 'p. 2, G2, G4 and G5', basis: reconstruction}]
    - id: g2-g-future
      kind: necessary_condition
      text: Ecological and catastrophic risks remain compatible with continued human life and collective agency.
      label: Ecological and catastrophic risks remain compatible with continued human agency.
      status: proposed
      contributions: *reconstruction
      source_refs: [{source_id: analysis-v2, locator: 'p. 2, G1; pp. 42–43, T6 and T8', basis: reconstruction}]
    links:
    - id: g2-g-rel-capability
      from: [g2-g-capability]
      to: g2-g-goal
      relation: necessary_for
      status: proposed
      contributions: *reconstruction
      source_refs: [{source_id: analysis-v2, locator: 'p. 2, goal and necessary conditions', basis: reconstruction}]
    - id: g2-g-rel-control
      from: [g2-g-control]
      to: g2-g-goal
      relation: necessary_for
      status: proposed
      contributions: *reconstruction
      source_refs: [{source_id: analysis-v2, locator: 'p. 2, goal and necessary conditions', basis: reconstruction}]
    - id: g2-g-rel-future
      from: [g2-g-future]
      to: g2-g-goal
      relation: necessary_for
      status: proposed
      contributions: *reconstruction
      source_refs: [{source_id: analysis-v2, locator: 'p. 2, goal and necessary conditions', basis: reconstruction}]
    backlog:
    - ref: g2-g-goal
      work: connect_or_explain
      label: Check this proposed common ground with the people in the discussion.
      note: The supplied analyses report apparent agreements. None is recorded here as accepted; compare the original posts before inviting participants to review the wording.
    - ref: g2-g-goal
      work: connect_or_explain
      label: Define realised progress, including survival and retention of the mission.
      note: The first analysis proposes adoption retained in practice, with viability and faithfulness measured separately. Agree a bounded system, period and observable outcome rather than equating publications, satisfaction or market growth with success.
    - ref: g2-g-goal
      work: connect_or_explain
      label: Review the wider programme before choosing further branches.
      note: The second analysis also covers reflective development, the Laboratory, Forge/model adaptation, Vocal Presence, federation, material and energy services, and enforceable security. Its spiritual root is a philosophical hypothesis. This compact map does not establish a single global constraint or make the pilot the whole programme.
  current_reality:
    nodes:
    - id: g2-r-load
      kind: cause
      text: As a group grows, damaging disagreements can exceed members’ current conflict-handling capacity.
      label: Damaging disagreements can exceed a growing group's current conflict-handling capacity.
      status: proposed
      contributions: *reconstruction
      source_refs: [{source_id: analysis-v2, locator: 'p. 10, R18, C18 and C15', basis: reconstruction}]
    - id: g2-r-coordination
      kind: cause
      text: The group needs workable coordination to remain viable.
      label: The group needs workable coordination to remain viable.
      status: proposed
      contributions: *reconstruction
      source_refs: [{source_id: analysis-v2, locator: 'pp. 9–10, C15 and R18; p. 14, K1', basis: reconstruction}]
    - id: g2-r-centralisation
      kind: undesirable_effect
      text: When members cannot resolve damaging disagreements, central intervention may become the practical response.
      label: Unresolved damaging disagreements may make central intervention the practical response.
      status: proposed
      contributions: *reconstruction
      source_refs: [{source_id: analysis-v2, locator: 'p. 10, R18 and C16', basis: reconstruction}]
    links:
    - id: g2-r-rel-centralisation
      from: [g2-r-load, g2-r-coordination]
      to: g2-r-centralisation
      relation: contributes_to
      status: proposed
      contributions: *reconstruction
      source_refs: [{source_id: analysis-v2, locator: 'p. 10, R18', basis: reconstruction}]
      assumptions:
      - {by: assistant, text: 'Conflict-handling capacity is insufficient for the selected function, and effective member-controlled alternatives are not already available.'}
    backlog:
    - ref: g2-r-rel-centralisation
      work: test_causality
      label: Test whether conflict capacity limits this particular group's next achievement.
      note: Compare developmental capacity, coordination design, resources and external pressures. A reported historical mechanism is not a measured constraint at a selected host.
  conflict:
    nodes:
    - id: g2-c-objective
      kind: objective
      text: Keep a community capable, independent and resilient.
      label: Keep a community capable, independent and resilient.
      status: proposed
      contributions: *reconstruction
      source_refs: &cloud_source [{source_id: analysis-v2, locator: 'p. 15, K2; reported sources S1 posts 20, 30 and 33–36 and S6', basis: reconstruction}]
    - id: g2-c-capability
      kind: need
      text: Avoid being outperformed or subordinated by actors using advanced AI.
      label: Avoid being outperformed or subordinated by actors using advanced AI.
      status: proposed
      contributions: *reconstruction
      source_refs: *cloud_source
    - id: g2-c-continuity
      kind: need
      text: Continue essential functions under provider, energy or AI failure.
      label: Continue essential functions under provider, energy or AI failure.
      status: proposed
      contributions: *reconstruction
      source_refs: *cloud_source
    - id: g2-c-depend
      kind: prerequisite
      text: Make the selected essential function depend on AI.
      label: Make the selected essential function depend on AI.
      status: proposed
      contributions: *reconstruction
      source_refs: *cloud_source
    - id: g2-c-optional
      kind: prerequisite
      text: Keep that same essential function operable without AI.
      label: Keep that same essential function operable without AI.
      status: proposed
      contributions: *reconstruction
      source_refs: *cloud_source
    links:
    - id: g2-c-rel-capability
      from: [g2-c-capability]
      to: g2-c-objective
      relation: necessary_for
      status: proposed
      contributions: *reconstruction
      source_refs: *cloud_source
    - id: g2-c-rel-continuity
      from: [g2-c-continuity]
      to: g2-c-objective
      relation: necessary_for
      status: proposed
      contributions: *reconstruction
      source_refs: *cloud_source
    - id: g2-c-rel-depend
      from: [g2-c-depend]
      to: g2-c-capability
      relation: necessary_for
      status: proposed
      contributions: *reconstruction
      source_refs: *cloud_source
      assumptions:
      - {by: assistant, text: 'AI provides a decisive advantage for this function, and a non-AI or optional-AI arrangement cannot meet the requirement.'}
    - id: g2-c-rel-optional
      from: [g2-c-optional]
      to: g2-c-continuity
      relation: necessary_for
      status: proposed
      contributions: *reconstruction
      source_refs: *cloud_source
      assumptions:
      - {by: assistant, text: 'AI access cannot be made sufficiently dependable, locally controlled and replaceable for the selected essential function.'}
    - id: g2-c-rel-conflict
      from: [g2-c-depend]
      to: g2-c-optional
      relation: conflicts_with
      status: proposed
      contributions: *reconstruction
      source_refs: *cloud_source
      assumptions:
      - {by: assistant, text: 'No tested fallback, bounded role or diversified architecture can reconcile these requirements for the same function at the same time.'}
    backlog:
    - ref: g2-c-rel-depend
      work: examine_assumption
      label: Does this function actually require AI to remain viable?
      note: Retain non-AI and optional-AI comparators. The stronger claim is reported in the analyses, not attributed here as a verified commitment by Leif or Robert.
    - ref: g2-c-rel-conflict
      work: examine_assumption
      label: Test an exit and a fallback before treating AI dependence as unavoidable.
  future_reality:
    nodes:
    - id: g2-f-guidance
      kind: injection
      text: Test member-controlled AI conflict guidance with voluntary use, human support, a workable exit and competence checked without AI.
      label: Test voluntary, member-controlled AI conflict guidance with an exit and independent competence.
      status: proposed
      contributions: *reconstruction
      source_refs: [{source_id: analysis-v2, locator: 'pp. 18–19, I02 and I03; p. 42, T2 and T3', basis: reconstruction}, {source_id: analysis-v1, locator: 'Injections I1–I3 and negative branches 4–5', basis: reconstruction}]
    - id: g2-f-protections
      kind: injection
      text: Members establish confidentiality, fair grievance handling and independent comparison before live use.
      label: Members establish confidentiality, fair grievance handling and independent comparison.
      status: proposed
      contributions: *reconstruction
      source_refs: [{source_id: analysis-v2, locator: 'pp. 35–36, P03, P04 and P08; p. 42, T2', basis: reconstruction}]
    - id: g2-f-benefit
      kind: predicted_effect
      text: Destructive conflict costs and unnecessary hierarchical intervention fall while fair treatment, independent competence and member influence are retained.
      label: Conflict costs and needless hierarchy fall while fair treatment, competence and influence remain.
      status: proposed
      contributions: *reconstruction
      source_refs: [{source_id: analysis-v2, locator: 'p. 42, T2 prediction', basis: reconstruction}]
    - id: g2-f-harm
      kind: undesirable_effect
      text: Conflict guidance may suppress justified grievances even when satisfaction improves.
      label: Conflict guidance may suppress justified grievances even when satisfaction improves.
      status: proposed
      contributions: *reconstruction
      source_refs: [{source_id: analysis-v2, locator: 'p. 42, T2 defeating results and protected conditions', basis: reconstruction}, {source_id: analysis-v1, locator: 'Negative branch 4, Domesticated conflict', basis: reconstruction}]
    links:
    - id: g2-f-rel-benefit
      from: [g2-f-guidance, g2-f-protections]
      to: g2-f-benefit
      relation: contributes_to
      status: proposed
      contributions: *reconstruction
      source_refs: [{source_id: analysis-v2, locator: 'p. 42, T2; combined trial design is an AI reconstruction', basis: inference}]
      assumptions:
      - {by: assistant, text: 'The guidance fits the selected workflow, protections operate in practice, and observed gains exceed those from attention or ordinary human facilitation alone.'}
    - id: g2-f-rel-harm
      from: [g2-f-guidance]
      to: g2-f-harm
      relation: contributes_to
      status: proposed
      contributions: *reconstruction
      source_refs: [{source_id: analysis-v2, locator: 'p. 42, T2; risk route reconstructed from the cautions', basis: inference}]
      assumptions:
      - {by: assistant, text: 'The risk arises where guidance privileges agreement or management expectations over substantive fairness; it is not an inevitable effect of guidance.'}
    backlog:
    - ref: g2-f-guidance
      work: test_causality
      label: Compare AI guidance with optional-AI and human approaches.
      note: Check useful output, total cost, energy, member control, fallback and competence without the tool. Participants have not committed to running this comparison.
    - ref: g2-f-rel-benefit
      work: test_causality
      label: Decide in advance what evidence would change the hypothesis.
      note: Lower satisfaction scores or fewer complaints alone do not establish benefit. The first analysis asks whether small democratic groups gain more than hierarchies; the second distinguishes local improvements from the still-unclosed institutional-selection claim F17. One successful pilot cannot establish the larger claim.
    - ref: g2-f-rel-harm
      work: examine_assumption
      label: Assess suppressed grievances separately from satisfaction.
      note: Retain independent human support and a way to report costs, unfairness, dependency and increased concentration of authority.
  prerequisite:
    nodes:
    - id: g2-p-trial
      kind: objective
      text: A bounded comparative trial produces reviewable observations of benefits, harms, costs and decision rights.
      label: A bounded comparative trial produces reviewable observations of benefits, harms and control.
      status: proposed
      contributions: *reconstruction
      source_refs: [{source_id: analysis-v2, locator: 'pp. 35–36, P03–P09; p. 42, T2', basis: reconstruction}]
    - id: g2-p-case
      kind: intermediate_objective
      text: A willing host and one function are selected, with the actual workflow and resource requirements documented.
      label: Select a willing host and one function, with actual workflow and resource needs documented.
      status: proposed
      contributions: *reconstruction
      source_refs: [{source_id: analysis-v2, locator: 'p. 35, P01–P02; p. 45, A1–A2', basis: reconstruction}]
    - id: g2-p-protocol
      kind: intermediate_objective
      text: Affected people authorise a trial specification covering comparisons, measures, protections, responsibilities, resources and fallback.
      label: Affected people authorise a comparative trial with measures, protections, resources and fallback.
      status: proposed
      contributions: *reconstruction
      source_refs: [{source_id: analysis-v2, locator: 'pp. 35–36, P03–P08; p. 45, A3–A4', basis: reconstruction}]
    - id: g2-p-gap
      kind: obstacle
      text: The supplied record does not establish a confirmed operational case and authorised trial specification.
      label: The supplied record does not establish a confirmed case and authorised trial specification.
      status: proposed
      contributions: *reconstruction
      source_refs: [{source_id: analysis-v2, locator: 'p. 35, P01; p. 48, acceptance, baseline and next achievement', basis: reconstruction}]
    links:
    - id: g2-p-rel-case
      from: [g2-p-case]
      to: g2-p-protocol
      relation: necessary_for
      status: proposed
      contributions: *reconstruction
      source_refs: [{source_id: analysis-v2, locator: 'p. 35, P01 precedes P02–P05', basis: reconstruction}]
    - id: g2-p-rel-trial
      from: [g2-p-protocol]
      to: g2-p-trial
      relation: necessary_for
      status: proposed
      contributions: *reconstruction
      source_refs: [{source_id: analysis-v2, locator: 'p. 36, P08; p. 45, A3–A5', basis: reconstruction}]
    - id: g2-p-rel-gap
      from: [g2-p-protocol]
      to: g2-p-gap
      relation: overcomes
      status: proposed
      contributions: *reconstruction
      source_refs: [{source_id: analysis-v2, locator: 'pp. 35–36, shared foundations, compact reconstruction', basis: inference}]
    backlog:
    - ref: g2-p-gap
      work: connect_or_explain
      label: Verify the actual host's obstacles rather than assuming missing details are missing capacity.
      note: The PDF distinguishes documented gaps, source-defined risks, reconstructed requirements and conditions to check locally (D/S/R/X). This statement concerns evidence in the supplied record, not proof that no willing host or resources exist.
    - ref: g2-p-protocol
      work: connect_or_explain
      label: Agree measures, responsibilities, resources and a person who can assess the outcomes.
      note: No owner, budget, baseline, target, date or feedback commitment is assigned here. A trial is not ready until the affected people confirm these conditions. Future benefit and harm feedback should preserve both original expectations.
  transition:
    nodes:
    - id: g2-t-select
      kind: action
      text: Select one willing host and one function, and confirm what is already operating.
      label: Select one willing host and one function, and confirm what is already operating.
      status: proposed
      contributions: *reconstruction
      source_refs: [{source_id: analysis-v2, locator: 'p. 45, A1', basis: reconstruction}]
    - id: g2-t-case
      kind: expected_effect
      text: The bounded case and its factual starting conditions are documented.
      label: The bounded case and its factual starting conditions are documented.
      status: proposed
      contributions: *reconstruction
      source_refs: [{source_id: analysis-v2, locator: 'p. 45, A1–A2', basis: reconstruction}]
    links:
    - id: g2-t-rel-case
      from: [g2-t-select]
      to: g2-t-case
      relation: produces
      status: proposed
      contributions: *reconstruction
      source_refs: [{source_id: analysis-v2, locator: 'p. 45, A1–A2', basis: reconstruction}]
    backlog:
    - ref: g2-t-select
      work: connect_or_explain
      label: Ask who wants to take responsibility for selecting the first case.
      note: This is a proposed action, not an invitation already sent or a commitment by Leif, Robert or any cooperative.
