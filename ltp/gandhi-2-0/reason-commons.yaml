      work: examine_assumption
      label: Can coordination and expertise be had without concentrating authority?
      note: The analysis names conflict guidance, local AI, federation and accountable governance as candidate ways through. Leif hopes widely available conflict competence could reduce reliance on hierarchical intervention; none of these routes has been tested.
      source_refs:
      - {source_id: forum, post: 29, author: leif, basis: related}
      - {source_id: analysis-v2, locator: 'p. 14, K1, candidate injections I02, I03, I06 and I10', basis: reconstruction}
    - ref: g2-c-rel-depend
      work: examine_assumption
      label: Does this function actually require AI to remain viable?
      note: Leif argues that communities may have no viable alternative to building AI in; Robert holds that relying on AI as a core social technology is asking for trouble, and Leif has asked him to say where he places that limit. Keep non-AI and optional-AI comparators. Neither has reviewed this wording.
      source_refs:
      - {source_id: forum, post: 33, author: leif, basis: related}
      - {source_id: forum, post: 30, author: robert, basis: related}
      - {source_id: forum, post: 34, author: robert, basis: related}
      - {source_id: forum, post: 36, author: leif, basis: related}
