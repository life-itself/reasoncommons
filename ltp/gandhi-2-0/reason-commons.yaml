    - ref: g2-p-gap
      work: connect_or_explain
      label: Verify the actual host's obstacles rather than assuming missing details are missing capacity.
      note: The PDF distinguishes documented gaps, source-defined risks, reconstructed requirements and conditions to check locally (D/S/R/X). This statement concerns evidence in the supplied record, not proof that no willing host or resources exist.
    - ref: g2-p-protocol
      work: connect_or_explain
      label: Agree measures, responsibilities, resources and a person who can assess the outcomes.
      note: No owner, budget, baseline, target, date or feedback commitment is assigned here. A trial is not ready until the affected people confirm these conditions. Future benefit and harm feedback should preserve both original expectations.
