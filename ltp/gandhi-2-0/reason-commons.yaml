      - {source_id: analysis-v2, locator: 'p. 2, G0', basis: reconstruction}
    - id: g2-g-capability
      kind: necessary_condition
      text: Communities can maintain useful material and organisational capabilities at viable cost.
      label: Communities maintain useful capabilities at viable cost.
      status: proposed
      contributions: *reconstruction
      source_refs:
      - {source_id: forum, post: 26, author: leif, basis: paraphrase}
      - {source_id: forum, post: 32, author: leif, basis: related}
      - {source_id: forum, post: 9, author: robert, basis: related}
      - {source_id: paradox, locator: section 7, basis: cited}
