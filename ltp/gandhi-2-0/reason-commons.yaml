    links:
    - id: g2-g-rel-capability
      from: [g2-g-capability]
      to: g2-g-goal
      relation: necessary_for
      status: proposed
      contributions: *reconstruction
      source_refs:
      - {source_id: forum, post: 26, author: leif, basis: related}
