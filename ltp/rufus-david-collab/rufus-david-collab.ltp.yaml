      provenance: { path: "ltp/rufus-david-collab/scqh.md#L134" }
    - id: p-e-io-mit
      tree: prerequisite
      statement: The Reason Commons software is released under the MIT licence.
      provenance: { path: "ltp/rufus-david-collab/scqh.md#L135" }
    - id: p-e-no-outside-users
      tree: prerequisite
      statement: No one other than Rufus and David uses any app they have built.
      provenance: { path: "ltp/rufus-david-collab/scqh.md#L136" }
    - id: p-e-users-candidates
      tree: prerequisite
      statement: Rufus and David do not know who their users are in general, though for the nonprofit-oriented version they have candidate communities in the AI-risk debate, effective altruism and Second Renaissance.
      provenance: { path: "ltp/rufus-david-collab/scqh.md#L137" }

    # Cause links extended by Rufus, 2026-09-26 (scqh.md "Cause links")
    - id: r-e-quality-short
      tree: current_reality
      statement: Rufus and David cannot build the tool to the quality needed for impact in their own limited time.
      provenance: { path: "ltp/rufus-david-collab/scqh.md#L152" }
    - id: r-e-no-awareness
      tree: current_reality
      statement: Rufus and David have no time to disseminate or market the tool, so too few people know about it.
      provenance: { path: "ltp/rufus-david-collab/scqh.md#L153" }
    - id: r-e-not-adopted
      tree: current_reality
      statement: The Logical Thinking Process, made accessible through AI, is not being adopted in the world to help people think and act better together.
      provenance: { path: "ltp/rufus-david-collab/scqh.md#L154" }
    - id: r-e-no-sales-drive
      tree: current_reality
      statement: Neither Rufus nor David is strongly oriented to market testing and selling, and Rufus is not motivated to do it, financially or otherwise.
      provenance: { path: "ltp/rufus-david-collab/scqh.md#L156" }

