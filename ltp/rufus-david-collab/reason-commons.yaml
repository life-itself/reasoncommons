      text: When assigned participants supply feedback, their observations about expected benefits and harms are available beside the original expectations for review.
      label: Reported outcomes remain beside original expectations.
      status: proposed
      contributions:
      - {by: assistant, attribution: assistant, mode: text}
    - id: f-e-feedback-burden
      kind: undesirable_effect
      text: Feedback requests that arrive before someone can judge a change or recur too often can increase collaboration burden.
      label: Premature or excessive requests can add burden.
      status: proposed
      contributions:
      - {by: assistant, attribution: assistant, mode: text}
    - id: f-e-feedback-controls
      kind: injection
      text: Feedback requests support explicit deferral and use configured, bounded delivery to limit unnecessary interruptions.
      label: Allow deferral and bound feedback delivery.
      status: proposed
      contributions:
      - {by: assistant, attribution: assistant, mode: text}
    - id: f-e-feedback-sync
      kind: injection
      text: Sessions synchronise authorised feedback records with shared Git state before checking outstanding feedback and after saving responses.
      label: Sessions synchronise authorised feedback before review and after saving.
      status: proposed
      contributions: [{by: assistant, attribution: assistant, mode: text}]
    - id: f-e-shared-feedback-current
      kind: predicted_effect
      text: Participants returning through separate checkouts can review the latest shared feedback without performing Git operations themselves.
      label: Returning participants can review current feedback without Git operations.
      status: proposed
      contributions: [{by: assistant, attribution: assistant, mode: text}]
    - id: f-e-feedback-sync-friction
      kind: undesirable_effect
      text: Failed or conflicting synchronisation can delay sharing feedback and add recovery work.
      label: Sync failures can delay feedback sharing and add recovery work.
      status: proposed
      contributions: [{by: assistant, attribution: assistant, mode: text}]
    - id: f-e-feedback-sync-preservation
      kind: injection
      text: Synchronisation preserves unsent contributions, validates reconciled state and reports incomplete sharing explicitly.
      label: Sync preserves contributions and reports incomplete sharing.
      status: proposed
      contributions: [{by: assistant, attribution: assistant, mode: text}]
    - id: f-e-pr-expected-outcomes
      kind: injection
      text: PR descriptions include a generated Expected outcomes section for each feedback commitment in the diff, and the PR check requires it to match the reasoning YAML.
      label: PRs show generated, checked expected outcomes.
      status: proposed
      addresses: [r-e-pr-expectations-hidden]
      contributions:
      - {by: david, attribution: explicit, mode: text}
    - id: f-e-pr-expectations-visible
      kind: predicted_effect
      text: Reviewers can see what a change is expected to achieve, what could go wrong and who will judge it.
      label: Reviewers see what is expected and who judges.
      status: proposed
      contributions:
      - {by: assistant, attribution: assistant, mode: text}
    - id: f-e-pr-outcomes-overhead
      kind: undesirable_effect
      text: Requiring an explanation for predictions without a feedback commitment can add PR-writing overhead.
      label: Explaining unassigned predictions adds overhead.
      status: proposed
      contributions:
      - {by: assistant, attribution: assistant, mode: text}
    - id: f-e-sync-advances-checkout
      kind: injection
      text: After verified sharing, sync fast-forwards the checkout's branch when only the reasoning file differs and the file already matches the shared commit; otherwise it reports the exact recovery command.
      label: Sync fast-forwards the checkout when safe.
      status: proposed
      addresses: [r-e-sync-left-checkout-behind]
      contributions:
      - {by: assistant, attribution: assistant, mode: text}
    - id: f-e-sync-minimal-edits
      kind: injection
      text: Sync inserts new feedback and review entries without rewriting the formatting of unchanged entries.
      label: Sync appends entries without reformatting.
      status: proposed
      addresses: [r-e-sync-reformatted-backlog]
      contributions:
      - {by: assistant, attribution: assistant, mode: text}
    - id: f-e-first-session-onboarding
      kind: injection
      text: On a participant's first session in a checkout, the skill shows a short introduction to what Reason Commons does, what each type of message asks of them, how feedback works and whether sharing is set up.
      label: First session shows a short introduction.
      status: proposed
      addresses: [r-e-newcomer-lacks-context]
      contributions:
      - {by: david, attribution: explicit, mode: text}
    - id: f-e-newcomer-reads-messages
      kind: predicted_effect
      text: A first-time participant understands what each type of message asks of them well enough to answer a feedback request without asking another participant what it means.
      label: Newcomer can answer a feedback request unaided.
      status: proposed
      contributions:
      - {by: david, attribution: explicit, mode: text}
    - id: f-e-onboarding-delays-start
      kind: undesirable_effect
      text: Reading an introduction up front delays or discourages a busy first-time participant before they reach anything useful.
      label: Up-front reading can put off a busy newcomer.
      status: proposed
      contributions:
      - {by: assistant, attribution: assistant, mode: text}
    - id: f-e-worktree-inherits-sharing
      kind: injection
      text: A linked worktree whose main checkout holds a standing feedback-sharing authorisation for the same reasoning file, remote URL and branch uses that authorisation, records that it was inherited, and reports this in the sync result and the introduction.
      label: Worktrees use the main checkout's sharing authorisation.
      status: proposed
      addresses: [r-e-worktree-sharing-off]
      contributions:
      - {by: david, attribution: explicit, mode: text, note: 'David asked on 2026-10-20 whether sharing could be turned on automatically and chose the permanent fix; the assistant drafted the mechanism.'}
    - id: f-e-onboarding-suggests-default-branch
      kind: injection
      text: When no sharing authorisation exists, the introduction's setup command names the repository's default branch rather than the checkout's current branch.
      label: The introduction suggests the shared default branch.
      status: proposed
      addresses: [r-e-onboarding-suggests-session-branch]
      contributions:
      - {by: assistant, attribution: assistant, mode: text}
    - id: f-e-inherited-sharing-unnoticed
      kind: undesirable_effect
      text: A session worktree may share feedback without the participant realising sharing is on there.
      label: A worktree may share feedback without the person noticing.
      status: proposed
      contributions:
      - {by: assistant, attribution: assistant, mode: text}
    - id: f-e-discord-diverts-resources
      kind: undesirable_effect
      text: Operating and extending the bot may consume scarce time and money and delay real-work testing.
      status: proposed
      contributions:
      - by: assistant
        attribution: assistant
        mode: text
      derived_from:
      - r-e-only-own-time
      - r-e-keep-redesigning
    - id: f-e-discord-misrepresents-agreement
      kind: undesirable_effect
      text: If identity, endorsement or state controls fail, bot-mediated updates may misrepresent collaborators' reasoning or agreement.
      status: proposed
      contributions:
      - by: assistant
        attribution: assistant
        mode: text
    - id: f-e-explainers-skill-margin
      kind: injection
      text: The explainers gain alternative editions, published alongside the originals, whose margin shows the people in the story using the reason-commons skill as the story unfolds, with avatars showing who is chatting and the device each would use, such as a manager's desktop or a phone notification that shifts a nurse's focus.
      label: Alternative explainer editions show the cast using the skill in the margin, on their own devices.
      status: proposed
      contributions:
      - by: david
        attribution: explicit
        mode: text
        note: Requested 2026-10-20, including avatars, device by role and notifications that shift focus; David asked for alternative versions published online without replacing the originals.
      - by: assistant
        attribution: assistant
        mode: text
        note: Assistant proposed piloting on the three-part trilogy because its parts share one clinic and cast.
      - by: assistant
        attribution: assistant
        mode: text
        note: 'Implemented under explainer-skill-margin-2026-10-20 revision 2 (bead reasoncommons-brw): three in-practice editions at website/explainers/*-in-practice/ generated from the originals with the story text unchanged (checked by text diff), a shared skill-margin.css/js rail and inline-card component, and the margin script with an independent critique and response at docs/marketing/explainers/series/05-skill-margin-script.md. The critique led to human-sent notifications, /reason capture on every saved contribution, dictation instead of voice notes, visible named endorsement, corrected constraint arithmetic and plainer What-changes lines. Checks: check-website.py 713 links/assets with 0 errors; phone-check at 375px with no overflow on all three; headless screenshots at 1440, 900 and 375px with no console errors; reduced-motion and animated states. Published for David as a private claude.ai artifact mirroring website/explainers; not committed, pushed or on the Flowershow preview. Implementation does not endorse this injection or show that readers make the connection.'
    - id: f-e-readers-picture-skill-use
      kind: predicted_effect
      text: Readers connect the method the explainers describe to the reason-commons skill and can picture using it in their own role.
      label: Readers link the explainers' method to the skill and can picture using it in their own role.
      status: proposed
      contributions:
      - by: david
        attribution: explicit
        mode: text
        note: The difference David intends the editions to make; untested.
    - id: f-e-rufus-attention-pointer
      kind: injection
      text: Rufus is alerted when input is required from him, and something tracks the next item worth his attention, such as a small "constraint" icon showing where he should be looking now.
      label: "Rufus is alerted when his input is needed and shown the next item worth his attention."
      status: proposed
      addresses:
      - r-e-rufus-blockers-unclear
      - r-e-discord-points-lost
      contributions:
      - by: david
        attribution: explicit
        mode: text
        note: Proposed by David as a possible injection while describing what a coherent demo is missing, 2026-10-20.
    - id: f-e-rufus-knows-where-to-look
      kind: predicted_effect
      text: Rufus can see where he should be looking now.
      status: proposed
      contributions:
      - by: david
        attribution: explicit
        mode: text
