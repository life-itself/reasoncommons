    - ref: g-e-picturable-product
      work: evaluate_landing_page_comprehension
      evaluation_plan: Next run uses landing-rubric-2, in which each criterion is a short list of yes/no checks needing a quote or screenshot and scores count passed checks; text criteria are judged once per page and presentation once per viewport. A scripted capture check clicks the main action on the serving host and blocks a page whose install route fails, which the judge cannot override. A first-screen task gives the judge only the first viewport and asks the four visitor questions against the reference concepts. Seeded-defect copies (install route removed, contradicted claim added, headline buried) check that the evaluator detects known failures. Running new judges needs a separate accepted proposal. The completed landing-rubric-1 plan used two fresh anonymous Codex scoring contexts and two reversed-order pairwise contexts.
      note: Five named designs and the current live-homepage baseline evaluated under frozen product-trial contract landing-rubric-1. Four fresh Codex contexts produced 24 individual assessments and four opposite-order pairwise assessments from twelve primary desktop/375px captures. Each scorer inspected 48 selected PNGs; each comparer inspected sixteen. All structured results passed input/case/image hash, exact quotation, evidence-reference, criterion and gate checks. Both scorers marked only Untangle the Problem as meeting all criteria at both widths; Check the Because cleared five dimensions but lacked a usable skill-trial route. Exploratory shortlist used dimensions reaching anchor 2 from both judges at both widths. Individual scores agree on 70/72 items; pairwise outcomes agree on 12/12 mapped comparisons. Separate contexts share model biases; order and session vary together. No human calibration, visitor comprehension or conversion is established. The reference brief is not an exhaustive capability inventory and its factual flags require review. Public results and selected evidence are in website/landing-lab/results; native adapter and reproducible capture/import/report workflow in apps/landing-evals. Eighteen evaluator tests and 685 website links/assets pass. Local desktop/375px score filters, evidence anchors and full-resolution viewer pass with no JavaScript errors or document overflow; normal main-to-Flowershow publication is the delivery path. Keep this backlog open pending human calibration and real visitor evidence. Implementation reasoncommons-x59; no nodes, links or standings changed. Correction 2026-10-20. The landing-rubric-1 recommendation to start human testing with Untangle the Problem is withdrawn. Its only install route is a Download the skill button that calls the Claude artifact runtime; on the public preview it reports that the view cannot save files, yet both judges scored next action 3/3 because judges read text and did not exercise links or buttons. Individual and comparison agreement measured repeatability within one model family, five of six criteria repeated identically across viewports because both received the same full text, and scores saturated at the top anchor. No replacement page is chosen until a landing-rubric-2 run.
    - ref: g-e-real-users
      work: validate_landing_evals_with_visitors
      evaluation_plan: Treat the share of visitors who correctly say what Reason Commons is, and what it would help with, after the initial exposure as the primary comprehension measure. Calibrate the automated first-screen task against those answers before relying on it to rank pages.
      note: Calibrate automated judgments against real visitor comprehension responses and human labels, then observe subsequent use. Evaluation infrastructure alone does not establish adoption. A local visitor study now assigns one page, records an initial exposure, hides it for four answers, restores it for exploration and exports an anonymous response file. The browser fixture verified random assignment, about 20 seconds of exposure, hidden-page questions and a valid download; the marked test response was not retained as visitor evidence. The public hosted flow also passed the 20-second exposure, hidden questions, exploration and copyable JSON export with marked automation answers; no real participant response was retained. Anonymous hosting has no session persistence and records that limitation. Actual recruitment, human labels, validity of the rubric and subsequent use remain untested.
    - ref: g-e-picturable-product
      work: show_skill_use_in_explainers
      label: Show the skill in use beside all three parts of the explainer series.
      note: Implements proposed injection f-e-explainers-skill-margin as alternative in-practice editions of the trilogy. David's review identified premature messages and weak coordination with the team's learning. Under accepted scope explainer-margin-pacing-2026-10-20 revision 1, the three local editions now show the cast and introduced capacities before an explicit skill invitation, then reveal individual messages at their assigned story beats and restore earlier states on reverse scroll. All 100 beats passed synchronization, message-fit and overflow checks at six desktop/phone/tablet/landscape sizes; 24 settled screenshots were inspected, the Chrome 375px checker reported no overflow, and the 713-link/asset website check passed. Original prose and original editions are preserved. Reduced-motion and script-free fallback branches passed temporary fixture checks; native OS preference toggling was not tested. See docs/marketing/explainers/series/07-skill-margin-scroll-map.md for the evidence and limits. Local files and browser preview only; David's editorial review and test_with_readers remain open, and no reader benefit is established.
      beads:
      - reasoncommons-brw
