    - ref: f-e-readable-diagram-labels
      work: label_remaining_statements
      label: Label the remaining long statements.
      note: Write one-sentence labels for the remaining statements longer than about 90 characters, keeping the qualifiers their accuracy depends on; until then diagrams show their full text.
    - ref: f-rel-native-diagrams-aid-inspection
      work: test_rendering_and_inspection
      note: In fresh Codex and Claude desktop sessions, show the remote-work gold fixture and inspect its labels and connections; also check a plain-text fallback. Offline helper checks pass; these do not establish real-user usability.
    - ref: f-e-typed-change-proposals
      work: review_fragment
      note: Review the completion-report observation, typed-response rule and proposed traceability link together. Requesting the implementation does not endorse the predicted effect.
    - ref: f-rel-typed-proposals-expose-reasoning
      work: test_response_conformance
      note: Inspect explicit change requests, terse fixes, next-step requests and completion reports in fresh sessions. Independent gold-fixture runs passed explicit changes, Next step recommendations and a terse fix, including proposal-before-edit and completion reporting; this does not establish reliable conformance across hosts or real-user benefit.
    - ref: f-e-explicit-node-roles
      work: review_fragment
      note: Review the explicit node-metadata proposal and its proposed inspection benefit together. Implementing the labels does not accept the reasoning.
    - ref: f-rel-node-roles-aid-inspection
      work: test_metadata_readability
      note: Inspect mixed-tree proposals and native Mermaid, widget and text views. Confirm that each displayed tree and kind matches the YAML and that labels do not crowd out the statement.
    - ref: f-e-recorded-change-acceptance
      work: review_fragment
      note: Review the acceptance-gate rule and its predicted traceability benefit together. Approval of implementation does not endorse the reasoning predictions.
    - ref: f-rel-recorded-acceptance-adds-trace
      work: test_acceptance_conformance
      note: An independent gold-fixture turn displayed its proposal and changed no files while waiting; its simulated typed acceptance continuation saved and validated the receipt and backlog before editing the README. Metadata, historical-reference preservation and unchanged reasoning standing passed helper tests. Ambiguous replies, material revisions and conformance in real host sessions remain to be checked; these tests do not establish the predicted traceability benefit.
    - ref: f-e-prs-reference-change-acceptance
      work: review_fragment
      note: Review the PR integration rule with its proposed traceability benefit. Approving implementation does not endorse the prediction. PR 60 exposed a formatting-only failure when an explanatory paragraph accompanied valid approval references; David requested allowing such paragraphs while preserving explicit reference and scope checks. The correction passes the regression and helper suite; observe continued use, since implementation approval does not endorse the proposed benefit.
      beads:
      - reasoncommons-zfk
    - ref: f-rel-pr-acceptance-aids-traceability
      work: test_pr_acceptance_scope
      note: All 55 helper tests passed, including missing or malformed approvals, unknown versions, uncovered files and node/link IDs, staged and committed scope, rename coverage, receipt preservation and unchanged reasoning standing. On 2026-10-15 all 77 helper tests pass. PR 60's explanatory paragraph passes before, between and after explicit valid approval references, while prose alone, malformed, duplicate and unknown references and incomplete scope coverage still fail. The regression failed against the previous parser before the correction. Review the complete PR and observe real use; declared coverage cannot establish semantic conformance, consent authenticity or the predicted traceability benefit.
      beads:
      - reasoncommons-zfk
    - ref: f-e-pr-diagrams-show-changes
      work: review_fragment
      note: Review the PR diagram rule and its proposed inspection benefit. Implementation approval does not endorse the prediction.
    - ref: f-rel-pr-diagrams-aid-inspection
      work: test_pr_diagram_readability
      feedback: David's 2026-10-14 screenshot showed four separate single-node Current Reality diagrams obscuring their shared tree. Verify one diagram per affected tree, explicit unresolved connections, preserved topology and readable labels.
      note: All 71 helper tests passed after the grouping correction. Actual GitHub inspection confirmed one diagram per affected tree (Current Reality and Future Reality), complete SVG labels, preserved topology, explicit unresolved-connection notes and a collapsed complete checklist. The larger Future Reality diagram uses GitHub inspection and zoom controls. Keep review of the predicted inspection benefit and real-use readability open; source validation does not establish usability.
    - ref: f-e-changes-name-reasoning
      work: test_pr_merge_enforcement
      direct_push_test: On 2026-10-18 David accepted test-main-push-2026-10-18 revision 1 after the unintended main ruleset was disabled. This test starts from current origin/main in an isolated checkout and changes only a .gitignore comment plus this minimal approval and test record. Pre-push validation confirms identical ignore patterns, valid YAML, unchanged reasoning and a two-file scoped diff; the website check reports 535 links/assets and zero errors. The presence of this commit on remote main supplies evidence of delivery by an ordinary direct push without a PR; the local session record retains the verification result. No node, link or standing changes.
      feedback: GitHub reported main as unprotected with no required checks or active rules, despite the Tree check workflow introduced by PRs 58 and 59.
      note: Applied .github/branch-protection.json and read back main as protected, with required_status_checks.strict true, required tree-check from GitHub Actions app 15368 and enforce_admins.enabled true. PR 61 was BLOCKED while its required check was pending, then CLEAN after the check passed. Existing nodes, links, standings, receipts and collaboration priority match main after merged PR 59. Continue observing real-use merge behavior and retain the existing reasoning review work and proposed standing.
      beads:
      - reasoncommons-ilh
    - ref: f-e-pr-diagrams-show-changes
      work: test_pr_diagram_configuration
      feedback: Run 38586022836 rejected PR 59 because added Mermaid display configuration differed from the generated source, although all eight graph bodies matched. The later merged PR corrected its generated configuration.
      note: All 74 helper tests passed on main after PR 59, and PR 61 passed the required GitHub Actions Tree check. Supported wrapping widths, key order, equivalent YAML formatting and omitted optional width pass; changed statements, standings, relations and endpoints still fail. Invalid or unsupported configuration has a specific error. Grouped diagrams, htmlLabels false, unresolved-connection notes, collapsed lists, receipts and coverage checks remain intact. Actual GitHub inspection confirmed the rendered no-node/link-change declaration, served reasoning, closed complete-checklist disclosure, backlog and acceptance reference. Real-use readability review remains open.
      beads:
      - reasoncommons-ilh
