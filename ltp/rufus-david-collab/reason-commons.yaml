      work: trace_effects
      label: "Would knowing where to look get David timely feedback, and what could go wrong?"
      note: Trace from f-e-rufus-knows-where-to-look to Rufus's feedback on the target user and how to present it (Current Reality r-e-rufus-feedback-hard). Possible negative branches include alerts adding to message volume and a wrong pointer drawing attention away from the real blocker.
