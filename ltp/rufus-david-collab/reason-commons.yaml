      kind: desirable_effect
      text: After code-and-conversation restoration and regeneration, current reasoning and accepted diagrams agree while earlier accepted revisions remain inspectable.
      assumptions:
      - text: Reversing current reasoning does not require erasing its earlier accepted revisions.
