    - ref: f-e-rufus-attention-pointer
      work: connect_or_explain
      label: "Relate this to the Discord bot and to recommending one next step."
      note: Possible relationships to f-e-discord-on-demand, f-rel-discord-alignment-supports-next and f-e-skill-recommends-next are not established.
    - ref: f-rel-worktree-inherit-current
      work: verify_feedback_sync
      label: Verify that sharing is on in a fresh session worktree.
      note: After the change merges and the installed skill is updated, start a new session; check that sync reports sharing on through the main checkout's authorisation and that a feedback reply reaches origin/main. Also check whether the session branch's copy of the reasoning file conflicts with the shared feedback when that session's PR merges.
