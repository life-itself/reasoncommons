    - ref: f-e-skill-recommends-next
      work: clarify_basis
      note: 'David asked whether the recommended step is the constraint. Which step should the skill recommend: the one addressing the cause that reaches the most undesirable effects, the core conflict, the widest goal-tree gap, or, when the tree cannot yet tell, the test that would settle it?'
    - ref: f-e-skill-recommends-next
