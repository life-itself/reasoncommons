      status: proposed
      contributions:
      - by: assistant
        attribution: assistant
        mode: text
    - id: f-e-repo-concern-boundaries
      kind: injection
      text: The repository separates shared reasoning, project working material, installable skills, runnable applications and website publishing into distinct areas while retaining one shared collaboration reasoning file.
      status: proposed
      addresses:
      - r-e-repo-feels-scattered
      assumptions:
      - text: Clear boundaries between the repository's concerns may reduce future technical debt while accommodating its diverse jobs to be done.
        by: david
      contributions:
      - by: david
        attribution: explicit
        mode: text
        note: 'Directory layout proposed for discussion on 2026-10-16: root README.md as project map, AGENTS.md, motivation.md and existing generated NEXT.md; shared ltp/rufus-david-collab/reason-commons.yaml; docs/product, docs/marketing and docs/business alongside existing references and plans; skills/reason-commons, ltp-project, ltp-visualize and scrollable-explainer with their helpers; apps/discord for bot code, configuration and tests; website/ as the Flowershow publishing root with README.md, config.json, custom.css, about.md, explainers, public ltp introduction, library, demos, dashboard, blog and changelog; root scripts, .beads and .github. David asked for an assessment; no implementation or reasoning endorsement is inferred.'
      - by: assistant
        attribution: assistant
        mode: text
        note: 'Implementation scope approved by David under change-repository-boundaries-2026-10-16 revision 1: distinct reasoning, project work, skill, application and website areas; exact 445-move/929-path manifest; canonical sources with explicit public exports; preserved intended public routes; local committed branch and preview verification; production-root cutover remains a separate deployment step. Approval does not endorse the expected technical-debt reduction.'
      - by: assistant
        attribution: assistant
        mode: text
        note: 'Implemented revision 1 locally on codex/repository-boundaries: 445 declared moves, a project-map README, product/marketing/business and app ownership maps, four explicit public exports, updated preview/library paths, website CI and current Beads path references. Checks: 77 reasoning-helper tests; 535 local links/assets and migration audit; exporter/checker negative contracts; remote-work and six-tree dashboard toy checks; book checker matches its six-warning baseline. 401 of 445 moves are byte-identical, including dashboard/CSS/JS and all moved media. Local desktop/375px checks had no JavaScript errors and working routes returned 404. Dashboard phone-check flags existing tab children inside an overflow-x:auto nav; document width remains 375px and dashboard bytes match the base. Flowershow CLI is unavailable, so cloud preview and production root cutover remain unverified. Implementation completion does not endorse the injection or establish technical-debt reduction.'
