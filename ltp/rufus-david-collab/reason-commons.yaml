      work: test_causality
      note: Observe invocation, relevant capture and review in real work; availability and local code tests do not establish use.
    - ref: f-rel-discord-alignment-supports-next
      work: test_causality
      note: Check whether aligned reasoning plus task context actually helps collaborators choose their next action.
    - ref: f-e-discord-diverts-resources
      work: test_negative_branch
      note: Measure operating/maintenance cost and whether it displaces real-work testing; current reservation is unverified.
    - ref: f-e-discord-misrepresents-agreement
      work: test_negative_branch
      note: Exercise identity, endorsement and persistent-state controls live and assess remaining misuse/failure cases.
    - ref: f-e-readers-picture-skill-use
      work: test_with_readers
      label: Check with readers whether the margin makes the skill connection.
      note: Show the in-practice editions to readers who have not used the skill. Check whether they understand why the team brings it in, what it contributes at each stage, and where they might use it in their own role. Ask whether any margin message disclosed an answer before the story established its basis. Publishing the editions and passing synchronization checks do not establish reader comprehension.
      beads:
      - reasoncommons-brw
    - ref: f-e-explainers-skill-margin
      work: align_margin_with_learning
      label: Align each margin message with the team's learning in the story.
      note: David reports that the margin gets ahead of the narrative, particularly while The Wrong Queue introduces station capacities. The local implementation under explainer-margin-pacing-2026-10-20 revision 1 now keeps the cast visible and highlights introduced stations before the explicit skill invitation; messages then follow individual beats with reversible state, concise copy, role-appropriate devices and reduced motion support. Technical verification is recorded on show_skill_use_in_explainers and in the scroll map. Remaining work is David's editorial review of the learning progression and reader feedback; mechanical synchronization does not establish that the sequence teaches effectively. The injection and its predicted reader effect remain proposed.
      beads:
      - reasoncommons-brw
    - ref: f-rel-feedback-reviewable
      work: verify_feedback_cycle
      beads:
      - reasoncommons-foj
      label: Verify shared feedback across sessions and Discord.
      note: Test participant filtering, optional timing, resumption, independent benefit/harm reports, deferral, version preservation, duplicates and interrupted saves using the toy fixture, then a real participant trial.
    - ref: f-rel-feedback-supports-learning
      work: evaluate_real_feedback
      label: Review actual feedback and its effect on reasoning.
      note: David supplied report david-pr74-works-as-expected-2026-10-20 after the request resurfaced with both original outcomes; this separate session read the saved report. The report is positive self-report, with the separate real-expectation trial still unverified and burden unassessed. Review the observations against pr-74-feedback-cycle-self-test revision 1, including the earlier manual activation and any deviations. Implementation checks and sharing receipts do not establish usefulness, absence of harm or endorsement.
    - ref: f-rel-feedback-adds-burden
      work: test_negative_branch
      label: Assess premature requests and reminder burden.
      note: Obtain feedback from people who experience requests; absence of a report is not evidence of absence of harm.
    - ref: f-rel-feedback-controls-reduce-burden
      work: evaluate_feedback_controls
      label: Check whether deferral and bounded delivery reduce burden.
      note: Mocked delivery checks verify implementation only; actual interruption burden remains to be assessed.
    - ref: f-rel-sync-shares-feedback
      work: verify_feedback_sync
      beads:
      - reasoncommons-g32
      label: Verify current feedback across two checkouts.
      note: Test sharing, independent concurrent reports, preserved predictions, deferrals, offline operation, retries without duplication and exclusion of unrelated files with the remote-work fixture and temporary Git remotes.
    - ref: f-rel-shared-feedback-reviewable
      work: evaluate_feedback_sync_trial
      label: Review whether sharing makes feedback available for reasoning.
      note: David will assess feedback-sync-pilot revision 1 after the updated skill is installed and used across two checkouts. Keep automated sharing tests separate from his benefit assessment and retain work to interpret observations.
    - ref: f-rel-sync-friction
      work: evaluate_sync_recovery_burden
      label: Assess delays and recovery work from sync failures.
      note: Record failed sharing, conflicts and manual intervention separately from benefit; do not infer absence of burden from a successful push. The assistant observed two instances on the first real sync (r-e-sync-left-checkout-behind, r-e-sync-reformatted-backlog); fixes are proposed under sync-fixes-2026-10-20, and David's own assessment remains pending.
    - ref: f-rel-sync-preservation
      work: verify_sync_preservation
      label: Verify unsent observations survive interrupted sharing.
      note: Exercise conflict, offline and uncertain-delivery recovery without losing observations, rewriting prediction versions or endorsing reasoning.
    - ref: f-rel-pr-outcomes-visible
      work: verify_pr_expected_outcomes
      label: Check the section against real PRs.
      note: Regenerate PR 74 and PR 76 descriptions with the new section and inspect GitHub rendering; then judge readability on the next PR that carries a prediction under pr-expected-outcomes-check revision 1.
    - ref: f-rel-pr-outcomes-overhead
      work: test_negative_branch
      label: Assess the overhead of explaining unassigned predictions.
      note: Ask David whether writing No feedback commitment reasons felt useful or like busywork; no report is not evidence of no overhead.
    - ref: f-rel-onboarding-reads-messages
      work: test_lasting_effect
      label: Ask whether the introduction keeps helping later.
      note: The first-session commitments test only a first reading. After a later session, ask whether the introduction still helps with change proposals and next steps, as a separate observation.
    - ref: f-e-first-session-onboarding
      work: connect_or_explain
      label: Would the same introduction serve a first demo user?
      note: Relate onboarding to demo coherence (r-e-david-demo-confidence, r-e-bot-needs-work-for-cold-testers) without assuming it closes that gap.
