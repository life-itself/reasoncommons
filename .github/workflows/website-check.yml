name: Website check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  website-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check publishing boundary, exports, routes and links
        run: python3 scripts/check-website.py
