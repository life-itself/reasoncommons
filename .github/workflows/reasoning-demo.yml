name: Accepted reasoning demonstration
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test publication boundaries and reasoning semantics
        run: python3 -m unittest discover -s apps/reasoning-demo -p 'test_*.py'
      - name: Check generated public snapshot and page
        run: python3 apps/reasoning-demo/build.py --check
      - name: Check browser script syntax
        run: node --check apps/reasoning-demo/app.js
