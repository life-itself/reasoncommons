    status: inferred
  - id: ASM-2
    statement: Missing decision rationale, not missing information, is what causes re-litigation.
    status: inferred
  - id: ASM-3
    statement: Scattered, unstructured team notes cause knowledge to be re-asked rather than found.
    status: inferred
  - id: ASM-4
    statement: A five-minute-habit rationale format gets adopted widely enough to change the team norm, not just used by its author.
    status: provisional
  - id: ASM-5
    statement: A structured migration stays maintained rather than decaying back into scattered pages.
    status: provisional

