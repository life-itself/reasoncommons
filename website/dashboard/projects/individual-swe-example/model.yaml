project:
  name: Individual Contributor — Software Engineer (example)
  analyzed_path: examples/individual-swe-notes
  analysis_mode: reverse
  provisional_goal: G-1

analysis:
  current_constraint: RC-1
  recommended_next_action: ACT-1
  expected_effect: TR-1
  updated_at: "2026-07-24T00:00:00Z"

entities:
  - id: G-1
    type: goal
    statement: Make personal and team-level learning durable — decisions, mentoring, and technical contributions leave something others can build on, not just completed activity
    status: inferred
    confidence: medium
    evidence: [EVD-1, EVD-9]
    assumptions:
      - "ASM-1 — The recurring durable-vs-evaporating pattern across work and non-work notes reflects a real personal priority, not incidental phrasing."
    reasoning: The journal names the same "conversation shifts something, then it evaporates" pattern in three unrelated groups and explicitly generalizes it; the TODO and project notes are all instances of trying to make some form of group progress durable.

  - id: CSF-1
    type: critical_success_factor
    statement: Team decisions have a durable, findable rationale instead of only chat history
    status: inferred
    confidence: high
    evidence: [EVD-2, EVD-3]

  - id: CSF-2
    type: critical_success_factor
    statement: Team knowledge lives in a structured, findable place instead of scattered pages
    status: observed
    confidence: medium
    evidence: [EVD-4]

  - id: CSF-3
    type: critical_success_factor
    statement: Mentoring effort compounds through deliberate repetition instead of happening ad hoc
    status: inferred
    confidence: medium
    evidence: [EVD-5, EVD-6]

  - id: RC-1
    type: root_cause
    statement: Nobody owns writing a decision's rationale down, so it defaults to being skipped
    status: inferred
    confidence: high
    evidence: [EVD-2, EVD-3]
    assumptions:
      - "ASM-2 — Missing decision rationale, not missing information, is what causes re-litigation."
    reasoning: The notes attribute relitigating to being unable to find *why* a decision was made, not to the decision itself being wrong or forgotten.

  - id: RC-2
    type: root_cause
    statement: Team notes are scattered across pages with no shared structure, so existing knowledge isn't findable later
    status: observed
    confidence: medium
    evidence: [EVD-4]

  - id: UDE-1
    type: undesirable_effect
    statement: The same three or four decisions get relitigated every few months
    status: observed
    confidence: high
    evidence: [EVD-2]

  - id: UDE-2
    type: undesirable_effect
    statement: Knowledge that already exists gets rediscovered or re-asked instead of found
    status: inferred
    confidence: medium
    evidence: [EVD-4]

  - id: INJ-1
    type: injection
    statement: Give every decision a stable ID, a one-paragraph rationale, alternatives considered, and a status, designed so writing it down is the fast path rather than the slow one
    status: inferred
    confidence: high
    evidence: [EVD-3]
    assumptions:
      - "ASM-4 — A five-minute-habit rationale format gets adopted widely enough to change the team norm, not just used by its author."
    reasoning: The plan explicitly names the friction as ownership, not tooling, and designs the format around that.

  - id: INJ-2
    type: injection
    statement: Migrate scattered team notes into one structured, versioned place
    status: provisional
    confidence: medium
    evidence: [EVD-4]
    assumptions:
      - "ASM-5 — A structured migration stays maintained rather than decaying back into scattered pages."

  - id: DE-1
    type: desirable_effect
    statement: Next time someone asks "didn't we already talk about this," the answer is a link, not a shrug
    status: inferred
    confidence: high
    evidence: [EVD-11]

  - id: DE-2
    type: desirable_effect
    statement: Team knowledge that already exists stops being rediscovered or re-asked
    status: inferred
    confidence: medium
    evidence: [EVD-4]

  - id: ACT-1
    type: action
    statement: Ship v2 of the decision-log tool
    status: inferred
    confidence: high
    evidence: [EVD-7]
    reasoning: The smallest next step that turns the already-designed injection into something teammates can actually use.

  - id: ACT-2
    type: action
    statement: Write an internal post on why the team keeps re-deciding the same thing
    status: inferred
    confidence: medium
    evidence: [EVD-8]

  - id: ACT-3
    type: action
    statement: Migrate the team wiki into a structured format
    status: provisional
    confidence: medium
    evidence: [EVD-4]

  - id: ACT-4
    type: action
    statement: Mentor Sam and Dev through a first design doc each
    status: inferred
    confidence: high
    evidence: [EVD-5, EVD-6]

  - id: TR-1
    type: expected_effect
    statement: The decision-log tool reaches v2 and the team starts giving new decisions stable IDs and rationale
    status: inferred
    confidence: high
    evidence: [EVD-7]

  - id: TR-2
    type: expected_effect
    statement: Teammates recognize the re-deciding pattern as a shared, named problem rather than individual déjà vu
    status: inferred
    confidence: medium
    evidence: [EVD-8]
    reasoning: Writing an internal post is only useful if its effect is shared recognition, not just documentation.

  - id: TR-3
    type: expected_effect
    statement: Team knowledge lives in one structured place instead of scattered pages
    status: inferred
    confidence: medium
    evidence: [EVD-4]

  - id: TR-4
    type: expected_effect
    statement: Sam and Dev each practice structuring and defending a real design decision, not just observing one
    status: inferred
    confidence: high
    evidence: [EVD-5, EVD-6]

  - id: ACT-5
    type: action
    statement: Send a small PR upstream to the CRDT library the team depends on (tombstone garbage-collection edge case)
    status: observed
    confidence: high
    evidence: [EVD-10]
    reasoning: Real, routine open-source maintenance work — deliberately left unconnected to G-1 or any CSF, since no evidenced mechanism ties it to the durable-learning goal. Kept in the model as an honest control case rather than omitted.

