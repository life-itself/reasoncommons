open_questions:
  - Do teammates agree that relitigated decisions, rather than something else, are the real friction, or is this one person's read?
  - Is the "five-minute path" actually five minutes once alternatives and status are included, or does that estimate not survive a real decision?
  - Does the decision-log tool need adoption mechanics beyond "ship v2," or is shipping the easy part and adoption the real constraint?

contradictions:
  - The notes treat relitigated decisions and scattered wiki pages as two separate root causes, but no evidence yet shows whether fixing one changes the other.

coverage_gaps:
  - Only this person's own TODO, project, and journal notes were available — no teammate interviews, PR history, or usage data on the decision-log tool's v1.
  - No evidence yet on whether teammates actually adopt the decision log once v2 ships.
