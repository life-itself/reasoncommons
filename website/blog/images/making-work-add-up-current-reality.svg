" x="-145" style="fill:#f5f6f7 !important;stroke:#9aa3ad !important;stroke-dasharray:4 3 !important" class="basic label-container"></rect><g transform="translate(-115, -36)" style="color:#17212e !important" class="label"><rect></rect><foreignObject height="72" width="230"><div xmlns="http://www.w3.org/1999/xhtml" style="color: rgb(23, 33, 46) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 230px; text-align: center; width: 230px;"><span class="nodeLabel" style="color:#17212e !important"><p>We discussed problems without remembering a tree existed for them</p></span></div></foreignObject></g></g><g transform="translate(493, 491)" id="flowchart-RC-2" class="node default key"><rect height="102" width="290" y="-51" x="-145" style="fill:#fff4d6 !important;stroke:#996000 !important;stroke-width:2px !important" class="basic label-container"></rect><g transform="translate(-115, -36)" style="color:#17212e !important" class="label"><rect></rect><foreignObject height="72" width="230"><div xmlns="http://www.w3.org/1999/xhtml" style="color: rgb(23, 33, 46) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 230px; text-align: center; width: 230px;"><span class="nodeLabel" style="color:#17212e !important"><p>ROOT CAUSE: nothing requires a change to connect to the trees; it is left to discipline</p></span></div></foreignObject></g></g><g transform="translate(493, 339)" id="flowchart-C1-3" class="node default cause"><rect height="102" width="290" y="-51" x="-145" style="fill:#f8fafc !important;stroke:#475569 !important" class="basic label-container"></rect><g transform="translate(-115, -36)" style="color:#17212e !important" class="label"><rect></rect><foreignObject height="72" width="230"><div xmlns="http://www.w3.org/1999/xhtml" style="color: rgb(23, 33, 46) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 230px; text-align: center; width: 230px;"><span class="nodeLabel" style="co