  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 clamp(34px, 5.6cqi, 80px); line-height: 1.06; letter-spacing: -0.03em; text-wrap: balance;\">We’ve made incredible progress in <span style=\"color: #A9ACB8;\">artificial intelligence.<\u002Fspan><\u002Fp>\n<p style=\"margin: 0; max-width: 16em; font-size: clamp(34px, 5.6cqi, 80px); line-height: 1.06; letter-spacing: -0.03em; text-wrap: balance;\">Perhaps it’s time we made some progress in <em style=\"font-style: italic; color: #FF6B45;\">collective intelligence.<\u002Fem><\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"problem\" aria-labelledby=\"problem-title\" style=\"padding: clamp(88px, 11cqi, 160px) clamp(20px, 5cqi, 72px);\">\n<div style=\"max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: clamp(56px, 7cqi, 96px);\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 32px clamp(32px, 6cqi, 112px); align-items: flex-start;\">\n<div style=\"flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 24px;\">\n<p style=\"margin: 0; display: flex; align-items: center; gap: 14px; font-family: 'Schibsted Grotesk', 'Helvetica Neue', Helvetica, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #B53018;\"><span style=\"font-family: 'Literata', Georgia, serif; font-style: italic; font-weight: 500; font-size: 22px; letter-spacing: 0; text-transform: none;\">I.<\u002Fspan><span style=\"width: 36px; height: 1px; background: currentColor; flex: none;\"><\u002Fspan><span>The Problem<\u002Fspan><\u002Fp>\n<h2 id=\"problem-title\" style=\"margin: 0; font-weight: 400; font-size: clamp(36px, 5.2cqi, 72px); line-height: 1.04; letter-spacing: -0.028em; text-wrap: balance;\">We’ve become extraordinarily good at solving the <em style=\"font-style: italic; color: #CF3A1B;\">wrong<\u002Fem> problems.<\u002Fh2>\n<\u002Fdiv>\n<div style=\"flex: 1 1 420px; min-width: 0; max-width: 660px; display: flex; flex-direction: column; gap: 36px;\">\n<div style=\"display: flex; flex-direction: column; gap: 12px;\">\n<p style=\"margin: 0; font-size: clamp(20px, 1.9cqi, 25px); line-height: 1.45; letter-spacing: -0.005em; text-wrap: pretty;\">Every year, organisations spend billions becoming more efficient.<\u002Fp>\n<p style=\"margin: 0; font-size: clamp(18px, 1.45cqi, 20px); line-height: 1.62; text-wrap: pretty;\">They optimise departments, measure performance, introduce systems, hire consultants and develop elaborate strategies.<\u002Fp>\n<p style=\"margin: 0; font-size: clamp(18px, 1.45cqi, 20px); line-height: 1.62;\">And somehow, the problems remain.<\u002Fp>\n<p style=\"margin: 0; font-size: clamp(18px, 1.45cqi, 20px); line-height: 1.62; font-style: italic;\">Sometimes they become more expensive.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 12px;\">\n<p style=\"margin: 0; font-size: clamp(18px, 1.45cqi, 20px); line-height: 1.62;\">This isn’t necessarily because people are foolish.<\u002Fp>\n<p style=\"margin: 0; font-size: clamp(18px, 1.45cqi, 20px); line-height: 1.62;\">Quite the opposite.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: flex; gap: clamp(14px, 2cqi, 24px); align-items: flex-start; padding-top: 28px; border-top: 1px solid rgba(21,23,31,0.16);\">\n<svg sc-camel-view-box=\"0 0 64 32\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex: none; width: clamp(44px, 4.6cqi, 60px); height: auto; margin-top: 0.35em; color: #CF3A1B;\"><rect x=\"3\" y=\"9\" width=\"8\" height=\"17\" rx=\"1.5\"><\u002Frect><path d=\"M6.8 9.5v16\"><\u002Fpath><path d=\"M11 11.5C15 9.5 19 9 23 9h35a3 3 0 0 1 0 6H33\"><\u002Fpath><path d=\"M33 15h0.5a2.25 2.25 0 0 1 0 4.5H31\"><\u002Fpath><path d=\"M31 19.5h0.5a2.25 2.25 0 0 1 0 4.5H29\"><\u002Fpath><path d=\"M29 24a2 2 0 0 1 0 4h-7c-5 0-8-1.5-11-3.5\"><\u002Fpath><path d=\"M16 15.5c4-1.5 9-1.5 13-0.5\"><\u002Fpath><\u002Fsvg>\n<p style=\"margin: 0; font-size: clamp(23px, 2.4cqi, 32px); line-height: 1.24; letter-spacing: -0.012em; text-wrap: pretty;\">It’s often because intelligent people are very good at making individually sensible decisions that produce <em style=\"font-style: italic; color: #CF3A1B;\">collectively ridiculous<\u002Fem> outcomes.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 16px;\">\n<article style=\"background: #FFFFFF; border: 1px solid rgba(21,23,31,0.14); padding: clamp(22px, 2.4cqi, 32px); display: flex; flex-direction: column; gap: 18px;\">\n<div style=\"display: flex; flex-direction: column; gap: 10px;\">\n<p style=\"margin: 0; display: flex; align-items: center; gap: 8px; font-family: 'Schibsted Grotesk', 'Helvetica Neue', Helvetica, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #1B2BA8;\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 12.5l5 5L20 6.5\"><\u002Fpath><\u002Fsvg>Each part<\u002Fp>\n<p style=\"margin: 0; font-size: clamp(20px, 1.8cqi, 24px); line-height: 1.3; text-wrap: pretty;\">A hospital can run every department efficiently<\u002Fp>\n<\u002Fdiv>\n<div style=\"height: 1px; background: rgba(21,23,31,0.14);\"><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 10px;\">\n<p style=\"margin: 0; display: flex; align-items: center; gap: 8px; font-family: 'Schibsted Grotesk', 'Helvetica Neue', Helvetica, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #B53018;\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 6l12 12\"><\u002Fpath><path d=\"M18 6L6 18\"><\u002Fpath><\u002Fsvg>The whole<\u002Fp>\n<p style=\"margin: 0; font-size: clamp(20px, 1.8cqi, 24px); line-height: 1.3; font-style: italic; color: #B53018;\">while patients wait for hours.<\u002Fp>\n<\u002Fdiv>\n<\u002Farticle>\n<article style=\"background: #FFFFFF; border: 1px solid rgba(21,23,31,0.14); padding: clamp(22px, 2.4cqi, 32px); display: flex; flex-direction: column; gap: 18px;\">\n<div style=\"display: flex; flex-direction: column; gap: 10px;\">\n<p style=\"margin: 0; display: flex; align-items: center; gap: 8px; font-family: 'Schibsted Grotesk', 'Helvetica Neue', Helvetica, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #1B2BA8;\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 12.5l5 5L20 6.5\"><\u002Fpath><\u002Fsvg>Each part<\u002Fp>\n<p style=\"margin: 0; font-size: clamp(20px, 1.8cqi, 24px); line-height: 1.3; text-wrap: pretty;\">A company can meet every performance target<\u002Fp>\n<\u002Fdiv>\n<div style=\"height: 1px; background: rgba(21,23,31,0.14);\"><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 10px;\">\n<p style=\"margin: 0; display: flex; align-items: center; gap: 8px; font-family: 'Schibsted Grotesk', 'Helvetica Neue', Helvetica, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #B53018;\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 6l12 12\"><\u002Fpath><path d=\"M18 6L6 18\"><\u002Fpath><\u002Fsvg>The whole<\u002Fp>\n<p style=\"margin: 0; font-size: clamp(20px, 1.8cqi, 24px); line-height: 1.3; font-style: italic; color: #B53018;\">while disappointing its customers.<\u002Fp>\n<\u002Fdiv>\n<\u002Farticle>\n<article style=\"background: #FFFFFF; border: 1px solid rgba(21,23,31,0.14); padding: clamp(22px, 2.4cqi, 32px); display: flex; flex-direction: column; gap: 18px;\">\n<div style=\"display: flex; flex-direction: column; gap: 10px;\">\n<p style=\"margin: 0; display: flex; align-items: center; gap: 8px; font-family: 'Schibsted Grotesk', 'Helvetica Neue', Helvetica, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #1B2BA8;\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 12.5l5 5L20 6.5\"><\u002Fpath><\u002Fsvg>Each part<\u002Fp>\n<p style=\"margin: 0; font-size: clamp(20px, 1.8cqi, 24px); line-height: 1.3; text-wrap: pretty;\">A school can improve its examination results<\u002Fp>\n<\u002Fdiv>\n<div style=\"height: 1px; background: rgba(21,23,31,0.14);\"><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 10px;\">\n<p style=\"margin: 0; display: flex; align-items: center; gap: 8px; font-family: 'Schibsted Grotesk', 'Helvetica Neue', Helvetica, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #B53018;\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 6l12 12\"><\u002Fpath><path d=\"M18 6L6 18\"><\u002Fpath><\u002Fsvg>The whole<\u002Fp>\n<p style=\"margin: 0; font-size: clamp(20px, 1.8cqi, 24px); line-height: 1.3; font-style: italic; color: #B53018;\">while diminishing its pupils’ curiosity.<\u002Fp>\n<\u002Fdiv>\n<\u002Farticle>\n<\u002Fdiv>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 32px clamp(32px, 6cqi, 112px); align-items: flex-end;\">\n<p style=\"flex: 1 1 340px; min-width: 0; margin: 0; font-size: clamp(26px, 3.2cqi, 44px); line-height: 1.14; letter-spacing: -0.018em; text-wrap: balance;\">It’s entirely possible for everyone to be doing their best while the system gets worse.<\u002Fp>\n<div style=\"flex: 1 1 420px; min-width: 0; max-width: 660px; display: flex; flex-direction: column; gap: 10px;\">\n<p style=\"margin: 0; font-size: clamp(18px, 1.45cqi, 20px); line-height: 1.62; color: #4A4D5A;\">Which suggests an intriguing possibility.<\u002Fp>\n<p style=\"margin: 0; font-size: clamp(22px, 2.2cqi, 30px); line-height: 1.25; letter-spacing: -0.012em;\">Perhaps the problem isn’t the people.<\u002Fp>\n<p style=\"margin: 0; font-size: clamp(22px, 2.2cqi, 30px); line-height: 1.25; letter-spacing: -0.012em; font-style: italic; color: #CF3A1B; text-wrap: balance;\">Perhaps it’s the way we’re thinking about the problem.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"try\" aria-labelledby=\"try-title\" style=\"background: #1B2BA8; color: #FFFFFF; padding: clamp(80px, 10cqi, 144px) clamp(20px, 5cqi, 72px);\">\n<div style=\"max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: clamp(36px, 4.4cqi, 56px);\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 32px clamp(32px, 6cqi, 112px); align-items: flex-end; justify-content: space-between;\">\n<div style=\"flex: 999 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 20px;\">\n<p style=\"margin: 0; display: flex; align-items: center; gap: 14px; font-family: 'Schibsted Grotesk', 'Helvetica Neue', Helvetica, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #B9C3FF;\"><span style=\"width: 36px; height: 1px; background: currentColor; flex: none;\"><\u002Fspan><span>A thirty-second experiment<\u002Fspan><\u002Fp>\n<h2 id=\"try-title\" style=\"margin: 0; max-width: 20em; font-weight: 400; font-size: clamp(32px, 4.4cqi, 60px); line-height: 1.08; letter-spacing: -0.025em; text-wrap: balance;\">You run a small hospital. You can give one department 50% more capacity. <em style=\"font-style: italic; color: #B9C3FF;\">Which one?<\u002Fem><\u002Fh2>\n<p style=\"margin: 0; font-size: clamp(18px, 1.5cqi, 20px); line-height: 1.55; color: #DCE1FF;\">Every patient passes through all five departments, in order.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1 1 240px; max-width: 340px; display: flex; flex-direction: column; gap: 6px; padding: 20px 22px; border: 1px solid rgba(255,255,255,0.32); border-radius: 4px;\">\n<p style=\"margin: 0; font-family: 'Schibsted Grotesk', 'Helvetica Neue', Helvetica, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #B9C3FF;\">The whole hospital treats<\u002Fp>\n<p style=\"margin: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px;\"><span style=\"font-size: clamp(56px, 6cqi, 84px); line-height: 1; letter-spacing: -0.04em;\">{{flow}}<\u002Fspan><span style=\"font-size: 18px; color: #DCE1FF;\">patients an hour<\u002Fspan><\u002Fp>\n<sc-if value=\"{{right}}\" hint-placeholder-val=\"{{false}}\"><p style=\"margin: 0; font-family: 'Schibsted Grotesk', 'Helvetica Neue', Helvetica, sans-serif; font-size: 14px; font-weight: 600; color: #FFFFFF;\">Up 50%<\u002Fp><\u002Fsc-if>\n<sc-if value=\"{{wrong}}\" hint-placeholder-val=\"{{false}}\"><p style=\"margin: 0; font-family: 'Schibsted Grotesk', 'Helvetica Neue', Helvetica, sans-serif; font-size: 14px; font-weight: 600; color: #B9C3FF;\">No change<\u002Fp><\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<ol aria-label=\"Departments, in the order patients pass through them\" style=\"list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); gap: 10px;\">\n<li style=\"display: flex; min-width: 0;\">\n<button type=\"button\" sc-camel-on-click=\"{{s0.pick}}\" aria-pressed=\"{{s0.pressed}}\" style=\"width: 100%; display: flex; flex-direction: column; align-items: stretch; gap: {s2.track}}; border-radius: 3px; overflow: hidden;\"><span style=\"display: block; height: 100%; width: {{s2.bar}}; background: {{s2.barColor}}; border-radius: 3px; transition: width 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);\"><\u002Fspan><\u002Fspan>\n<sc-if value=\"{{s2.showTag}}\" hint-placeholder-val=\"{{false}}\"><span style=\"align-self: flex-start; padding: 4px 10px; border: 1px solid currentColor; border-radius: 999px; font-family: 'Schibsted Grotesk', 'Helvetica Neue', Helvetica, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;\">The constraint<\u002Fspan><\u002Fsc-if>\n<\u002Fbutton>\n<\u002Fli>\n<li style=\"display: flex; min-width: 0;\">\n<button type=\"button\" sc-camel-on-click=\"{{s3.pick}}\" aria-pressed=\"{{s3.pressed}}\" style=\"width: 100%; display: flex; flex-direction: column; align-items: stretch; gap: 14px; padding: 18px 18px 20px; text-align: left; font: inherit; color: {{s3.fg}}; background: {{s3.bg}}; border: 1px solid {{s3.border}}; border-radius: 4px; cursor: pointer; transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease;\">\n<span style=\"display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 12px;\"><span style=\"display: flex; align-items: baseline; gap: 10px;\"><span style=\"font-family: 'Schibsted Grotesk', 'Helvetica Neue', Helvetica, sans-serif; font-size: 13px; font-weight: 600; opacity: 0.7;\">4<\u002Fspan><span style=\"font-family: 'Schibsted Grotesk', 'Helvetica Neue', Helvetica, sans-serif; font-size: 17px; font-weight: 600;\">Tests<\u002Fspan><\u002Fspan><span style=\"white-space: nowrap; font-size: 15px;\"><span style=\"font-size: 30px; letter-spacing: -0.02em;\">{{s3.cap}}<\u002Fspan> an hour<\u002Fspan><\u002Fspan>\n<span aria-hidden=\"true\" style=\"display: block; height: 6px; background: {{s3.track}}; border-radius: 3px; overflow: hidden;\"><span style=\"display: block; height: 100%; width: {{s3.bar}}; background: {{s3.barColor}}; border-radius: 3px; transition: width 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);\"><\u002Fspan><\u002Fspan>\n<\u002Fbutton>\n<\u002Fli>\n<li style=\"display: flex; min-width: 0;\">\n<button type=\"button\" sc-camel-on-click=\"{{s4.pick}}\" aria-pressed=\"{{s4.pressed}}\" style=\"width: 100%; display: flex; flex-direction: column; align-items: stretch; gap: 14px; padding: 18px 18px 20px; text-align: left; font: inherit; color: {{s4.fg}}; background: {{s4.bg}}; border: 1px solid {{s4.border}}; border-radius: 4px; cursor: pointer; transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease;\">\n<span style=\"display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 12px;\"><span style=\"display: flex; align-items: baseline; gap: 10px;\"><span style=\"font-family: 'Schibsted Grotesk', 'Helvetica Neue', Helvetica, sans-serif; font-size: 13px; font-weight: 600; opacity: 0.7;\">5<\u002Fspan><span style=\"font-family: 'Schibsted Grotesk', 'Helvetica Neue', Helvetica, sans-serif; font-size: 17px; font-weight: 600;\">Discharge<\u002Fspan><\u002Fspan><span style=\"white-space: nowrap; font-size: 15px;\"><span style=\"font-size: 30px; letter-spacing: -0.02em;\">{{s4.cap}}<\u002Fspan> an hour<\u002Fspan><\u002Fspan>\n<span aria-hidden=\"true\" style=\"display: block; height: 6px; background: {{s4.track}}; border-radius: 3px; overflow: hidden;\"><span style=\"display: block; height: 100%; width: {{s4.bar}}; background: {{s4.barColor}}; border-radius: 3px; transition: width 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);\"><\u002Fspan><\u002Fspan>\n<\u002Fbutton>\n<\u002Fli>\n<\u002Fol>\n\n<div aria-live=\"polite\" style=\"min-height: 112px; padding-top: 28px; border-top: 1px solid rgba(255,255,255,0.24);\">\n<sc-if value=\"{{idle}}\" hint-placeholder-val=\"{{true}}\"><p style=\"margin: 0; font-size: clamp(20px, 2cqi, 26px); line-height: 1.4; font-style: italic; color: #B9C3FF;\">Pick a department to give it 50% more capacity.<\u002Fp><\u002Fsc-if>\n<sc-if value=\"{{wrong}}\" hint-placeholder-val=\"{{false}}\"><div style=\"display: flex; flex-direction: column; gap: 12px; max-width: 780px;\"><p style=\"margin: 0; font-size: clamp(26px, 3cqi, 40px); line-height: 1.12; letter-spacing: -0.02em; text-wrap: balance;\">The department improved. <em style=\"font-style: italic; color: #B9C3FF;\">The hospital didn’t.<\u002Fem><\u002Fp><p style=\"margin: 0; font-size: clamp(18px, 1.5cqi, 20px); line-height: 1.55; color: #DCE1FF; text-wrap: pretty;\">{{pickedName}} can now handle {{pickedCap}} patients an hour. The hospital still treats 10, because every patient still has to see a doctor, and the doctors can see only 10 an hour.<\u002Fp><\u002Fdiv><\u002Fsc-if>\n<sc-if value=\"{{right}}\" hint-placeholder-val=\"{{false}}\"><div style=\"display: flex; flex-direction: column; gap: 12px; max-width: 780px;\"><p style=\"margin: 0; font-size: clamp(26px, 3cqi, 40px); line-height: 1.12; letter-spacing: -0.02em; text-wrap: balance;\">One department improved. <em style=\"font-style: italic; color: #B9C3FF;\">So did the whole hospital.<\u002Fem><\u002Fp><p style=\"margin: 0; font-size: clamp(18px, 1.5cqi, 20px); line-height: 1.55; color: #DCE1FF; text-wrap: pretty;\">The doctors were the constraint. Give them 50% more capacity and the entire hospital treats 15 patients an hour instead of 10.<\u002Fp><\u002Fdiv><\u002Fsc-if>\n<sc-if value=\"{{active}}\" hint-placeholder-val=\"{{false}}\"><button type=\"button\" sc-camel-on-click=\"{{reset}}\" style=\"margin-top: 24px; display: inline-flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 22px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.6); background: transparent; color: #FFFFFF; font-family: 'Schibsted Grotesk', 'Helvetica Neue', Helvetica, sans-serif; font-size: 15px; font-weight: 600; cursor: pointer;\">Try again<\u002Fbutton><\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"idea\" aria-labelledby=\"idea-title\" style=\"padding: clamp(88px, 11cqi, 160px) clamp(20px, 5cqi, 72px);\">\n<div style=\"max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: clamp(56px, 7cqi, 96px);\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 32px clamp(32px, 6cqi, 112px); align-items: flex-end;\">\n<div style=\"flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 24px;\">\n<p style=\"margin: 0; display: flex; align-items: center; gap: 14px; font-family: 'Schibsted Grotesk', 'Helvetica Neue', Helvetica, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #B53018;\"><span style=\"font-family: 'Literata', Georgia, serif; font-style: italic; font-weight: 500; font-size: 22px; letter-spacing: 0; text-transform: none;\">II.<\u002Fspan><span style=\"width: 36px; height: 1px; background: currentColor; flex: none;\"><\u002Fspan><span>The Big Idea<\u002Fspan><\u002Fp>\n<h2 id=\"idea-title\" style=\"margin: 0; font-weight: 400; font-size: clamp(36px, 5.2cqi, 72px); line-height: 1.04; letter-spacing: -0.028em; text-wrap: balance;\">Common sense isn’t nearly as common as it ought to be.<\u002Fh2>\n<\u002Fdiv>\n<div style=\"flex: 1 1 420px; min-width: 0; max-width: 660px; display: flex; flex-direction: column; gap: 10px;\">\n<p style=\"margin: 0; font-size: clamp(20px, 1.9cqi, 25px); line-height: 1.45; letter-spacing: -0.005em;\">Not because people lack it.<\u002Fp>\n<p style=\"margin: 0; font-size: clamp(20px, 1.9cqi, 25px); line-height: 1.45; letter-spacing: -0.005em; text-wrap: pretty;\">But because we’ve made thinking <em style=\"font-style: italic; color: #CF3A1B;\">unnecessarily complicated.<\u002Fem><\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 48px clamp(32px, 6cqi, 112px); align-items: center;\">\n<ul style=\"flex: 1 1 340px; min-width: 0; list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px;\">\n<li style=\"font-size: clamp(22px, 2.3cqi, 30px); line-height: 1.2; letter-spacing: -0.012em;\">We’ve professionalised it.<\u002Fli>\n<li style=\"padding-left: clamp(16px, 2.4cqi, 36px); font-size: clamp(22px, 2.3cqi, 30px); line-height: 1.2; letter-spacing: -0.012em;\">Departmentalised it.<\u002Fli>\n<li style=\"padding-left: clamp(32px, 4.8cqi, 72px); font-size: clamp(22px, 2.3cqi, 30px); line-height: 1.2; letter-spacing: -0.012em;\">Wrapped it in impressive terminology.<\u002Fli>\n<li style=\"padding-left: clamp(48px, 7.2cqi, 108px); font-size: clamp(22px, 2.3cqi, 30px); line-height: 1.2; letter-spacing: -0.012em;\">Put it behind expensive qualifications.<\u002Fli>\n<li style=\"padding-left: clamp(64px, 9.6cqi, 144px); font-size: clamp(22px, 2.3cqi, 30px); line-height: 1.2; letter-spacing: -0.012em; font-style: italic; color: #4A4D5A; text-wrap: pretty;\">And occasionally turned rather obvious truths into diagrams requiring six hours of explanation.<\u002Fli>\n<\u002Ful>\n<figure style=\"flex: 1 1 340px; max-width: 540px; margin: 0; display: flex; flex-direction: column; gap: 14px; padding: clamp(18px, 2.4cqi, 28px); background: #FFFFFF; border: 1px solid rgba(21,23,31,0.14);\">\n<svg sc-camel-view-box=\"0 0 360 250\" role=\"img\" aria-label=\"A deliberately over-complicated diagram: eight boxes joined by a tangle of arrows, with one small red dot lost in the middle.\" style=\"width: 100%; height: auto; display: block;\">\n<defs><marker id=\"rc-arrow\" sc-camel-view-box=\"0 0 10 10\" sc-camel-ref-x=\"8\" sc-camel-ref-y=\"5\" sc-camel-marker-width=\"7\" sc-camel-marker-height=\"7\" orient=\"auto-start-reverse\"><path d=\"M1 1L9 5L1 9\" fill=\"none\" stroke=\"#15171F\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fmarker><\u002Fdefs>\n<g fill=\"none\" stroke=\"#15171F\" stroke-opacity=\"0.55\" stroke-width=\"1.2\" marker-end=\"url(#rc-arrow)\">\n<path d=\"M76 36C130 40 160 100 198 106\"><\u002Fpath>\n<path d=\"M156 40C120
