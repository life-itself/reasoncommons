ct x=\"296\" y=\"176\" width=\"38\" height=\"3\"><\u002Frect><rect x=\"296\" y=\"183\" width=\"30\" height=\"3\"><\u002Frect>\n<rect x=\"30\" y=\"208\" width=\"38\" height=\"3\"><\u002Frect><rect x=\"30\" y=\"215\" width=\"18\" height=\"3\"><\u002Frect>\n<rect x=\"158\" y=\"214\" width=\"38\" height=\"3\"><\u002Frect><rect x=\"158\" y=\"221\" width=\"26\" height=\"3\"><\u002Frect>\n<\u002Fg>\n<circle cx=\"158\" cy=\"160\" r=\"12\" fill=\"none\" stroke=\"#CF3A1B\" stroke-width=\"1.4\"><\u002Fcircle>\n<circle cx=\"158\" cy=\"160\" r=\"5\" fill=\"#CF3A1B\"><\u002Fcircle>\n<\u002Fsvg>\n<figcaption style=\"font-family: 'Schibsted Grotesk', 'Helvetica Neue', Helvetica, sans-serif; font-size: 13px; letter-spacing: 0.04em; color: #4A4D5A;\"><span style=\"font-family: 'Literata', Georgia, serif; font-style: italic; font-size: 15px; letter-spacing: 0;\">Fig. II<\u002Fspan> — A rather obvious truth, professionally explained.<\u002Ffigcaption>\n<\u002Ffigure>\n<\u002Fdiv>\n\n<div style=\"display: flex; flex-direction: column; gap: 18px; padding: clamp(28px, 4cqi, 56px) 0; border-top: 3px solid #15171F; border-bottom: 1px solid #15171F;\">\n<p style=\"margin: 0; font-style: italic; font-size: clamp(18px, 1.5cqi, 21px); color: #4A4D5A;\">Consider this:<\u002Fp>\n<div style=\"display: flex; gap: clamp(14px, 2cqi, 28px); align-items: flex-start;\">\n<svg sc-camel-view-box=\"0 0 64 32\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex: none; width: clamp(44px, 5.4cqi, 76px); height: auto; margin-top: 0.3em; color: #CF3A1B;\"><rect x=\"3\" y=\"9\" width=\"8\" height=\"17\" rx=\"1.5\"><\u002Frect><path d=\"M6.8 9.5v16\"><\u002Fpath><path d=\"M11 11.5C15 9.5 19 9 23 9h35a3 3 0 0 1 0 6H33\"><\u002Fpath><path d=\"M33 15h0.5a2.25 2.25 0 0 1 0 4.5H31\"><\u002Fpath><path d=\"M31 19.5h0.5a2.25 2.25 0 0 1 0 4.5H29\"><\u002Fpath><path d=\"M29 24a2 2 0 0 1 0 4h-7c-5 0-8-1.5-11-3.5\"><\u002Fpath><path d=\"M16 15.5c4-1.5 9-1.5 13-0.5\"><\u002Fpath><\u002Fsvg>\n<div style=\"display: flex; flex-direction: column; gap: 14px; min-width: 0;\">\n<p style=\"margin: 0; max-width: 20em; font-size: clamp(28px, 4cqi, 56px); line-height: 1.1; letter-spacing: -0.025em; text-wrap: balance;\">If you want to improve something, it helps to understand what’s stopping it from improving.<\u002Fp>\n<p style=\"margin: 0; font-style: italic; font-size: clamp(19px, 1.7cqi, 23px); color: #B53018;\">Not exactly rocket science.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 32px clamp(32px, 6cqi, 112px); align-items: flex-start;\">\n<div style=\"flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 12px;\">\n<p style=\"margin: 0; font-size: clamp(18px, 1.45cqi, 20px); line-height: 1.62;\">Yet remarkably little of what we call improvement begins there.<\u002Fp>\n<p style=\"margin: 0; font-size: clamp(18px, 1.45cqi, 20px); line-height: 1.62; text-wrap: pretty;\">Instead, we often improve whatever is easiest to measure, most politically convenient, or currently fashionable.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1 1 420px; min-width: 0; max-width: 660px; display: flex; flex-direction: column; gap: 8px;\">\n<p style=\"margin: 0; font-size: clamp(22px, 2.2cqi, 30px); line-height: 1.25; letter-spacing: -0.012em;\">We make the parts better and hope the whole improves.<\u002Fp>\n<p style=\"margin: 0; font-size: clamp(22px, 2.2cqi, 30px); line-height: 1.25; letter-spacing: -0.012em; font-style: italic; color: #CF3A1B;\">It frequently doesn’t.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display: flex; flex-direction: column; gap: 18px;\">\n<p style=\"margin: 0; font-size: clamp(18px, 1.45cqi, 20px); line-height: 1.62; color: #4A4D5A;\">Reason Commons begins with a different idea.<\u002Fp>\n<p style=\"margin: 0; max-width: 15em; font-size: clamp(38px, 6.4cqi, 92px); line-height: 1.0; letter-spacing: -0.035em; text-wrap: balance;\">Before trying to make things <em style=\"font-style: italic; color: #1B2BA8;\">better<\u002Fem>, let’s make <em style=\"font-style: italic; color: #CF3A1B;\">better sense<\u002Fem> of things.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"renaissance\" aria-labelledby=\"ren-title\" style=\"background: #EDEBE4; padding: clamp(88px, 11cqi, 160px) clamp(20px, 5cqi, 72px);\">\n<div style=\"max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: clamp(56px, 7cqi, 96px);\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 32px clamp(32px, 6cqi, 112px); align-items: flex-end;\">\n<div style=\"flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 24px;\">\n<p style=\"margin: 0; display: flex; align-items: center; gap: 14px; font-family: 'Schibsted Grotesk', 'Helvetica Neue', Helvetica, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #B53018;\"><span style=\"font-family: 'Literata', Georgia, serif; font-style: italic; font-weight: 500; font-size: 22px; letter-spacing: 0; text-transform: none;\">III.<\u002Fspan><span style=\"width: 36px; height: 1px; background: currentColor; flex: none;\"><\u002Fspan><span>A Different Kind of Renaissance<\u002Fspan><\u002Fp>\n<h2 id=\"ren-title\" style=\"margin: 0; font-weight: 400; font-size: clamp(36px, 5.2cqi, 72px); line-height: 1.04; letter-spacing: -0.028em; text-wrap: balance;\">The Renaissance didn’t invent human intelligence.<\u002Fh2>\n<\u002Fdiv>\n<div style=\"flex: 1 1 420px; min-width: 0; max-width: 660px; display: flex; flex-direction: column; gap: 14px;\">\n<p style=\"margin: 0; font-size: clamp(20px, 1.9cqi, 25px); line-height: 1.45; letter-spacing: -0.005em; text-wrap: pretty;\">It changed what people believed they could do with it.<\u002Fp>\n<p style=\"margin: 0; font-size: clamp(26px, 3.2cqi, 44px); line-height: 1.14; letter-spacing: -0.018em; font-style: italic; color: #1B2BA8;\">What if we could do that again?<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display: flex; flex-direction: column; gap: 6px;\">\n<p style=\"margin: 0; font-size: clamp(26px, 3.4cqi, 46px); line-height: 1.1; letter-spacing: -0.02em; color: #4A4D5A;\">Not with <s style=\"text-decoration-color: #CF3A1B; text-decoration-thickness: 0.08em;\">painting or architecture<\u002Fs>.<\u002Fp>\n<p style=\"margin: 0; font-size: clamp(58px, 11cqi, 168px); line-height: 0.95; letter-spacing: -0.045em; font-style: italic; color: #1B2BA8;\">With reasoning.<\u002Fp>\n<\u002Fdiv>\n\n<ol style=\"list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(360px, 100%), 1fr)); gap: 0 clamp(32px, 4cqi, 56px);\">\n<li style=\"display: flex; gap: 16px; align-items: baseline; padding: 22px 0 24px; border-top: 1px solid rgba(21,23,31,0.2);\"><span aria-hidden=\"true\" style=\"flex: none; width: 2em; font-style: italic; font-size: 18px; color: #1B2BA8;\">i.<\u002Fspan><span style=\"font-size: clamp(19px, 1.7cqi, 23px); line-height: 1.4; text-wrap: pretty;\">Imagine if understanding cause and effect became as natural as reading.<\u002Fspan><\u002Fli>\n<li style=\"display: flex; gap: 16px; align-items: baseline; padding: 22px 0 24px; border-top: 1px solid rgba(21,23,31,0.2);\"><span aria-hidden=\"true\" style=\"flex: none; width: 2em; font-style: italic; font-size: 18px; color: #1B2BA8;\">ii.<\u002Fspan><span style=\"font-size: clamp(19px, 1.7cqi, 23px); line-height: 1.4; text-wrap: pretty;\">If questioning an assumption was regarded as a contribution rather than a challenge to authority.<\u002Fspan><\u002Fli>\n<li style=\"display: flex; gap: 16px; align-items: baseline; padding: 22px 0 24px; border-top: 1px solid rgba(21,23,31,0.2);\"><span aria-hidden=\"true\" style=\"flex: none; width: 2em; font-style: italic; font-size: 18px; color: #1B2BA8;\">iii.<\u002Fspan><span style=\"font-size: clamp(19px, 1.7cqi, 23px); line-height: 1.4; text-wrap: pretty;\">If disagreement became an opportunity to discover something neither person had previously considered.<\u002Fspan><\u002Fli>\n<li style=\"display: flex; gap: 16px; align-items: baseline; padding: 22px 0 24px; border-top: 1px solid rgba(21,23,31,0.2);\"><span aria-hidden=\"true\" style=\"flex: none; width: 2em; font-style: italic; font-size: 18px; color: #1B2BA8;\">iv.<\u002Fspan><span style=\"font-size: clamp(19px, 1.7cqi, 23px); line-height: 1.4; text-wrap: pretty;\">If children learned to resolve apparent contradictions before learning to defend positions.<\u002Fspan><\u002Fli>\n<li style=\"display: flex; gap: 16px; align-items: baseline; padding: 22px 0 24px; border-top: 1px solid rgba(21,23,31,0.2);\"><span aria-hidden=\"true\" style=\"flex: none; width: 2em; font-style: italic; font-size: 18px; color: #1B2BA8;\">v.<\u002Fspan><span style=\"font-size: clamp(19px, 1.7cqi, 23px); line-height: 1.4; text-wrap: pretty;\">If organisations spent less time managing symptoms and more time understanding what produces them.<\u002Fspan><\u002Fli>\n<li style=\"display: flex; gap: 16px; align-items: baseline; padding: 22px 0 24px; border-top: 1px solid rgba(21,23,31,0.2);\"><span aria-hidden=\"true\" style=\"flex: none; width: 2em; font-style: italic; font-size: 18px; color: #1B2BA8;\">vi.<\u002Fspan><span style=\"font-size: clamp(19px, 1.7cqi, 23px); line-height: 1.4; text-wrap: pretty;\">And if ordinary people discovered that many seemingly impossible problems are not impossible at all.<\u002Fspan><\u002Fli>\n<\u002Fol>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 32px clamp(32px, 6cqi, 112px); align-items: flex-end;\">\n<p style=\"flex: 1 1 340px; min-width: 0; margin: 0; font-size: clamp(26px, 3.2cqi, 44px); line-height: 1.14; letter-spacing: -0.018em; text-wrap: balance;\">They’re simply being viewed through assumptions nobody has thought to question.<\u002Fp>\n<div style=\"flex: 1 1 420px; min-width: 0; max-width: 660px; display: flex; flex-direction: column; gap: 8px;\">\n<p style=\"margin: 0; font-size: clamp(20px, 1.9cqi, 25px); line-height: 1.45;\">That would be quite a renaissance.<\u002Fp>\n<p style=\"margin: 0; font-size: clamp(20px, 1.9cqi, 25px); line-height: 1.45; text-wrap: pretty;\">And it wouldn’t require everyone to become a genius.<\u002Fp>\n<p style=\"margin: 0; font-size: clamp(26px, 3.2cqi, 44px); line-height: 1.14; letter-spacing: -0.018em; font-style: italic; color: #CF3A1B;\">Just a little more curious.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"commons\" aria-labelledby=\"commons-title\" style=\"padding: clamp(88px, 11cqi, 160px) clamp(20px, 5cqi, 72px);\">\n<div style=\"max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: clamp(56px, 7cqi, 96px);\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 32px clamp(32px, 6cqi, 112px); align-items: flex-end;\">\n<div style=\"flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 24px;\">\n<p style=\"margin: 0; display: flex; align-items: center; gap: 14px; font-family: 'Schibsted Grotesk', 'Helvetica Neue', Helvetica, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #B53018;\"><span style=\"font-family: 'Literata', Georgia, serif; font-style: italic; font-weight: 500; font-size: 22px; letter-spacing: 0; text-transform: none;\">IV.<\u002Fspan><span style=\"width: 36px; height: 1px; background: currentColor; flex: none;\"><\u002Fspan><span>Why a Commons?<\u002Fspan><\u002Fp>\n<h2 id=\"commons-title\" style=\"margin: 0; font-weight: 400; font-size: clamp(36px, 5.2cqi, 72px); line-height: 1.04; letter-spacing: -0.028em; text-wrap: balance;\">Some things become more valuable when we share them.<\u002Fh2>\n<\u002Fdiv>\n<div style=\"flex: 1 1 420px; min-width: 0; max-width: 660px; display: flex; flex-direction: column; gap: 6px;\">\n<p style=\"margin: 0; font-size: clamp(26px, 3.2cqi, 44px); line-height: 1.14; letter-spacing: -0.018em;\">A sandwich isn’t one of them.<\u002Fp>\n<p style=\"margin: 0; font-size: clamp(26px, 3.2cqi, 44px); line-height: 1.14; letter-spacing: -0.018em; font-style: italic; color: #CF3A1B;\">A good idea is.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); gap: 16px;\">\n<figure style=\"margin: 0; display: flex; flex-direction: column; gap: 20px; padding: clamp(22px, 2.6cqi, 36px); background: #FFFFFF; border: 1px solid rgba(21,23,31,0.14);\">\n<p style=\"margin: 0; font-family: 'Schibsted Grotesk', 'Helvetica Neue', Helvetica, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #4A4D5A;\">A sandwich<\u002Fp>\n<svg sc-camel-view-box=\"0 0 240 180\" role=\"img\" aria-label=\"A square sandwich cut diagonally into two halves, pulled apart.\" style=\"width: 100%; max-width: 300px; height: auto; display: block; margin: 0 auto;\">\n<path d=\"M24 24H144L24 144Z\" fill=\"#F7F6F2\" stroke=\"#15171F\" stroke-width=\"2.4\" stroke-linejoin=\"round\"><\u002Fpath>\n<path d=\"M128.5 32.5L32.5 128.5\" fill=\"none\" stroke=\"#CF3A1B\" stroke-width=\"5\" stroke-linecap=\"round\"><\u002Fpath>\n<path d=\"M33 116V33H116\" fill=\"none\" stroke=\"#15171F\" stroke-opacity=\"0.35\" stroke-width=\"1.2\" stroke-linecap=\"round\"><\u002Fpath>\n<path d=\"M166 40V160H46Z\" fill=\"#F7F6F2\" stroke=\"#15171F\" stroke-width=\"2.4\" stroke-linejoin=\"round\"><\u002Fpath>\n<path d=\"M157.5 55.5L61.5 151.5\" fill=\"none\" stroke=\"#CF3A1B\" stroke-width=\"5\" stroke-linecap=\"round\"><\u002Fpath>\n<path d=\"M157 68V151H74\" fill=\"none\" stroke=\"#15171F\" stroke-opacity=\"0.35\" stroke-width=\"1.2\" stroke-linecap=\"round\"><\u002Fpath>\n<\u002Fsvg>\n<figcaption style=\"font-size: clamp(19px, 1.7cqi, 23px); line-height: 1.35; text-wrap: pretty;\">If I give you half my sandwich, I have less sandwich.<\u002Ffigcaption>\n<\u002Ffigure>\n<figure style=\"margin: 0; display: flex; flex-direction: column; gap: 20px; padding: clamp(22px, 2.6cqi, 36px); background: #FFFFFF; border: 1px solid rgba(21,23,31,0.14);\">\n<p style=\"margin: 0; font-family: 'Schibsted Grotesk', 'Helvetica Neue', Helvetica, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #4A4D5A;\">A good idea<\u002Fp>\n<svg sc-camel-view-box=\"0 0 240 180\" role=\"img\" aria-label=\"Two overlapping circles, labelled me and you, with the overlap filled in red.\" style=\"width: 100%; max-width: 300px; height: auto; display: block; margin: 0 auto;\">\n<path d=\"M120 41.5A56 56 0 0 1 120 138.5A56 56 0 0 1 120 41.5Z\" fill=\"#CF3A1B\"><\u002Fpath>\n<circle cx=\"92\" cy=\"90\" r=\"56\" fill=\"none\" stroke=\"#15171F\" stroke-width=\"2\"><\u002Fcircle>\n<circle cx=\"148\" cy=\"90\" r=\"56\" fill=\"none\" stroke=\"#15171F\" stroke-width=\"2\"><\u002Fcircle>\n<text x=\"66\" y=\"96\" font-family=\"Literata, Georgia, serif\" font-style=\"italic\" font-size=\"18\" fill=\"#15171F\" text-anchor=\"middle\">me<\u002Ftext>\n<text x=\"174\" y=\"96\" font-family=\"Literata, Georgia, serif\" font-style=\"italic\" font-size=\"18\" fill=\"#15171F\" text-anchor=\"middle\">you<\u002Ftext>\n<\u002Fsvg>\n<figcaption style=\"font-size: clamp(19px, 1.7cqi, 23px); line-height: 1.35; text-wrap: pretty;\">If I help you understand something, we may both end up understanding <em style=\"font-style: italic; color: #CF3A1B;\">more<\u002Fem>.<\u002Ffigcaption>\n<\u002Ffigure>\n<\u002Fdiv>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 40px clamp(32px, 6cqi, 112px); align-items: flex-start;\">\n<div style=\"flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 6px;\">\n<p style=\"margin: 0; font-size: clamp(26px, 3.2cqi, 44px); line-height: 1.14; letter-spacing: -0.018em;\">Reasoning has this wonderful property.<\u002Fp>\n<p style=\"margin: 0; font-size: clamp(26px, 3.2cqi, 44px); line-height: 1.14; letter-spacing: -0.018em; font-style: italic; color: #1B2BA8;\">It can become richer through sharing.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1 1 420px; min-width: 0; max-width: 660px; display: flex; flex-direction: column; gap: 22px;\">\n<p style=\"margin: 0; font-size: clamp(20px, 1.9cqi, 25px); line-height: 1.45; letter-spacing: -0.005em; text-wrap: pretty;\">Yet much of the world’s useful thinking remains trapped inside disciplines, professions, organisations and methodologies.<\u002Fp>\n<ul style=\"list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column;\">\n<li style=\"display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 4px 16px; align-items: baseline; padding: 14px 0; border-top: 1px solid rgba(21,23,31,0.14); font-size: clamp(18px, 1.5cqi, 20px); line-height: 1.5;\"><strong style=\"font-family: 'Schibsted Grotesk', 'Helvetica Neue', Helvetica, sans-serif; font-size: 15px; font-weight: 600; letter-spacing: 0.02em;\">Economists <\u002Fstrong><span>have their language.<\u002Fspan><\u002Fli>\n<li style=\"display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 4px 16px; align-items: baseline; padding: 14px 0; border-top: 1px solid rgba(21,23,31,0.14); font-size: clamp(18px, 1.5cqi, 20px); line-height: 1.5;\"><strong style=\"font-family: 'Schibsted Grotesk', 'Helvetica Neue', Helvetica, sans-serif; font-size: 15px; font-weight: 600; letter-spacing: 0.02em;\">Psychologists <\u002Fstrong><span>have theirs.<\u002Fspan><\u002Fli>\n<li style=\"display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 4px 16px; align-items: baseline; padding: 14px 0; border-top: 1px solid rgba(21,23,31,0.14); font-size: clamp(18px, 1.5cqi, 20px); line-height: 1.5;\"><strong style=\"font-family: 'Schibsted Grotesk', 'Helvetica Neue', Helvetica, sans-serif; font-size: 15px; font-weight: 600; letter-spacing: 0.02em;\">Engineers <\u002Fstrong><span>have another.<\u002Fspan><\u002Fli>\n<li style=\"display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 4px 16px; align-items: baseline; padding: 14px 0; border-top: 1px solid rgba(21,23,31,0.14); border-bottom: 1px solid rgba(21,23,31,0.14); font-size: clamp(18px, 1.5cqi, 20px); line-height: 1.5;\"><strong style=\"font-family: 'Schibsted Grotesk', 'Helvetica Neue', Helvetica, sans-serif; font-size: 15px; font-weight: 600; letter-spacing: 0.02em;\">Management consultants <\u002Fstrong><span style=\"font-style: italic; color: #B53018;\">appear to have several thousand.<\u002Fspan><\u002Fli>\n<\u002Ful>\n<p style=\"margin: 0; font-size: clamp(18px, 1.45cqi, 20px); line-height: 1.62;\">Meanwhile, the rest of us are expected to get on with life.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display: flex; flex-direction: column; gap: clamp(40px, 5cqi, 64px); padding-top: clamp(40px, 5cqi, 64px); border-top: 1px solid rgba(21,23,31,0.16);\">\n<p style=\"margin: 0; max-width: 22em; font-size: clamp(26px, 3.2cqi, 44px); line-height: 1.18; letter-spacing: -0.018em; text-wrap: balance;\">Reason Commons exists to make useful reasoning more <span style=\"text-decoration: underline; text-decoration-color: #CF3A1B; text-decoration-thickness: 0.07em; text-underline-offset: 0.14em;\">accessible<\u002Fspan>, more <span style=\"text-decoration: underline; text-decoration-color: #CF3A1B; text-decoration-thickness: 0.07em; text-underline-offset: 0.14em;\">social<\u002Fspan> and more <span style=\"text-decoration: underline; text-decoration-color: #CF3A1B; text-decoration-thickness: 0.07em; text-underline-offset: 0.14em;\">contagious<\u002Fspan>.<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 40px clamp(32px, 6cqi, 112px); align-items: center;\">\n<div style=\"flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 8px;\">\n<p style=\"margin: 0; font-size: clamp(20px, 1.9cqi, 25px); line-height: 1.45; color: #4A4D5A;\">Not as another proprietary system.<\u002Fp>\n<p style=\"margin: 0; font-size: clamp(20px, 1.9cqi, 25px); line-height: 1.45;\">But as something we can cultivate together.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1 1 420px; min-width: 0; max-width: 660px; display: flex; flex-wrap: wrap; align-items: center; gap: 20px 28px;\">\n<svg sc-camel-view-box=\"0 0 40 28\" fill=\"none\" aria-hidden=\"true\" style=\"flex: none; width: clamp(88px, 10cqi, 132px); height: auto;\"><path d=\"M20 5.34A10 10 0 0 1 20 22.66A10 10 0 0 1 20 5.34Z\" fill=\"#CF3A1B\"><\u002Fpath><circle cx=\"15\" cy=\"14\" r=\"10\" stroke=\"#15171F\" stroke-width=\"0.8\"><\u002Fcircle><circle cx=\"25\" cy=\"14\" r=\"10\" stroke=\"#15171F\" stroke-width=\"0.8\"><\u002Fcircle><\u002Fsvg>\n<div style=\"flex: 1 1 240px; min-width: 0; display: flex; flex-direction: column; gap: 8px;\">\n<p style=\"margin: 0; font-size: clamp(44px, 6cqi, 84px); line-height: 1; letter-spacing: -0.035em; font-style: italic;\">A commons.<\u002Fp>\n<p style=\"margin: 0; font-size: clamp(18px, 1.45cqi, 20px); line-height: 1.55; text-wrap: pretty;\">A shared space for better questions, better explanations and better ways forward.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"method\" aria-labelledby=\"method-title\" style=\"background: #EDEBE4; padding: clamp(88px, 11cqi, 160px) clamp(20px, 5cqi, 72px);\">\n<div style=\"max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: clamp(56px, 7cqi, 96px);\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 32px clamp(32px, 6cqi, 112px); align-items: flex-start;\">\n<div style=\"flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 24px;\">\n<p style=\"margin: 0; display: flex; align-items: center; gap: 14px; font-family: 'Schibsted Grotesk', 'Helvetica Neue', Helvetica, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #B53018;\"><span style=\"font-family: 'Literata', Georgia, serif; font-style: italic; font-weight: 500; font-size: 22px; letter-spacing: 0; text-transform: none;\">V.<\u002Fspan><span style=\"width: 36px; height: 1px; background: currentColor; flex: none;\"><\u002Fspan><span>The Method Behind the Madness<\u002Fspan><\u002Fp>\n<h2 id=\"method-title\" style=\"margin: 0; font-weight: 400; font-size: clamp(36px, 5.2cqi, 72px); line-height: 1.04; letter-spacing: -0.028em; text-wrap: balance;\">It turns out that common sense benefits from a little discipline.<\u002Fh2>\n<\u002Fdiv>\n<div style=\"flex: 1 1 420px; min-width: 0; max-width: 660px; display: flex; flex-direction: column; gap: 28px; padding-top: clamp(0px, 4cqi, 56px);\">\n<div style=\"display: flex; flex-direction: column; gap: 12px;\">\n<p style=\"margin: 0; font-size: clamp(20px, 1.9cqi, 25px); line-height: 1.45; letter-spacing: -0.005em; text-wrap: pretty;\">Thinking clearly isn’t simply a matter of trusting your instincts.<\u002Fp>\n<p style=\"margin: 0; font-size: clamp(18px, 1.45cqi, 20px); line-height: 1.62;\">Our instincts are wonderful.<\u002Fp>\n<p style=\"margin: 0; font-size: clamp(18px, 1.45cqi, 20px); line-height: 1.62; font-style: italic;\">They’re also occasionally spectacularly wrong.<\u002Fp>\n<\u002Fdiv>\n<p style=\"margin: 0; font-size: clamp(18px, 1.45cqi, 20px); line-height: 1.62; text-wrap: pretty;\">Which is why Reason Commons draws inspiration from the <strong style=\"font-weight: 600;\">Theory of Constraints<\u002Fstrong> and its tradition of examining cause and effect, questioning assumptions and resolving conflicts.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display: flex; flex-direction: column; gap: 18px; padding: clamp(28px, 4cqi, 56px) 0; border-top: 3px solid #15171F; border-bottom: 1px solid #15171F;\">\n<p style=\"margin: 0; font-style: italic; font-size: clamp(18px, 1.5cqi, 21px); color: #4A4D5A;\">Its starting insight is deceptively simple.<\u002Fp>\n<div style=\"display: flex; gap: clamp(14px, 2cqi, 28px); align-items: flex-start;\">\n<svg sc-camel-view-box=\"0 0 64 32\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex: none; width: clamp(44px, 5.4cqi, 76px); height: auto; margin-top: 0.3em; color: #CF3A1B;\"><rect x=\"3\" y=\"9\" width=\"8\" height=\"17\" rx=\"1.5\"><\u002Frect><path d=\"M6.8 9.5v16\"><\u002Fpath><path d=\"M11 11.5C15 9.5 19 9 23 9h35a3 3 0 0 1 0 6H33\"><\u002Fpath><path d=\"M33 15h0.5a2.25 2.25 0 0 1 0 4.5H31\"><\u002Fpath><path d=\"M31 19.5h0.5a2.25 2.25 0 0 1 0 4.5H29\"><\u002Fpath><path d=\"M29 24a2 2 0 0 1 0 4h-7c-5 0-8-1.5-11-3.5\"><\u002Fpath><path d=\"M16 15.5c4-1.5 9-1.5 13-0.5\"><\u002Fpath><\u002Fsvg>\n<p style=\"margin: 0; max-width: 20em; font-size: clamp(28px, 4cqi, 56px); line-height: 1.1; letter-spacing: -0.025em; text-wrap: balance;\">In any system, a surprisingly small number of things often determine what the whole system can achieve.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<ol style=\"list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 12px;\">\n<li style=\"display: flex; flex-direction: column; gap: 28px; padding: 22px 22px 26px; background: #F7F6F2; border: 1px solid rgba(21,23,31,0.14);\"><span aria-hidden=\"true\" style=\"font-style: italic; font-size: clamp(40px, 4.4cqi, 60px); line-height: 1; letter-spacing: -0.03em; color: #1B2BA8;\">1<\u002Fspan><span style=\"font-size: clamp(22px, 2cqi, 27px); line-height: 1.2; letter-spacing: -0.01em;\">Find what matters most.<\u002Fspan><\u002Fli>\n<li style=\"display: flex; flex-direction: column; gap: 28px; padding: 22px 22px 26px; background: #F7F6F2; border: 1px solid rgba(21,23,31,0.14);\"><span aria-hidden=\"true\" style=\"font-style: italic; font-size: clamp(40px, 4.4cqi, 60px); line-height: 1; letter-spacing: -0.03em; color: #1B2BA8;\">2<\u002Fspan><span style=\"font-size: clamp(22px, 2cqi, 27px); line-height: 1.2; letter-spacing: -0.01em;\">Understand why it matters.<\u002Fspan><\u002Fli>\n<li style=\"display: flex; flex-direction: column; gap: 28px; padding: 22px 22px 26px; background: #F7F6F2; border: 1px solid rgba(21,23,31,0.14);\"><span aria-hidden=\"true\" style=\"font-style: italic; font-size: clamp(40px, 4.4cqi, 60px); line-height: 1; letter-spacing: -0.03em; color: #1B2BA8;\">3<\u002Fspan><span style=\"font-size: clamp(22px, 2cqi, 27px); line-height: 1.2; letter-spacing: -0.01em;\">Change what needs changing.<\u002Fspan><\u002Fli>\n<li style=\"display: flex; flex-direction: column; gap: 28px; padding: 22px 22px 26px; background: #F7F6F2; border: 1px solid rgba(21,23,31,0.14);\"><span aria-hidden=\"true\" style=\"font-style: italic; font-size: clamp(40px, 4.4cqi, 60px); line-height: 1; letter-spacing: -0.03em; color: #1B2BA8;\">4<\u002Fspan><span style=\"font-size: clamp(22px, 2cqi, 27px); line-height: 1.2; letter-spacing: -0.01em;\">Then see what happens.<\u002Fspan><\u002Fli>\n<\u002Fol>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 32px clamp(32px, 6cqi, 112px); align-items: center;\">\n<p style=\"flex: 1 1 340px; min-width: 0; margin: 0; font-size: clamp(26px, 3.2cqi, 44px); line-height: 1.14; letter-spacing: -0.018em; text-wrap: balance;\">Of course, real life is rarely quite that tidy.<\u002Fp>\n<ul style=\"flex: 1 1 420px; min-width: 0; max-width: 660px; list-style: none; margin: 0; padding: 12px 4px; display: flex; flex-wrap: wrap; gap: 22px 12px; align-items: center;\">\n<li style=\"padding: 12px 18px; background: #FFFFFF; border: 1px solid #15171F; font-family: 'Schibsted Grotesk', 'Helvetica Neue', Helvetica, sans-serif; font-size: clamp(15px, 1.3cqi, 18px); font-weight: 500; transform: rotate(-3deg);\">People disagree.<\u002Fli>\n<li style=\"padding: 12px 18px; background: #CF3A1B; border: 1px solid #CF3A1B; color: #FFFFFF; font-family: 'Schibsted Grotesk', 'Helvetica Neue', Helvetica, sans-serif; font-size: clamp(15px, 1.3cqi, 18px); font-weight: 500; transform: rotate(2.5deg);\">Objectives conflict.<\u002Fli>\n<li style=\"padding: 12px 18px; background: #15171F; border: 1px solid #15171F; color: #F7F6F2; font-family: 'Schibsted Grotesk', 'Helvetica Neue', Helvetica, sans-serif; font-size: clamp(15px, 1.3cqi, 18px); font-weight: 500; transform: rotate(-1.5deg);\">Unintended consequences appear.<\u002Fli>\n<li style=\"padding: 12px 18px; background: #FFFFFF; border: 1px solid #15171F; font-family: 'Schibsted Grotesk', 'Helvetica Neue', Helvetica, sans-serif; font-size: clamp(15px, 1.3cqi, 18px); font-weight: 500; transform: rotate(3.5deg);\">Yesterday’s solution becomes tomorrow’s problem.<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 32px clamp(32px, 6cqi, 112px); align-items: flex-start;\">\n<p style=\"flex: 1 1 340px; min-width: 0; margin: 0; font-size: clamp(26px, 3.2cqi, 44px); line-height: 1.14; letter-spacing: -0.018em; font-style: italic; color: #1B2BA8;\">That’s why we need more than slogans.<\u002Fp>\n<ul style=\"flex: 1 1 420px; min-width: 0; max-width: 660px; list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column;\">\n<li style=\"display: flex; gap: 14px; align-items: flex-start; padding: 14px 0; border-top: 1px solid rgba(21,23,31,0.16);\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1B2BA8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex: none; margin-top: 5px;\"><path d=\"M4 12h15\"><\u002Fpath><path d=\"M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg><span style=\"font-size: clamp(18px, 1.5cqi, 21px); line-height: 1.5;\">We need ways to test our explanations against reality.<\u002Fspan><\u002Fli>\n<li style=\"display: flex; gap: 14px; align-items: flex-start; padding: 14px 0; border-top: 1px solid rgba(21,23,31,0.16);\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1B2BA8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex: none; margin-top: 5px;\"><path d=\"M4 12h15\"><\u002Fpath><path d=\"M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg><span style=\"font-size: clamp(18px, 1.5cqi, 21px); line-height: 1.5;\">Ways to distinguish symptoms from causes.<\u002Fspan><\u002Fli>\n<li style=\"display: flex; gap: 14px; align-items: flex-start; padding: 14px 0; border-top: 1px solid rgba(21,23,31,0.16);\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1B2BA8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex: none; margin-top: 5px;\"><path d=\"M4 12h15\"><\u002Fpath><path d=\"M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg><span style=\"font-size: clamp(18px, 1.5cqi, 21px); line-height: 1.5;\">Ways to uncover the assumptions keeping a conflict alive.<\u002Fspan><\u002Fli>\n<li style=\"display: flex; gap: 14px; align-items: flex-start; padding: 14px 0; border-top: 1px solid rgba(21,23,31,0.16); border-bottom: 1px solid rgba(21,23,31,0.16);\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1B2BA8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex: none; margin-top: 5px;\"><path d=\"M4 12h15\"><\u002Fpath><path d=\"M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg><span style=\"font-size: clamp(18px, 1.5cqi, 21px); line-height: 1.5; text-wrap: pretty;\">And ways to make progress without requiring everyone to agree about everything first.<\u002Fspan><\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 32px clamp(32px, 6cqi, 112px); align-items: flex-end; padding-top: clamp(40px, 5cqi, 64px); border-top: 1px solid rgba(21,23,31,0.16);\">\n<div style=\"flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 12px;\">\n<p style=\"margin: 0; font-size: clamp(18px, 1.45cqi, 20px); line-height: 1.62; text-wrap: pretty;\">We don’t believe everyone needs to learn the vocabulary of the Theory of Constraints.<\u002Fp>\n<p style=\"margin: 0; font-size: clamp(18px, 1.45cqi, 20px); line-height: 1.62; text-wrap: pretty;\">We believe more people could benefit from experiencing what its thinking tools make possible.<\u002Fp>\n<\u002Fdiv>\n<p style=\"flex: 1 1 420px; min-width: 0; max-width: 660px; margin: 0; font-size: clamp(26px, 3.2cqi, 44px); line-height: 1.14; letter-spacing: -0.018em; text-wrap: balance;\">The tools matter. <em style=\"font-style: italic; color: #1B2BA8;\">But what people can accomplish with them matters more.<\u002Fem><\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"questions\" aria-labelledby=\"q-title\" style=\"background: #1B2BA8; color: #FFFFFF; padding: clamp(88px, 11cqi, 160px) clamp(20px, 5cqi, 72px);\">\n<div style=\"max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: clamp(48px, 6cqi, 80px);\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 32px clamp(32px, 6cqi, 112px); align-items: flex-end;\">\n<div style=\"flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 24px;\">\n<p style=\"margin: 0; display: flex; align-items: center; gap: 14px; font-family: 'Schibsted Grotesk', 'Helvetica Neue', Helvetica, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #B9C3FF;\"><span style=\"font-family: 'Literata', Georgia, serif; font-style: italic; font-weight: 500; font-size: 22px; letter-spacing: 0; text-transform: none;\">VI.<\u002Fspan><span style=\"width: 36px; height: 1px; background: currentColor; flex: none;\"><\u002Fspan><\u002Fp>\n<h2 id=\"q-title\" style=\"margin: 0; font-weight: 400; font-size: clamp(36px, 5.2cqi, 72px); line-height: 1.04; letter-spacing: -0.028em; text-wrap: balance;\">Five questions that could change quite a lot<\u002Fh2>\n<\u002Fdiv>\n<p style=\"flex: 1 1 420px; min-width: 0; max-width: 660px; margin: 0; font-size: clamp(20px, 1.9cqi, 25px); line-height: 1.45; color: #DCE1FF; text-wrap: pretty;\">Better thinking often begins with surprisingly ordinary questions.<\u002Fp>\n<\u002Fdiv>\n\n<ol style=\"list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column;\">\n<li style=\"display: flex; gap: clamp(16px, 3cqi, 48px); align-items: baseline; padding: clamp(24px, 3cqi, 40px) 0; border-top: 1px solid rgba(255,255,255,0.28);\"><span aria-hidden=\"true\" style=\"flex: none; width: clamp(30px, 6cqi, 96px); font-style: italic; font-size: clamp(36px, 4.6cqi, 64px); line-height: 1; letter-spacing: -0.03em; color: #B9C3FF;\">1<\u002Fspan><div style=\"flex: 1 1 auto; min-width: 0; display: flex; flex-wrap: wrap; gap: 12px clamp(20px, 3cqi, 48px); align-items: baseline;\"><h3 style=\"flex: 1 1 260px; min-width: 0; margin: 0; font-weight: 400; font-size: clamp(28px, 3.4cqi, 46px); line-height: 1.1; letter-spacing: -0.02em; text-wrap: balance;\">What are we actually trying to achieve?<\u002Fh3><p style=\"flex: 1 1 300px; min-width: 0; max-width: 460px; margin: 0; font-size: clamp(18px, 1.45cqi, 20px); line-height: 1.55; color: #DCE1FF; text-wrap: pretty;\">An embarrassingly useful question, especially in organisations that have become extremely busy.<\u002Fp><\u002Fdiv><\u002Fli>\n<li style=\"display: flex; gap: clamp(16px, 3cqi, 48px); align-items: baseline; padding: clamp(24px, 3cqi, 40px) 0; border-top: 1px solid rgba(255,255,255,0.28);\"><span aria-hidden=\"true\" style=\"flex: none; width: clamp(30px, 6cqi, 96px); font-style: italic; font-size: clamp(36px, 4.6cqi, 64px); line-height: 1; letter-spacing: -0.03em; color: #B9C3FF;\">2<\u002Fspan><div style=\"flex: 1 1 auto; min-width: 0; display: flex; flex-wrap: wrap; gap: 12px clamp(20px, 3cqi, 48px); align-items: baseline;\"><h3 style=\"flex: 1 1 260px; min-width: 0; margin: 0; font-weight: 400; font-size: clamp(28px, 3.4cqi, 46px); line-height: 1.1; letter-spacing: -0.02em; text-wrap: balance;\">What’s stopping us?<\u002Fh3><p style=\"flex: 1 1 300px; min-width: 0; max-width: 460px; margin: 0; font-size: clamp(18px, 1.45cqi, 20px); line-height: 1.55; color: #DCE1FF; text-wrap: pretty;\">Not everything that’s wrong. The things that genuinely limit progress.<\u002Fp><\u002Fdiv><\u002Fli>\n<li style=\"display: flex; gap: clamp(16px, 3cqi, 48px); align-items: baseline; padding: clamp(24px, 3cqi, 40px) 0; border-top: 1px solid rgba(255,255,255,0.28);\"><span aria-hidden=\"true\" style=\"flex: none; width: clamp(30px, 6cqi, 96px); font-style: italic; font-size: clamp(36px, 4.6cqi, 64px); line-height: 1; letter-spacing: -0.03em; color: #B9C3FF;\">3<\u002Fspan><div style=\"flex: 1 1 auto; min-width: 0; display: flex; flex-wrap: wrap; gap: 12px clamp(20px, 3cqi, 48px); align-items: baseline;\"><h3 style=\"flex: 1 1 260px; min-width: 0; margin: 0; font-weight: 400; font-size: clamp(28px, 3.4cqi, 46px); line-height: 1.1; letter-spacing: -0.02em; text-wrap: balance;\">Why does that happen?<\u002Fh3><p style=\"flex: 1 1 300px; min-width: 0; max-width: 460px; margin: 0; font-size: clamp(18px, 1.45cqi, 20px); line-height: 1.55; color: #DCE1FF; text-wrap: pretty;\">And why does that happen? Keep going until the explanation becomes useful.<\u002Fp><\u002Fdiv><\u002Fli>\n<li style=\"display: flex; gap: clamp(16px, 3cqi, 48px); align-items: baseline; padding: clamp(24px, 3cqi, 40px) 0; border-top: 1px solid rgba(255,255,255,0.28);\"><span aria-hidden=\"true\" style=\"flex: none; width: clamp(30px, 6cqi, 96px); font-style: italic; font-size: clamp(36px, 4.6cqi, 64px); line-height: 1; letter-spacing: -0.03em; color: #B9C3FF;\">4<\u002Fspan><div style=\"flex: 1 1 auto; min-width: 0; display: flex; flex-wrap: wrap; gap: 12px clamp(20px, 3cqi, 48px); align-items: baseline;\"><h3 style=\"flex: 1 1 260px; min-width: 0; margin: 0; font-weight: 400; font-size: clamp(28px, 3.4cqi, 46px); line-height: 1.1; letter-spacing: -0.02em; text-wrap: balance;\">What are we assuming?<\u002Fh3><p style=\"flex: 1 1 300px; min-width: 0; max-width: 460px; margin: 0; font-size: clamp(18px, 1.45cqi, 20px); line-height: 1.55; color: #DCE1FF; text-wrap: pretty;\">Some of our most formidable obstacles turn out to be beliefs masquerading as facts.<\u002Fp><\u002Fdiv><\u002Fli>\n<li style=\"display: flex; gap: clamp(16px, 3cqi, 48px); align-items: baseline; padding: clamp(24px, 3cqi, 40px) 0; border-top: 1px solid rgba(255,255,255,0.28); border-bottom: 1px solid rgba(255,255,255,0.28);\"><span aria-hidden=\"true\" style=\"flex: none; width: clamp(30px, 6cqi, 96px); font-style: italic; font-size: clamp(36px, 4.6cqi, 64px); line-height: 1; letter-spacing: -0.03em; color: #B9C3FF;\">5<\u002Fspan><div style=\"flex: 1 1 auto; min-width: 0; display: flex; flex-wrap: wrap; gap: 12px clamp(20px, 3cqi, 48px); align-items: baseline;\"><h3 style=\"flex: 1 1 260px; min-width: 0; margin: 0; font-weight: 400; font-size: clamp(28px, 3.4cqi, 46px); line-height: 1.1; letter-spacing: -0.02em; text-wrap: balance;\">What would change our minds?<\u002Fh3><p style=\"flex: 1 1 300px; min-width: 0; max-width: 460px; margin: 0; font-size: clamp(18px, 1.45cqi, 20px); line-height: 1.55; color: #DCE1FF; text-wrap: pretty;\">Because being certain feels wonderful, but discovering you were mistaken can be considerably more valuable.<\u002Fp><\u002Fdiv><\u002Fli>\n<\u002Fol>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 32px clamp(32px, 6cqi, 112px); align-items: flex-end;\">\n<div style=\"flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 10px;\">\n<p style=\"margin: 0; font-size: clamp(18px, 1.45cqi, 20px); line-height: 1.62; color: #DCE1FF;\">None of these questions requires a PhD.<\u002Fp>\n<p style=\"margin: 0; font-size: clamp(18px, 1.45cqi, 20px); line-height: 1.62; color: #DCE1FF; text-wrap: pretty;\">They do, however, require something that can be remarkably difficult to find.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1 1 420px; min-width: 0; max-width: 660px; display: flex; flex-direction: column; align-items: flex-start; gap: 28px;\">\n<p style=\"margin: 0; font-size: clamp(30px, 4cqi, 56px); line-height: 1.06; letter-spacing: -0.025em; font-style: italic; text-wrap: balance;\">The willingness to think together.<\u002Fp>\n<a href=\"#questions\" style=\"display: inline-flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 24px 0 28px; border-radius: 999px; background: #FFFFFF; color: #1B2BA8; font-family: 'Schibsted Grotesk', 'Helvetica Neue', Helvetica, sans-serif; font-size: 17px; font-weight: 600; text-decoration: none;\">Explore the Questions<svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex: none;\"><path d=\"M4 12h15\"><\u002Fpath><path d=\"M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"movement\" aria-labelledby=\"mv-title\" style=\"padding: clamp(88px, 11cqi, 160px) clamp(20px, 5cqi, 72px);\">\n<div style=\"max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: clamp(56px, 7cqi, 96px);\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 32px clamp(32px, 6cqi, 112px); align-items: flex-end;\">\n<div style=\"flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 24px;\">\n<p style=\"margin: 0; display: flex; align-items: center; gap: 14px; font-family: 'Schibsted Grotesk', 'Helvetica Neue', Helvetica, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #B53018;\"><span style=\"font-family: 'Literata', Georgia, serif; font-style: italic; font-weight: 500; font-size: 22px; letter-spacing: 0; text-transform: none;\">VII.<\u002Fspan><span style=\"width: 36px; height: 1px; background: currentColor; flex: none;\"><\u002Fspan><\u002Fp>\n<h2 id=\"mv-title\" style=\"margin: 0; font-weight: 400; font-size: clamp(36px, 5.2cqi, 72px); line-height: 1.04; letter-spacing: -0.028em; text-wrap: balance;\">A movement for people who suspect there must be a better way<\u002Fh2>\n<\u002Fdiv>\n<div style=\"flex: 1 1 420px; min-width: 0; max-width: 660px; display: flex; flex-direction: column; gap: 8px;\">\n<p style=\"margin: 0; font-size: clamp(22px, 2.2cqi, 30px); line-height: 1.25; letter-spacing: -0.012em;\">You don’t have to be an expert.<\u002Fp>\n<p style=\"margin: 0; font-size: clamp(22px, 2.2cqi, 30px); line-height: 1.25; letter-spacing: -0.012em; font-style: italic; color: #CF3A1B;\">In fact, it may help if you aren’t.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display: flex; flex-direction: column; gap: 16px;\">\n<p style=\"margin: 0; max-width: 34em; font-size: clamp(18px, 1.45cqi, 20px); line-height: 1.62; color: #4A4D5A; text-wrap: pretty;\">Reason Commons is for people who have ever looked at an established way of doing things and thought:<\u002Fp>\n<p style=\"margin: 0; max-width: 14em; font-style: italic; font-size: clamp(42px, 7cqi, 104px); line-height: 1.0; letter-spacing: -0.035em; color: #CF3A1B; text-wrap: balance;\">Surely this can’t be the best we can do?<\u002Fp>\n<\u002Fdiv>\n\n<ul style=\"list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(340px, 100%), 1fr)); gap: 0 clamp(32px, 4cqi, 56px);\">\n<li style=\"display: flex; flex-direction: column; gap: 8px; padding: 20px 0 24px; border-top: 1px solid rgba(21,23,31,0.18);\"><span style=\"font-family: 'Schibsted Grotesk', 'Helvetica Neue', Helvetica, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #1B2BA8;\">Educators<\u002Fspan><span style=\"font-size: clamp(19px, 1.6cqi, 22px); line-height: 1.4; text-wrap: pretty;\">It’s for educators who want children to think rather than merely repeat.<\u002Fspan><\u002Fli>\n<li style=\"display: flex; flex-direction: column; gap: 8px; padding: 20px 0 24px; border-top: 1px solid rgba(21,23,31,0.18);\"><span style=\"font-family: 'Schibsted Grotesk', 'Helvetica Neue', Helvetica, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #1B2BA8;\">Leaders<\u002Fspan><span style=\"font-size: clamp(19px, 1.6cqi, 22px); line-height: 1.4; text-wrap: pretty;\">For leaders who suspect their organisations contain more untapped intelligence than their consultants.<\u002Fspan><\u002Fli>\n<li style=\"display: flex; flex-direction: column; gap: 8px; padding: 20px 0 24px; border-top: 1px solid rgba(21,23,31,0.18);\"><span style=\"font-family: 'Schibsted Grotesk', 'Helvetica Neue', Helvetica, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #1B2BA8;\">Entrepreneurs<\u002Fspan><span style=\"font-size: clamp(19px, 1.6cqi, 22px); line-height: 1.4; text-wrap: pretty;\">For entrepreneurs who know the obvious solution is not always the right one.<\u002Fspan><\u002Fli>\n<li style=\"display: flex; flex-direction: column; gap: 8px; padding: 20px 0 24px; border-top: 1px solid rgba(21,23,31,0.18);\"><span style=\"font-family: 'Schibsted Grotesk', 'Helvetica Neue', Helvetica, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #1B2BA8;\">Communities<\u002Fspan><span style=\"font-size: clamp(19px, 1.6cqi, 22px); line-height: 1.4; text-wrap: pretty;\">For communities tired of arguments that generate heat but no light.<\u002Fspan><\u002Fli>\n<li style=\"display: flex; flex-direction: column; gap: 8px; padding: 20px 0 24px; border-top: 1px solid rgba(21,23,31,0.18);\"><span style=\"font-family: 'Schibsted Grotesk', 'Helvetica Neue', Helvetica, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #1B2BA8;\">Practitioners<\u002Fspan><span style=\"font-size: clamp(19px, 1.6cqi, 22px); line-height: 1.4; text-wrap: pretty;\">For practitioners who have discovered powerful thinking tools and wonder why more people haven’t encountered them.<\u002Fspan><\u002Fli>\n<li style=\"display: flex; flex-direction: column; gap: 8px; padding: 20px 0 24px; border-top: 1px solid rgba(21,23,31,0.18);\"><span style=\"font-family: 'Schibsted Grotesk', 'Helvetica Neue', Helvetica, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #1B2BA8;\">Anyone<\u002Fspan><span style=\"font-size: clamp(19px, 1.6cqi, 22px); line-height: 1.4; text-wrap: pretty;\">And for anyone who believes that disagreement needn’t end in division.<\u002Fspan><\u002Fli>\n<\u002Ful>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 40px clamp(32px, 6cqi, 112px); align-items: center;\">\n<div style=\"flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; padding: clamp(22px, 3cqi, 40px); background: #FFFFFF; border: 1px solid rgba(21,23,31,0.16);\">\n<ul style=\"list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column;\">\n<li style=\"display: flex; gap: 14px; align-items: flex-start; padding: 0 0 14px; font-size: clamp(19px, 1.7cqi, 23px); line-height: 1.4;\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#B53018\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex: none; margin-top: 5px;\"><path d=\"M6 6l12 12\"><\u002Fpath><path d=\"M18 6L6 18\"><\u002Fpath><\u002Fsvg><span>You don’t need permission.<\u002Fspan><\u002Fli>\n<li style=\"display: flex; gap: 14px; align-items: flex-start; padding: 14px 0; border-top: 1px solid rgba(21,23,31,0.12); font-size: clamp(19px, 1.7cqi, 23px); line-height: 1.4;\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#B53018\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex: none; margin-top: 5px;\"><path d=\"M6 6l12 12\"><\u002Fpath><path d=\"M18 6L6 18\"><\u002Fpath><\u002Fsvg><span>You don’t need a qualification.<\u002Fspan><\u002Fli>\n<li style=\"display: flex; gap: 14px; align-items: flex-start; padding: 14px 0 0; border-top: 1px solid rgba(21,23,31,0.12); font-size: clamp(19px, 1.7cqi, 23px); line-height: 1.4;\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#B53018\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex: none; margin-top: 5px;\"><path d=\"M6 6l12 12\"><\u002Fpath><path d=\"M18 6L6 18\"><\u002Fpath><\u002Fsvg><span>You don’t even need to agree with us.<\u002Fspan><\u002Fli>\n<\u002Ful>\n<p style=\"margin: 18px 0 0 34px; font-style: italic; font-size: clamp(17px, 1.4cqi, 19px); line-height: 1.5; color: #4A4D5A;\">Actually, disagreement could be rather useful.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1 1 420px; min-width: 0; max-width: 660px; display: flex; flex-direction: column; align-items: flex-start; gap: 28px;\">\n<div style=\"display: flex; gap: 16px; align-items: flex-start;\">\n<svg width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1B2BA8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex: none; margin-top: 0.25em;\"><path d=\"M4 12.5l5 5L20 6.5\"><\u002Fpath><\u002Fsvg>\n<p style=\"margin: 0; font-size: clamp(26px, 3.2cqi, 44px); line-height: 1.14; letter-spacing: -0.018em; text-wrap: balance;\">You just need to be willing to question what seems obvious.<\u002Fp>\n<\u002Fdiv>\n<a href=\"#join\" style=\"display: inline-flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 24px 0 28px; border-radius: 999px; background: #CF3A1B; color: #FFFFFF; font-family: 'Schibsted Grotesk', 'Helvetica Neue', Helvetica, sans-serif; font-size: 17px; font-weight: 600; letter-spacing: 0.005em; text-decoration: none;\">Join the Commons<svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex: none;\"><path d=\"M4 12h15\"><\u002Fpath><path d=\"M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"here\" aria-labelledby=\"here-title\" style=\"background: #EDEBE4; padding: clamp(88px, 11cqi, 160px) clamp(20px, 5cqi, 72px);\">\n<div style=\"max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: clamp(48px, 6cqi, 80px);\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 32px clamp(32px, 6cqi, 112px); align-items: flex-end;\">\n<div style=\"flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 24px;\">\n<p style=\"margin: 0; display: flex; align-items: center; gap: 14px; font-family: 'Schibsted Grotesk', 'Helvetica Neue', Helvetica, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #B53018;\"><span style=\"font-family: 'Literata', Georgia, serif; font-style: italic; font-weight: 500; font-size: 22px; letter-spacing: 0; text-transform: none;\">VIII.<\u002Fspan><span style=\"width: 36px; height: 1px; background: currentColor; flex: none;\"><\u002Fspan><\u002Fp>\n<h2 id=\"here-title\" style=\"margin: 0; font-weight: 400; font-size: clamp(36px, 5.2cqi, 72px); line-height: 1.04; letter-spacing: -0.028em; text-wrap: balance;\">What happens here?<\u002Fh2>\n<\u002Fdiv>\n<p style=\"flex: 1 1 420px; min-width: 0; max-width: 660px; margin: 0; font-size: clamp(26px, 3.2cqi, 44px); line-height: 1.14; letter-spacing: -0.018em; text-wrap: balance;\">Less intellectual theatre. <em style=\"font-style: italic; color: #CF3A1B;\">More useful thinking.<\u002Fem><\u002Fp>\n<\u002Fdiv>\n\n<ul style=\"list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(210px, 100%), 1fr)); gap: 12px;\">\n<li style=\"display: flex; flex-direction: column; gap: 14px; padding: 24px 22px 26px; background: #F7F6F2; border: 1px solid rgba(21,23,31,0.14);\"><svg width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1B2BA8\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M15.5 8.5l-2 5-5 2 2-5z\"><\u002Fpath><\u002Fsvg><h3 style=\"margin: 0; font-weight: 500; font-size: clamp(24px, 2.2cqi, 30px); line-height: 1.1; letter-spacing: -0.015em;\">Explore<\u002Fh3><p style=\"margin: 0; font-size: 18px; line-height: 1.5; color: #4A4D5A; text-wrap: pretty;\">Discover deceptively simple ideas that change how you see problems.<\u002Fp><\u002Fli>\n<li style=\"display: flex; flex-direction: column; gap: 14px; padding: 24px 22px 26px; background: #F7F6F2; border: 1px solid rgba(21,23,31,0.14);\"><svg width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1B2BA8\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 20l4-1L19 8l-3-3L5 16z\"><\u002Fpath><path d=\"M14 7l3 3\"><\u002Fpath><\u002Fsvg><h3 style=\"margin: 0; font-weight: 500; font-size: clamp(24px, 2.2cqi, 30px); line-height: 1.1; letter-spacing: -0.015em;\">Practise<\u002Fh3><p style=\"margin: 0; font-size: 18px; line-height: 1.5; color: #4A4D5A; text-wrap: pretty;\">Learn to use questions, reasoning tools and experiments on situations that actually matter to you.<\u002Fp><\u002Fli>\n<li style=\"display: flex; flex-direction: column; gap: 14px; padding: 24px 22px 26px; background: #F7F6F2; border: 1px solid rgba(21,23,31,0.14);\"><svg width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1B2BA8\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"8\" cy=\"9\" r=\"3.2\"><\u002Fcircle><circle cx=\"16\" cy=\"9\" r=\"3.2\"><\u002Fcircle><path d=\"M2.5 19.5c0.8-3 2.9-4.6 5.5-4.6s4.7 1.6 5.5 4.6\"><\u002Fpath><path d=\"M10.5 19.5c0.8-3 2.9-4.6 5.5-4.6s4.7 1.6 5.5 4.6\"><\u002Fpath><\u002Fsvg><h3 style=\"margin: 0; font-weight: 500; font-size: clamp(24px, 2.2cqi, 30px); line-height: 1.1; letter-spacing: -0.015em;\">Gather<\u002Fh3><p style=\"margin: 0; font-size: 18px; line-height: 1.5; color: #4A4D5A; text-wrap: pretty;\">Bring people together around shared challenges, even when they start with different opinions.<\u002Fp><\u002Fli>\n<li style=\"display: flex; flex-direction: column; gap: 14px; padding: 24px 22px 26px; background: #F7F6F2; border: 1px solid rgba(21,23,31,0.14);\"><svg width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1B2BA8\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 8v8\"><\u002Fpath><path d=\"M8 12h8\"><\u002Fpath><\u002Fsvg><h3 style=\"margin: 0; font-weight: 500; font-size: clamp(24px, 2.2cqi, 30px); line-height: 1.1; letter-spacing: -0.015em;\">Contribute<\u002Fh3><p style=\"margin: 0; font-size: 18px; line-height: 1.5; color: #4A4D5A; text-wrap: pretty;\">Share questions, discoveries, stories, tools and explanations that others can learn from.<\u002Fp><\u002Fli>\n<li style=\"display: flex; flex-direction: column; gap: 14px; padding: 24px 22px 26px; background: #F7F6F2; border: 1px solid rgba(21,23,31,0.14);\"><svg width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1B2BA8\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"2\"><\u002Fcircle><path d=\"M12 3v3\"><\u002Fpath><path d=\"M12 18v3\"><\u002Fpath><path d=\"M3 12h3\"><\u002Fpath><path d=\"M18 12h3\"><\u002Fpath><path d=\"M5.6 5.6l2.1 2.1\"><\u002Fpath><path d=\"M16.3 16.3l2.1 2.1\"><\u002Fpath><path d=\"M5.6 18.4l2.1-2.1\"><\u002Fpath><path d=\"M16.3 7.7l2.1-2.1\"><\u002Fpath><\u002Fsvg><h3 style=\"margin: 0; font-weight: 500; font-size: clamp(24px, 2.2cqi, 30px); line-height: 1.1; letter-spacing: -0.015em;\">Spread<\u002Fh3><p style=\"margin: 0; font-size: 18px; line-height: 1.5; color: #4A4D5A; text-wrap: pretty;\">Help make better reasoning an everyday human capability, rather than a specialist occupation.<\u002Fp><\u002Fli>\n<\u002Ful>\n\n<div style=\"display: flex; flex-direction: column; gap: 8px; max-width: 900px;\">\n<p style=\"margin: 0; font-size: clamp(20px, 1.9cqi, 25px); line-height: 1.45; text-wrap: pretty;\">The ambition isn’t to build an audience that admires good thinking.<\u002Fp>\n<p style=\"margin: 0; font-size: clamp(26px, 3.2cqi, 44px); line-height: 1.14; letter-spacing: -0.018em; font-style: italic; color: #CF3A1B; text-wrap: balance;\">It’s to build a commons in which people practise it.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"manifesto\" aria-labelledby=\"mf-title\" style=\"background: #15171F; color: #F7F6F2; padding: clamp(88px, 11cqi, 160px) clamp(20px, 5cqi, 72px);\">\n<div style=\"max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: clamp(56px, 7cqi, 96px);\">\n<div style=\"display: flex; flex-direction: column; gap: 24px; max-width: 1040px;\">\n<p style=\"margin: 0; display: flex; align-items: center; gap: 14px; font-family: 'Schibsted Grotesk', 'Helvetica Neue', Helvetica, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #FF6B45;\"><span style=\"font-family: 'Literata', Georgia, serif; font-style: italic; font-weight: 500; font-size: 22px; letter-spacing: 0; text-transform: none;\">IX.<\u002Fspan><span style=\"width: 36px; height: 1px; background: currentColor; flex: none;\"><\u002Fspan><span>Our Manifesto<\u002Fspan><\u002Fp>\n<h2 id=\"mf-title\" style=\"margin: 0; font-weight: 400; font-size: clamp(40px, 6.4cqi, 92px); line-height: 1.0; letter-spacing: -0.035em; text-wrap: balance;\">We have enough people trying to sound clever.<\u002Fh2>\n<p style=\"margin: 0; font-size: clamp(28px, 3.8cqi, 54px); line-height: 1.08; letter-spacing: -0.025em; font-style: italic; color: #FF6B45; text-wrap: balance;\">We could do with more people trying to understand.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 32px clamp(32px, 6cqi, 112px); align-items: flex-start;\">\n<p style=\"flex: 1 1 340px; min-width: 0; margin: 0; font-size: clamp(26px, 3.2cqi, 44px); line-height: 1.14; letter-spacing: -0.018em; text-wrap: balance;\">We believe a question can be more valuable than an answer.<\u002Fp>\n<ul style=\"flex: 1 1 420px; min-width: 0; max-width: 660px; list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column;\">\n<li style=\"display: flex; gap: 16px; align-items: flex-start; padding: 16px 0; border-top: 1px solid rgba(247,246,242,0.18); font-size: clamp(19px, 1.7cqi, 23px); line-height: 1.4;\"><span aria-hidden=\"true\" style=\"flex: none; width: 8px; height: 8px; margin-top: 0.55em; background: #FF6B45; transform: rotate(45deg);\"><\u002Fspan><span>That disagreement is not necessarily a sign of stupidity.<\u002Fspan><\u002Fli>\n<li style=\"display: flex; gap: 16px; align-items: flex-start; padding: 16px 0; border-top: 1px solid rgba(247,246,242,0.18); font-size: clamp(19px, 1.7cqi, 23px); line-height: 1.4;\"><span aria-hidden=\"true\" style=\"flex: none; width: 8px; height: 8px; margin-top: 0.55em; background: #FF6B45; transform: rotate(45deg);\"><\u002Fspan><span style=\"text-wrap: pretty;\">That complexity is sometimes real, but sometimes merely a symptom of poor explanation.<\u002Fspan><\u002Fli>\n<li style=\"display: flex; gap: 16px; align-items: flex-start; padding: 16px 0; border-top: 1px solid rgba(247,246,242,0.18); font-size: clamp(19px, 1.7cqi, 23px); line-height: 1.4;\"><span aria-hidden=\"true\" style=\"flex: none; width: 8px; height: 8px; margin-top: 0.55em; background: #FF6B45; transform: rotate(45deg);\"><\u002Fspan><span>That local improvements can make the whole worse.<\u002Fspan><\u002Fli>\n<li style=\"display: flex; gap: 16px; align-items: flex-start; padding: 16px 0; border-top: 1px solid rgba(247,246,242,0.18); font-size: clamp(19px, 1.7cqi, 23px); line-height: 1.4;\"><span aria-hidden=\"true\" style=\"flex: none; width: 8px; height: 8px; margin-top: 0.55em; background: #FF6B45; transform: rotate(45deg);\"><\u002Fspan><span>That incentives matter.<\u002Fspan><\u002Fli>\n<li style=\"display: flex; gap: 16px; align-items: flex-start; padding: 16px 0; border-top: 1px solid rgba(247,246,242,0.18); font-size: clamp(19px, 1.7cqi, 23px); line-height: 1.4;\"><span aria-hidden=\"true\" style=\"flex: none; width: 8px; height: 8px; margin-top: 0.55em; background: #FF6B45; transform: rotate(45deg);\"><\u002Fspan><span>That assumptions deserve examination.<\u002Fspan><\u002Fli>\n<li style=\"display: flex; gap: 16px; align-items: flex-start; padding: 16px 0; border-top: 1px solid rgba(247,246,242,0.18); font-size: clamp(19px, 1.7cqi, 23px); line-height: 1.4;\"><span aria-hidden=\"true\" style=\"flex: none; width: 8px; height: 8px; margin-top: 0.55em; background: #FF6B45; transform: rotate(45deg);\"><\u002Fspan><span>That evidence matters more than elegance.<\u002Fspan><\u002Fli>\n<li style=\"display: flex; gap: 16px; align-items: flex-start; padding: 16px 0; border-top: 1px solid rgba(247,246,242,0.18); font-size: clamp(19px, 1.7cqi, 23px); line-height: 1.4;\"><span aria-hidden=\"true\" style=\"flex: none; width: 8px; height: 8px; margin-top: 0.55em; background: #FF6B45; transform: rotate(45deg);\"><\u002Fspan><span style=\"text-wrap: pretty;\">That the purpose of reasoning is not to win arguments, but to make progress.<\u002Fspan><\u002Fli>\n<li style=\"display: flex; gap: 16px; align-items: flex-start; padding: 16px 0; border-top: 1px solid rgba(247,246,242,0.18); border-bottom: 1px solid rgba(247,246,242,0.18); font-size: clamp(19px, 1.7cqi, 23px); line-height: 1.4;\"><span aria-hidden=\"true\" style=\"flex: none; width: 8px; height: 8px; margin-top: 0.55em; background: #FF6B45; transform: rotate(45deg);\"><\u002Fspan><span>And that no one has a monopoly on common sense.<\u002Fspan><\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n\n<p style=\"margin: 0; font-size: clamp(64px, 12cqi, 184px); line-height: 0.9; letter-spacing: -0.05em; font-style: italic; color: #FF6B45;\">Especially us.<\u002Fp>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 24px clamp(32px, 6cqi, 112px); align-items: flex-end; padding-top: clamp(40px, 5cqi, 64px); border-top: 1px solid rgba(247,246,242,0.2);\">\n<p style=\"flex: 1 1 340px; min-width: 0; margin: 0; font-size: clamp(20px, 1.9cqi, 25px); line-height: 1.45; color: #A9ACB8; text-wrap: pretty;\">Reason Commons is not a movement to tell the world what to think.<\u002Fp>\n<p style=\"flex: 1 1 420px; min-width: 0; max-width: 660px; margin: 0; font-size: clamp(26px, 3.2cqi, 44px); line-height: 1.14; letter-spacing: -0.018em; text-wrap: balance;\">It’s a movement to help us think better together.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"join\" aria-labelledby=\"inv-title\" style=\"position: relative; overflow: hidden; padding: clamp(88px, 11cqi, 160px) clamp(20px, 5cqi, 72px);\">\n<svg aria-hidden=\"true\" sc-camel-view-box=\"0 0 1200 900\" sc-camel-preserve-aspect-ratio=\"xMidYMid slice\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none;\"><circle cx=\"840\" cy=\"560\" r=\"380\" fill=\"none\" stroke=\"#15171F\" stroke-opacity=\"0.07\" stroke-width=\"1.2\"><\u002Fcircle><circle cx=\"1220\" cy=\"560\" r=\"380\" fill=\"none\" stroke=\"#15171F\" stroke-opacity=\"0.07\" stroke-width=\"1.2\"><\u002Fcircle><\u002Fsvg>\n<div style=\"position: relative; max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: clamp(56px, 7cqi, 96px);\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 32px clamp(32px, 6cqi, 112px); align-items: flex-start;\">\n<div style=\"flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 24px;\">\n<p style=\"margin: 0; display: flex; align-items: center; gap: 14px; font-family: 'Schibsted Grotesk', 'Helvetica Neue', Helvetica, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #B53018;\"><span style=\"font-family: 'Literata', Georgia, serif; font-style: italic; font-weight: 500; font-size: 22px; letter-spacing: 0; text-transform: none;\">X.<\u002Fspan><span style=\"width: 36px; height: 1px; background: currentColor; flex: none;\"><\u002Fspan><span>The Invitation<\u002Fspan><\u002Fp>\n<h2 id=\"inv-title\" style=\"margin: 0; font-weight: 400; font-size: clamp(36px, 5.2cqi, 72px); line-height: 1.04; letter-spacing: -0.028em; text-wrap: balance;\">The world probably doesn’t need another methodology.<\u002Fh2>\n<\u002Fdiv>\n<div style=\"flex: 1 1 420px; min-width: 0; max-width: 660px; display: flex; flex-direction: column; gap: 22px; padding-top: clamp(0px, 4cqi, 56px);\">\n<p style=\"margin: 0; font-size: clamp(26px, 3.2cqi, 44px); line-height: 1.14; letter-spacing: -0.018em; text-wrap: balance;\">It might, however, benefit from a <em style=\"font-style: italic; color: #1B2BA8;\">renaissance.<\u002Fem><\u002Fp>\n<ul style=\"list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px;\">\n<li style=\"font-size: clamp(20px, 1.9cqi, 25px); line-height: 1.4;\">A renaissance in curiosity.<\u002Fli>\n<li style=\"font-size: clamp(20px, 1.9cqi, 25px); line-height: 1.4;\">In cause and effect.<\u002Fli>\n<li style=\"font-size: clamp(20px, 1.9cqi, 25px); line-height: 1.4;\">In intellectual humility.<\u002Fli>\n<li style=\"font-size: clamp(18px, 1.45cqi, 20px); line-height: 1.62; text-wrap: pretty;\">In the rather unfashionable belief that people with different perspectives can work together to discover something neither could see alone.<\u002Fli>\n<li style=\"font-size: clamp(18px, 1.45cqi, 20px); line-height: 1.62; text-wrap: pretty;\">And in the possibility that many of our most frustrating problems might become easier to solve once we stop treating their symptoms as their causes.<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display: flex; flex-direction: column; gap: 14px; align-items: flex-start;\">\n<p style=\"margin: 0; font-size: clamp(20px, 1.9cqi, 25px); line-height: 1.45;\">It begins with a question.<\u002Fp>\n<ul style=\"list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 26px; font-size: clamp(20px, 2cqi, 26px); line-height: 1.35; color: #4A4D5A;\">\n<li>Not a <s style=\"text-decoration-color: #CF3A1B; text-decoration-thickness: 0.09em;\">course<\u002Fs>.<\u002Fli>\n<li>Not a <s style=\"text-decoration-color: #CF3A1B; text-decoration-thickness: 0.09em;\">certification<\u002Fs>.<\u002Fli>\n<li>Not a <s style=\"text-decoration-color: #CF3A1B; text-decoration-thickness: 0.09em;\">147-slide presentation<\u002Fs>.<\u002Fli>\n<\u002Ful>\n<p style=\"margin: 0; font-size: clamp(20px, 1.9cqi, 25px); line-height: 1.45; font-style: italic;\">Just a question.<\u002Fp>\n<p style=\"margin: 12px 0 0; max-width: 13em; font-size: clamp(46px, 8.4cqi, 124px); line-height: 0.98; letter-spacing: -0.04em; text-wrap: balance;\">What if there’s a better way to <em style=\"font-style: italic; color: #CF3A1B;\">think<\u002Fem> about this?<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 28px clamp(32px, 5cqi, 80px); align-items: center; padding: clamp(24px, 4cqi, 56px); background: #FFFFFF; border: 1.5px solid #15171F;\">\n<div style=\"flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 10px;\">\n<svg width=\"56\" height=\"40\" sc-camel-view-box=\"0 0 40 28\" fill=\"none\" aria-hidden=\"true\"><path d=\"M20 5.34A10 10 0 0 1 20 22.66A10 10 0 0 1 20 5.34Z\" fill=\"#CF3A1B\"><\u002Fpath><circle cx=\"15\" cy=\"14\" r=\"10\" stroke=\"#15171F\" stroke-width=\"1.4\"><\u002Fcircle><circle cx=\"25\" cy=\"14\" r=\"10\" stroke=\"#15171F\" stroke-width=\"1.4\"><\u002Fcircle><\u002Fsvg>\n<p style=\"margin: 0; font-size: clamp(28px, 3.4cqi, 46px); line-height: 1.08; letter-spacing: -0.02em;\">Welcome to Reason Commons.<\u002Fp>\n<p style=\"margin: 0; font-size: clamp(20px, 1.9cqi, 25px); line-height: 1.4; font-style: italic; color: #1B2BA8;\">A Renaissance of Common Sense.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 10px;\">\n<label for=\"join-email\" style=\"font-family: 'Schibsted Grotesk', 'Helvetica Neue', Helvetica, sans-serif; font-size: 14px; font-weight: 600; color: #15171F;\">Email address<\u002Flabel>\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px;\">\n<input id=\"join-email\" type=\"email\" name=\"email\" autocomplete=\"email\" placeholder=\"you@example.com\" style=\"flex: 1 1 220px; min-width: 0; min-height: 56px; box-sizing: border-box; padding: 0 20px; border: 1.5px solid #15171F; border-radius: 999px; background: #F7F6F2; color: #15171F; font-family: 'Schibsted Grotesk', 'Helvetica Neue', Helvetica, sans-serif; font-size: 17px;\">\n<button type=\"button\" style=\"flex: 1 1 auto; display: inline-flex; align-items: center; justify-content: center; gap: 12px; min-height: 56px; padding: 0 24px 0 28px; border: none; border-radius: 999px; background: #CF3A1B; color: #FFFFFF; font-family: 'Schibsted Grotesk', 'Helvetica Neue', Helvetica, sans-serif; font-size: 17px; font-weight: 600; letter-spacing: 0.005em; cursor: pointer;\">Join the Renaissance<svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex: none;\"><path d=\"M4 12h15\"><\u002Fpath><path d=\"M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"background: #1B2BA8; color: #FFFFFF; padding: clamp(72px, 9cqi, 128px) clamp(20px, 5cqi, 72px) 40px;\">\n<div style=\"max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: clamp(48px, 6cqi, 80px);\">\n<p style=\"margin: 0; max-width: 15em; font-style: italic; font-size: clamp(36px, 5.6cqi, 80px); line-height: 1.02; letter-spacing: -0.03em; text-wrap: balance;\">Bring your curiosity. <span style=\"color: #B9C3FF;\">Leave your certainty at the door.<\u002Fspan><\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 16px 40px; align-items: center; justify-content: space-between; padding-top: 24px; border-top: 1px solid rgba(255,255,255,0.28);\">\n<a href=\"#top\" style=\"display: flex; align-items: center; gap: 12px; min-height: 44px; color: #FFFFFF; text-decoration: none;\"><svg width=\"40\" height=\"28\" sc-camel-view-box=\"0 0 40 28\" fill=\"none\" aria-hidden=\"true\" style=\"flex: none;\"><path d=\"M20 5.34A10 10 0 0 1 20 22.66A10 10 0 0 1 20 5.34Z\" fill=\"#FFFFFF\"><\u002Fpath><circle cx=\"15\" cy=\"14\" r=\"10\" stroke=\"#FFFFFF\" stroke-width=\"1.6\"><\u002Fcircle><circle cx=\"25\" cy=\"14\" r=\"10\" stroke=\"#FFFFFF\" stroke-width=\"1.6\"><\u002Fcircle><\u002Fsvg><span style=\"font-size: 21px; font-weight: 500; letter-spacing: -0.012em;\">Reason Commons<\u002Fspan><\u002Fa>\n<nav aria-label=\"Footer\" style=\"display: flex; flex-wrap: wrap; gap: 0 28px; font-family: 'Schibsted Grotesk', 'Helvetica Neue', Helvetica, sans-serif; font-size: 15px; font-weight: 500;\">\n<a href=\"#try\" style=\"display: inline-flex; align-items: center; min-height: 44px; color: #FFFFFF; text-decoration: none;\">The experiment<\u002Fa>\n<a href=\"#questions\" style=\"display: inline-flex; align-items: center; min-height: 44px; color: #FFFFFF; text-decoration: none;\">The questions<\u002Fa>\n<a href=\"#manifesto\" style=\"display: inline-flex; align-items: center; min-height: 44px; color: #FFFFFF; text-decoration: none;\">The manifesto<\u002Fa>\n<a href=\"#join\" style=\"display: inline-flex; align-items: center; min-height: 44px; color: #FFFFFF; text-decoration: none;\">Join<\u002Fa>\n<\u002Fnav>\n<\u002Fdiv>\n<p style=\"margin: 0; font-family: 'Schibsted Grotesk', 'Helvetica Neue', Helvetica, sans-serif; font-size: 13px; letter-spacing: 0.04em; color: #B9C3FF;\">Reason Commons · A Renaissance of Common Sense.<\u002Fp>\n<\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:8000}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    var self = this;\n    var picked = (this.state && this.state.picked) || '';\n    var depts = [\n      { id: 'reception', name: 'Reception', cap: 30 },\n      { id: 'triage', name: 'Triage', cap: 24 },\n      { id: 'doctors', name: 'Doctors', cap: 10 },\n      { id: 'tests', name: 'Tests', cap: 18 },\n      { id: 'discharge', name: 'Discharge', cap: 22 }\n    ];\n    var caps = depts.map(function (d) { return d.id === picked ? d.cap * 1.5 : d.cap; });\n    var flow = Math.min.apply(null, caps);\n    var vals = {};\n    depts.forEach(function (d, i) {\n      var on = d.id === picked;\n      vals['s' + i] = {\n        cap: String(caps[i]),\n        pressed: on,\n        pick: function () { self.setState({ picked: on ? '' : d.id }); },\n        fg: on ? '#1B2BA8' : '#FFFFFF',\n        bg: on ? '#FFFFFF' : 'rgba(255,255,255,0.06)',\n        border: on ? '#FFFFFF' : 'rgba(255,255,255,0.3)',\n        track: on ? 'rgba(27,43,168,0.14)' : 'rgba(255,255,255,0.16)',\n        bar: (caps[i] / 45 * 100).toFixed(1) + '%',\n        barColor: on ? '#1B2BA8' : '#B9C3FF',\n        showTag: picked !== '' && d.id === 'doctors'\n      };\n    });\n    var chosen = depts.filter(function (d) { return d.id === picked; })[0];\n    vals.flow = String(flow);\n    vals.idle = picked === '';\n    vals.active = picked !== '';\n    vals.right = picked === 'doctors';\n    vals.wrong = picked !== '' && picked !== 'doctors';\n    vals.pickedName = chosen ? chosen.name : '';\n    vals.pickedCap = chosen ? String(chosen.cap * 1.5) : '';\n    vals.reset = function () { self.setState({ picked: '' }); };\n    return vals;\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
