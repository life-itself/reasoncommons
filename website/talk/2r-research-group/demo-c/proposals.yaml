# REHEARSAL BUILD — read from talk/2r_participant_contributions_test.docx
# against ltp/ltp-model.yaml. The nine contributors are fictional and the
# document says so; this is rehearsal material, not the room's words. Replace
# it with the real batch on the day and rebuild.
#
#   python3 skills/contribution-proposals/scripts/build-demo.py --test --serve
#   python3 skills/contribution-proposals/scripts/build-demo.py --promote
#
# Nine contributions, nine proposals, nothing merged. Running order is the
# document's, with two exceptions: Sofia and Tarek are swapped so the six
# goal-tree readings run together before the two current-reality ones, and
# Ana's unplaced closes. One view switch instead of four. The unplaced is last
# by choice, not by drift: the deck's Demo B ends on the same beat, and a
# contribution the tree cannot hold is the strongest note to leave a room on.
#
# Confidence is 6 high / 3 medium. Jonas never names the link he is objecting
# to and Ana names the placement herself as one of three possibilities she is
# unsure between, so neither reading is offered as a certainty.

meta:
  title: Demo C — rehearsal · test contributions
  event: Second Renaissance Research Group
  date: 2026-09-04
  model_source: ltp/ltp-model.yaml
  contributions_source: talk/2r_participant_contributions_test.docx
  attribution: name

proposals:
  - id: PROP-001
    source:
      contributor: Maya
      text: >-
        I'm sympathetic to the big civilizational goal, but I'm not sure it helps this group make choices. "Transform civilization" is so broad that almost anything can be justified by it. I'd want a nearer-term statement of success — maybe something like being able to create and sustain a few local communities where people actually live these values over time. Then we could ask whether what we're doing is getting us there.
    interpretation:
      statement: G-1 is too broad to discriminate between courses of action, so it cannot do the work a goal is supposed to do for this group.
      note: Read as a challenge to the goal rather than a request to replace it. Maya offers a candidate nearer-term goal, but as an illustration of what she is missing rather than as a proposal.
    proposal:
      operation: challenge_entity
      placement:
        view: goal-tree
        connects_to: G-1
      rationale: The objection is not that G-1 is wrong but that it is unfalsifiable in practice — anything can be justified under it, so it cannot rule anything out. That is a challenge to the goal as stated, at the top of the tree, and the open questions already ask whether participants confirm G-1 as the operating goal.
      confidence: high
      alternatives:
        - target: G-1
          confidence: medium
          note: Could instead be read as proposing an intermediate objective under G-1 — sustaining a few local communities that live the values over time.
    review:
      status: pending

  - id: PROP-002
    source:
      contributor: Jonas
      text: >-
        I think the 'clear next step' idea is only part of why people stay or leave. In my experience, people commit because somebody they trust invites them into a relationship. A beautifully designed pathway can still feel like a funnel. I'd test whether the real drop-off is missing steps, or whether people just don't yet trust the people and culture enough to go deeper.
    interpretation:
      statement: A transparent path can be fully in place and people still not embody the practice, because what moves them is being invited into relationship by someone they trust.
    proposal:
      operation: challenge_link
      placement:
        view: goal-tree
        link: L-005
      rationale: Jonas does not dispute that a path helps, and he does not dispute the outcome. He disputes that satisfying NC-2 gets you CSF-1 — "a beautifully designed pathway can still feel like a funnel" is precisely the claim that the arrow can fail with both ends intact.
      confidence: medium
      alternatives:
        - target: CSF-1
          confidence: medium
          note: Could instead add a sibling condition under CSF-1 — that newcomers are invited into relationship by someone they already trust.
    review:
      status: pending

  - id: PROP-003
    source:
      contributor: Leila
      text: >-
        Before we talk about growing more pockets, I think there needs to be a minimum safeguarding layer. What happens when there's a power conflict, harassment, a mental-health crisis, or somebody needs to leave safely? Who handles grievances? If we can't answer that, I don't think replication is responsible, even if the practices themselves are strong.
    interpretation:
      statement: Replication is not responsible until there is a safeguarding layer that handles harm, grievance, crisis, and safe exit.
    proposal:
      operation: add_entity
      entity:
        type: necessary_condition
        status: provisional
        statement: A safeguarding layer handles harm, grievance, crisis and safe exit before practices are replicated
      placement:
        view: goal-tree
        connects_to: CSF-3
        relation: necessary_for
      rationale: CSF-3 requires that practices become "responsibly transmissible" and the model never says what makes transmission responsible. Leila names the missing content of that word, which makes this a condition on CSF-3 rather than a challenge to it. The coverage gaps already note that no safeguarding policy accompanied the source documents.
      confidence: high
    review:
      status: pending

  - id: PROP-004
    source:
      contributor: Ben
      text: >-
        I'm uneasy with a contributor → facilitator → steward ladder. It sounds reasonable, but it could accidentally turn into a status hierarchy where the people who move 'up' are seen as more developed. Some people may want to host, care for newcomers, make art, do logistics, or contribute money without ever becoming facilitators. I'd rather the model describe different forms of responsibility than one progression everyone is expected to climb.
    interpretation:
      statement: NC-4 encodes a single ladder of advancement, which risks becoming a status hierarchy and excludes forms of responsibility that are not facilitation.
    proposal:
      operation: challenge_entity
      placement:
        view: goal-tree
        connects_to: NC-4
      rationale: NC-4 states that contributors develop into facilitators and accountable stewards — one progression. Ben's objection is to that shape, not to the capacity it is reaching for, and he proposes describing different forms of responsibility instead. That disputes the condition as written.
      confidence: high
    review:
      status: pending

  - id: PROP-005
    source:
      contributor: Priya
      text: >-
        I like the attempt to define durable adoption, but once we make throughput a number I'm worried we'll optimize for the number. I'd want stories, peer observation, and evidence about the quality of relationships to count just as much. Also, somebody deciding not to continue — or leaving because something felt wrong — should be treated as useful evidence, not simply as a failed conversion.
    interpretation:
      statement: Operationalising throughput will produce optimisation for the measure, and treating departure as failed conversion discards evidence the group needs.
    proposal:
      operation: challenge_entity
      placement:
        view: goal-tree
        connects_to: NC-1
      rationale: NC-1 claims throughput can be operationally defined without reducing transformation to activity counts. Priya's claim is that the qualifier will not survive having a number, and that the definition would misclassify a considered departure as a failure. Both dispute the condition itself rather than where it sits.
      confidence: high
    review:
      status: pending

  - id: PROP-006
    source:
      contributor: Sofia
      text: >-
        I'd connect the practice pockets much more directly to doing useful work in a place. A group that meditates and studies together is one thing; a group that also restores a watershed, helps neighbors, runs a community kitchen, or solves a local problem may build a much more durable culture. It might even be that shared action creates the depth and trust, rather than depth always coming first and then producing action.
    interpretation:
      statement: Pockets need to be doing useful work in a specific place, and that shared work may be what produces depth and trust rather than following from them.
      note: Two claims, and only the first is proposed here. The second — that the causal order runs the other way — would be a challenge to NC-3's "progressively deeper levels" and is recorded as an alternative rather than shown.
    proposal:
      operation: add_entity
      entity:
        type: necessary_condition
        status: provisional
        statement: Practice pockets take on useful work in a specific place alongside their inward practice
      placement:
        view: goal-tree
        connects_to: NC-5
        relation: necessary_for
      rationale: NC-5 already requires that dense practice containers remain outward-facing, but says nothing about what outward-facing consists of. Sofia gives it content — consequential work in a place — which makes this a condition on NC-5 rather than a rival to it.
      confidence: medium
      alternatives:
        - target: NC-3
          confidence: medium
          note: The second half of the contribution challenges NC-3's assumption that depth accumulates by repetition and then produces action.
    review:
      status: pending

  - id: PROP-007
    source:
      contributor: Tarek
      text: >-
        I'm not convinced that awareness isn't the bottleneck. Outside the people already adjacent to this work, almost nobody I talk to has heard of Second Renaissance. Before we organize the whole strategy around conversion, I'd run a simple test: put comparable effort into outreach and into improving the pathway, and see which one actually changes sustained participation. Right now the constraint feels assumed rather than demonstrated.
    interpretation:
      statement: The claim that conversion rather than awareness is the constraint is assumed rather than demonstrated, and could be settled by a comparison test.
    proposal:
      operation: challenge_entity
      placement:
        view: current-reality
        connects_to: RC-1
      rationale: RC-1 is the model's named current constraint, and it rests on ASM-3, that awareness and reach are not the current constraint. Tarek disputes exactly that assumption, which makes this a challenge to RC-1 rather than to any effect below it. The model's own open questions ask whether conversion architecture is truly the constraint.
      confidence: high
      alternatives:
        - target: ACT-1
          confidence: medium
          note: The comparison test he describes would also be a transition-tree action in its own right.
    review:
      status: pending

  - id: PROP-008
    source:
      contributor: Marcus
      text: >-
        The organizer-burnout problem feels underexplained to me. It may not mainly come from too few people progressing into leadership. A lot of burnout is boring coordination: scheduling, admin, fundraising, maintaining tools, following up, paying for space. We may need actual budget, infrastructure, and some paid operational capacity. A better apprenticeship pathway won't automatically remove that load.
    interpretation:
      statement: Organizer burnout comes largely from unfunded coordination work — admin, fundraising, tooling, space — which developing more facilitators does not remove.
    proposal:
      operation: add_entity
      entity:
        type: root_cause
        status: provisional
        statement: Coordination, administration, fundraising and infrastructure work is unfunded and falls on organizers
      placement:
        view: current-reality
        connects_to: UDE-3
        relation: causes
      rationale: UDE-3 observes that core organizers carry too much of the work and risk burnout, and every cause the tree currently offers is about the supply of leaders. Marcus names a different cause of the same effect, one the tree does not hold — which also weakens the assumption that facilitator development is what relieves it.
      confidence: high
    review:
      status: pending

  - id: PROP-009
    source:
      contributor: Ana
      text: >-
        I keep wondering where art, celebration, grief ritual, music, shared meals, and beauty fit in this picture. They aren't 'practice' in the narrow sense, and they aren't exactly outreach either, but they're often what makes a culture feel alive enough that people want to belong to it. I'm not sure whether this should become a condition in the tree, evidence for embodiment, or whether it points to something the model simply doesn't represent yet.
    interpretation:
      statement: Culture — art, celebration, grief ritual, music, shared meals, beauty — is what makes a way of life worth belonging to, and the model has no category for it.
      note: Ana names the three possibilities herself, and the third is the one taken here. Her own uncertainty is part of the contribution rather than a gap in it.
    proposal:
      operation: unplaced
      placement:
        view: goal-tree
      rationale: The nearest address is CSF-1, durable embodiment of practices and ways of acting — but filing celebration and grief there would make them instrumental, a means to adoption, which is close to the reading Ana is wary of. The model has no category for what a culture is like to belong to, as distinct from what it asks of people. Attaching this anywhere would hide that.
      confidence: medium
      alternatives:
        - target: CSF-1
          confidence: medium
          note: Ana lists this reading herself — that culture is a condition for durable embodiment. Taking it would place the contribution but arguably instrumentalise it.
    review:
      status: pending
