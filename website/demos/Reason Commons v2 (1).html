ap:wrap;align-items:baseline;gap:8px 20px;padding:14px 24px;border-bottom:1.5px solid #1c1c1c\">\n    <div style=\"font-size:15px;letter-spacing:.08em;text-transform:uppercase\">Reason Commons · convergence prototype<\u002Fdiv>\n    <div style=\"flex:1\"><\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:6px\">\n      <span style=\"font-size:14px;color:#6b6b6b;margin-right:4px\">Sit as<\u002Fspan>\n      <sc-for list=\"{{ seats }}\" as=\"s\" hint-placeholder-count=\"5\">\n        <button sc-camel-on-click=\"{{ s.pick }}\" style=\"border:1.5px solid #1c1c1c;border-radius:3px;padding:2px 10px;background:{{ s.bg }};color:{{ s.fg }};font-size:15px\">{{ s.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,360px);gap:24px;padding:24px;align-items:start\">\n    <!-- PROTOTYPE -->\n    <div style=\"min-width:0;max-width:760px;background:#f7f5f0;border:1.5px solid #1c1c1c;border-radius:4px;box-shadow:3px 3px 0 #1c1c1c\">\n      <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;padding:12px 20px;border-bottom:1.5px solid #1c1c1c\">\n        <sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"letter-spacing:.1em;text-transform:uppercase;font-size:15px\">Reason Commons<\u002Fspan><\u002Fsc-if>\n        <sc-if value=\"{{ notHome }}\" hint-placeholder-val=\"{{ false }}\"><a href=\"#\" sc-camel-on-click=\"{{ goHome }}\" style=\"text-decoration:none;font-size:15px\">‹ What constrains us now<\u002Fa><\u002Fsc-if>\n        <span style=\"flex:1\"><\u002Fspan>\n        <a href=\"#\" sc-camel-on-click=\"{{ goTimeline }}\" style=\"font-size:15px\">Show how we got here<\u002Fa>\n        <span style=\"font-size:15px;color:#6b6b6b\">{{ seat.name }} · {{ seat.panel }}<\u002Fspan>\n      <\u002Fdiv>\n\n      <!-- LOOP STRIP -->\n      <div style=\"display:flex;flex-wrap:wrap;gap:6px 8px;padding:10px 20px;border-bottom:1px dashed #b5b2ab;align-items:center\">\n        <span style=\"font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#6b6b6b;margin-right:4px\">Model v{{ version }}<\u002Fspan>\n        <sc-for list=\"{{ stages }}\" as=\"st\" hint-placeholder-count=\"6\">\n          <button sc-camel-on-click=\"{{ st.pick }}\" style=\"border:1.5px solid {{ st.border }};border-radius:3px;padding:1px 9px;background:{{ st.bg }};color:{{ st.fg }};font-size:14px;white-space:nowrap\">{{ st.q }}<span style=\"color:{{ st.hereColor }}\"> {{ st.here }}<\u002Fspan><\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <!-- 1 HOME -->\n      <sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"padding:20px 20px 24px;display:flex;flex-direction:column;gap:22px\">\n          <div style=\"border:1.5px solid #1c1c1c;border-radius:3px;background:#fff;padding:16px 18px;display:flex;flex-direction:column;gap:12px\">\n            <div>\n              <div style=\"font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#6b6b6b\">Goal<\u002Fdiv>\n              <div style=\"font-size:22px;line-height:1.2;text-wrap:pretty\">Our community gives partners one coherent response to institutional instability.<\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#6b6b6b\">Current constraint<\u002Fdiv>\n              <div style=\"text-wrap:pretty\">{{ constraint.text }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;align-items:baseline\">\n              <span style=\"font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:#6b6b6b\">Needed now<\u002Fspan><span style=\"font-size:18px\">{{ constraint.needed }}<\u002Fspan>\n              <span><\u002Fspan><span style=\"font-size:15px;color:#6b6b6b\">{{ constraint.meta }}<\u002Fspan>\n            <\u002Fdiv>\n            <div><button sc-camel-on-click=\"{{ constraint.go }}\" style=\"border:1.5px solid #1c1c1c;border-radius:3px;padding:5px 16px;background:oklch(55% 0.16 145);color:#fff\">Help resolve this →<\u002Fbutton><\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"display:flex;align-items:baseline;gap:8px;border-bottom:1.5px solid #1c1c1c;padding-bottom:4px;margin-bottom:12px\"><span style=\"letter-spacing:.1em;text-transform:uppercase;font-size:14px\">Needs you<\u002Fspan><span style=\"font-size:14px;color:#6b6b6b\">({{ queueCount }})<\u002Fspan><\u002Fdiv>\n            <sc-if value=\"{{ queueEmpty }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"color:#6b6b6b;padding:8px 0\">Nothing needs you right now. The constraint is elsewhere.<\u002Fdiv><\u002Fsc-if>\n            <div style=\"display:flex;flex-direction:column;gap:10px\">\n              <sc-for list=\"{{ queue }}\" as=\"q\" hint-placeholder-count=\"2\">\n                <div style=\"display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:center;border:1.5px solid #1c1c1c;border-radius:3px;padding:10px 14px;background:#fff\">\n                  <div style=\"min-width:0\">\n                    <div style=\"font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#6b6b6b\">{{ q.kind }}<\u002Fdiv>\n                    <div>{{ q.title }}<\u002Fdiv>\n                    <div style=\"font-size:15px;color:#6b6b6b\">{{ q.detail }}<\u002Fdiv>\n                    <sc-if value=\"{{ showWhyMe }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"font-size:15px;margin-top:2px\"><span style=\"color:#6b6b6b\">Why you:<\u002Fspan> {{ q.why }}<\u002Fdiv><\u002Fsc-if>\n                  <\u002Fdiv>\n                  <button sc-camel-on-click=\"{{ q.go }}\" style=\"border:1.5px solid #1c1c1c;border-radius:3px;padding:4px 14px;background:#fff;white-space:nowrap\">{{ q.action }} →<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- 2 MODEL -->\n      <sc-if value=\"{{ isModel }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding:20px 20px 24px;display:flex;flex-direction:column;gap:18px\">\n          <div>\n            <div style=\"font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#6b6b6b\">What's happening, and why <sc-if value=\"{{ tocNames }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"border:1px solid #6b6b6b;border-radius:3px;padding:0 5px;font-size:12px;margin-left:4px\">Current Reality Tree<\u002Fspan><\u002Fsc-if><\u002Fdiv>\n            <div style=\"font-size:24px;line-height:1.2;text-wrap:pretty\">Why do six proposals stay six?<\u002Fdiv>\n            <div style=\"font-size:15px;color:#6b6b6b;margin-top:4px\">Click any arrow to say whether you think it holds. {{ disputedLine }}<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ revisedToast }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"border:1.5px dashed #1c1c1c;border-radius:3px;padding:8px 12px;font-size:15px;background:#fff\">Model v3. One condition added, one link marked revised. The constraint moved: the new account has {{ disputedCount }} disputed links.<\u002Fdiv><\u002Fsc-if>\n          <div style=\"display:flex;flex-direction:column;align-items:stretch;gap:0\">\n            <sc-for list=\"{{ chain }}\" as=\"n\" hint-placeholder-count=\"6\">\n              <div style=\"display:flex;flex-direction:column;gap:0\">\n                <div style=\"border:1.5px solid #1c1c1c;border-radius:3px;background:{{ n.bg }};padding:8px 12px;display:flex;gap:10px;align-items:baseline;font-size:{{ n.size }}\"><span style=\"flex:1;text-wrap:pretty\">{{ n.text }}<\u002Fspan><span style=\"font-size:13px;color:{{ n.tagColor }};white-space:nowrap\">{{ n.tag }}<\u002Fspan><\u002Fdiv>\n                <sc-if value=\"{{ n.hasLink }}\" hint-placeholder-val=\"{{ true }}\">\n                  <div style=\"display:flex;align-items:center;gap:10px;padding:2px 0 2px 24px\">\n                    <span style=\"font-size:22px;line-height:1\">↓<\u002Fspan>\n                    <button sc-camel-on-click=\"{{ n.pick }}\" style=\"border:1.5px {{ n.linkBorder }} {{ n.linkColor }};border-radius:3px;padding:0 8px;background:{{ n.linkBg }};color:{{ n.linkColor }};font-size:14px\">{{ n.linkLabel }}<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ hasSel }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"border:1.5px dashed #1c1c1c;border-radius:3px;padding:14px 16px;background:#fff;display:flex;flex-direction:column;gap:12px\">\n              <div style=\"font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#6b6b6b\">This link · does “{{ sel.from }}” cause “{{ sel.to }}”?<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 18px;font-size:16px\">\n                <span style=\"color:#6b6b6b;font-size:14px;letter-spacing:.06em;text-transform:uppercase;padding-top:2px\">Where we stand<\u002Fspan><span><b>{{ sel.stand }}<\u002Fb> · {{ sel.standDetail }}<\u002Fspan>\n                <span style=\"color:#6b6b6b;font-size:14px;letter-spacing:.06em;text-transform:uppercase;padding-top:2px\">They say<\u002Fspan><span>{{ sel.voices }}<\u002Fspan>\n                <span style=\"color:#6b6b6b;font-size:14px;letter-spacing:.06em;text-transform:uppercase;padding-top:2px\">Would settle it<\u002Fspan><span>{{ sel.settle }}<\u002Fspan>\n              <\u002Fdiv>\n              <sc-if value=\"{{ sel.open }}\" hint-placeholder-val=\"{{ true }}\">\n                <textarea value=\"{{ prose }}\" sc-camel-on-change=\"{{ setProse }}\" rows=\"3\" style=\"width:100%;box-sizing:border-box;border:1.5px solid #1c1c1c;border-radius:3px;padding:10px 12px;background:#fff;resize:vertical;line-height:1.4\" placeholder=\"Say what you see, the way you would say it to a colleague.\"><\u002Ftextarea>\n                <sc-if value=\"{{ notInterpreted }}\" hint-placeholder-val=\"{{ true }}\"><div><button sc-camel-on-click=\"{{ interpret }}\" style=\"border:1.5px solid #1c1c1c;border-radius:3px;padding:5px 16px;background:oklch(55% 0.16 145);color:#fff\">Read it back to me →<\u002Fbutton><\u002Fdiv><\u002Fsc-if>\n                <sc-if value=\"{{ interpreted }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 18px;font-size:16px;border-top:1px dashed #b5b2ab;padding-top:10px\">\n                    <span style=\"color:#6b6b6b;font-size:14px;letter-spacing:.06em;text-transform:uppercase;padding-top:2px\">We read<\u002Fspan><span><b>{{ sel.rbKind }}<\u002Fb> — {{ sel.rbDetail }}<\u002Fspan>\n                    <span style=\"color:#6b6b6b;font-size:14px;letter-spacing:.06em;text-transform:uppercase;padding-top:2px\">Link becomes<\u002Fspan><span style=\"border-bottom:2px solid oklch(55% 0.16 145);display:inline-block\">{{ sel.rbLabel }}<\u002Fspan>\n                    <span style=\"color:#6b6b6b;font-size:14px;letter-spacing:.06em;text-transform:uppercase;padding-top:2px\">Then we stand<\u002Fspan><span>{{ sel.rbStand }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;justify-content:flex-end;gap:10px\"><button sc-camel-on-click=\"{{ reinterpret }}\" style=\"border:1.5px solid #1c1c1c;border-radius:3px;padding:5px 16px;background:#fff\">← Say it differently<\u002Fbutton><button sc-camel-on-click=\"{{ updateLink }}\" style=\"border:1.5px solid #1c1c1c;border-radius:3px;padding:5px 16px;background:oklch(55% 0.16 145);color:#fff\">Update the model<\u002Fbutton><\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ sel.closed }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:15px;color:#6b6b6b\">Updated today by {{ seat.name }}. Anyone can reopen it by saying what they see.<\u002Fdiv><\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ modelDone }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"border-top:1.5px solid #1c1c1c;padding-top:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap\"><button sc-camel-on-click=\"{{ goConflict }}\" style=\"border:1.5px solid #1c1c1c;border-radius:3px;padding:5px 16px;background:oklch(55% 0.16 145);color:#fff\">Why haven't we fixed it? →<\u002Fbutton><span style=\"font-size:15px;color:#6b6b6b\">Every link holds. The constraint moved to the conflict.<\u002Fspan><\u002Fdiv><\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- 3 CONFLICT -->\n      <sc-if value=\"{{ isConflict }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding:20px 20px 24px;display:flex;flex-direction:column;gap:18px\">\n          <div>\n            <div style=\"font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#6b6b6b\">Why haven't we fixed it already <sc-if value=\"{{ tocNames }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"border:1px solid #6b6b6b;border-radius:3px;padding:0 5px;font-size:12px;margin-left:4px\">Evaporating Cloud<\u002Fspan><\u002Fsc-if><\u002Fdiv>\n            <div style=\"font-size:24px;line-height:1.2;text-wrap:pretty\">We want two things that seem to exclude each other.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:center\">\n            <div style=\"grid-row:1 / span 2;border:1.5px solid #1c1c1c;border-radius:3px;background:#fff;padding:10px 12px\"><div style=\"font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#6b6b6b\">Both serve<\u002Fdiv><div>A response partners can act on.<\u002Fdiv><\u002Fdiv>\n            <div style=\"border:1.5px solid #1c1c1c;border-radius:3px;background:#fff;padding:10px 12px\"><div style=\"font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#6b6b6b\">We need<\u002Fdiv><div>Remedies we can compare.<\u002Fdiv><\u002Fdiv>\n            <div style=\"border:1.5px solid #1c1c1c;border-radius:3px;background:#f7f5f0;padding:10px 12px\"><div style=\"font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#6b6b6b\">So some say<\u002Fdiv><div>Commit to one lead diagnosis now.<\u002Fdiv><\u002Fdiv>\n            <div style=\"border:1.5px solid #1c1c1c;border-radius:3px;background:#fff;padding:10px 12px\"><div style=\"font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#6b6b6b\">We also need<\u002Fdiv><div>Not to miss the real cause.<\u002Fdiv><\u002Fdiv>\n            <div style=\"border:1.5px solid #1c1c1c;border-radius:3px;background:#f7f5f0;padding:10px 12px\"><div style=\"font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#6b6b6b\">Others say<\u002Fdiv><div>Keep all six diagnoses open.<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"border-bottom:1.5px solid #1c1c1c;padding-bottom:4px;margin-bottom:8px;font-size:13px;letter-spacing:.1em;text-transform:uppercase\">What makes this feel necessary<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:6px\">\n              <sc-for list=\"{{ assumptions }}\" as=\"a\" hint-placeholder-count=\"3\">\n                <button sc-camel-on-click=\"{{ a.pick }}\" style=\"display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:10px;padding:6px 8px;border:1.5px {{ a.border }} {{ a.borderColor }};border-radius:3px;background:{{ a.bg }};font-size:16px;align-items:baseline\"><span style=\"color:{{ a.markColor }}\">{{ a.mark }}<\u002Fspan><span style=\"text-wrap:pretty\">{{ a.text }}<\u002Fspan><span style=\"font-size:14px;color:#6b6b6b\">{{ a.status }}<\u002Fspan><\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ hasAsm }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"border:1.5px dashed #1c1c1c;border-radius:3px;padding:14px 16px;background:#fff;display:flex;flex-direction:column;gap:12px\">\n              <div style=\"font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#6b6b6b\">Why do we believe “{{ asm.text }}”?<\u002Fdiv>\n              <textarea value=\"{{ prose }}\" sc-camel-on-change=\"{{ setProse }}\" rows=\"3\" style=\"width:100%;box-sizing:border-box;border:1.5px solid #1c1c1c;border-radius:3px;padding:10px 12px;background:#fff;resize:vertical;line-height:1.4\" placeholder=\"Say why choosing one seems to prevent the other.\"><\u002Ftextarea>\n              <sc-if value=\"{{ notInterpreted }}\" hint-placeholder-val=\"{{ true }}\"><div><button sc-camel-on-click=\"{{ interpret }}\" style=\"border:1.5px solid #1c1c1c;border-radius:3px;padding:5px 16px;background:oklch(55% 0.16 145);color:#fff\">Read it back to me →<\u002Fbutton><\u002Fdiv><\u002Fsc-if>\n              <sc-if value=\"{{ interpreted }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 18px;font-size:16px;border-top:1px dashed #b5b2ab;padding-top:10px\">\n                  <span style=\"color:#6b6b6b;font-size:14px;letter-spacing:.06em;text-transform:uppercase;padding-top:2px\">We read<\u002Fspan><span>{{ asm.rb }}<\u002Fspan>\n                  <span style=\"color:#6b6b6b;font-size:14px;letter-spacing:.06em;text-transform:uppercase;padding-top:2px\">If true<\u002Fspan><span style=\"border-bottom:2px solid oklch(55% 0.16 145);display:inline-block\">{{ asm.ifTrue }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:flex;justify-content:flex-end;gap:10px\"><button sc-camel-on-click=\"{{ reinterpret }}\" style=\"border:1.5px solid #1c1c1c;border-radius:3px;padding:5px 16px;background:#fff\">← Say it differently<\u002Fbutton><button sc-camel-on-click=\"{{ breakAsm }}\" style=\"border:1.5px solid #1c1c1c;border-radius:3px;padding:5px 16px;background:oklch(55% 0.16 145);color:#fff\">{{ asm.cta }}<\u002Fbutton><\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- 4 INJECTION -->\n      <sc-if value=\"{{ isInjection }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding:20px 20px 24px;display:flex;flex-direction:column;gap:18px\">\n          <div>\n            <div style=\"font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#6b6b6b\">What could break the impasse <sc-if value=\"{{ tocNames }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"border:1px solid #6b6b6b;border-radius:3px;padding:0 5px;font-size:12px;margin-left:4px\">Injection · Future Reality Tree<\u002Fspan><\u002Fsc-if><\u002Fdiv>\n            <div style=\"font-size:24px;line-height:1.2;text-wrap:pretty\">Agree on the tests, not the causes.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border:1.5px solid #1c1c1c;border-radius:3px;padding:12px 14px;background:#fff;font-size:18px;text-wrap:pretty\">For each of the six causal claims, its author and one critic agree in advance what evidence would be decisive. Proposals are then compared by how their claims fare, not by which diagnosis we prefer.<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 18px;font-size:16px\">\n            <span style=\"color:#6b6b6b;font-size:14px;letter-spacing:.06em;text-transform:uppercase;padding-top:2px\">Breaks<\u002Fspan><span>“Remedies can only be compared against one agreed cause.”<\u002Fspan>\n            <span style=\"color:#6b6b6b;font-size:14px;letter-spacing:.06em;text-transform:uppercase;padding-top:2px\">Proposed by<\u002Fspan><span>{{ injectionBy }}<\u002Fspan>\n          <\u002Fdiv>\n          <div>\n            <div style=\"border-bottom:1.5px solid #1c1c1c;padding-bottom:4px;margin-bottom:8px;font-size:13px;letter-spacing:.1em;text-transform:uppercase\">Would that produce the future we want?<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:2px;font-size:16px;padding-left:4px\">\n              <div>Agreed tests for each causal claim<\u002Fdiv>\n              <div style=\"color:#6b6b6b;padding-left:12px\">↓<\u002Fdiv>\n              <div>Claims become comparable without a lead diagnosis<\u002Fdiv>\n              <div style=\"color:#6b6b6b;padding-left:12px\">↓<\u002Fdiv>\n              <div>Some claims fail their tests; their proposals are withdrawn or merged<\u002Fdiv>\n              <div style=\"color:#6b6b6b;padding-left:12px\">↓<\u002Fdiv>\n              <div>Three or fewer live proposals, ranked by what survived<\u002Fdiv>\n              <div style=\"color:#6b6b6b;padding-left:12px\">↓<\u002Fdiv>\n              <div>One structured brief partners can act on<\u002Fdiv>\n              <div style=\"margin-top:8px;color:oklch(55% 0.16 60)\">⚠ Authors may agree only to tests they expect to pass. If all six pass, we are back to six. <span style=\"color:#6b6b6b\">(watch for this)<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border:1.5px dashed #1c1c1c;border-radius:3px;padding:14px 16px;background:#fff;display:flex;flex-direction:column;gap:12px\">\n            <div style=\"font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#6b6b6b\">Before we adopt this, say what reality should show<\u002Fdiv>\n            <div style=\"font-size:16px\">What do we expect to see if this is correct?<\u002Fdiv>\n            <textarea value=\"{{ expect }}\" sc-camel-on-change=\"{{ setExpect }}\" rows=\"2\" style=\"width:100%;box-sizing:border-box;border:1.5px solid #1c1c1c;border-radius:3px;padding:10px 12px;background:#fff;resize:vertical;line-height:1.4\"><\u002Ftextarea>\n            <div style=\"font-size:16px\">What would make us reconsider?<\u002Fdiv>\n            <textarea value=\"{{ weaken }}\" sc-camel-on-change=\"{{ setWeaken }}\" rows=\"2\" style=\"width:100%;box-sizing:border-box;border:1.5px solid #1c1c1c;border-radius:3px;padding:10px 12px;background:#fff;resize:vertical;line-height:1.4\"><\u002Ftextarea>\n            <div style=\"display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 18px;font-size:16px\">\n              <span style=\"color:#6b6b6b;font-size:14px;letter-spacing:.06em;text-transform:uppercase;padding-top:2px\">Observable by<\u002Fspan><span style=\"border-bottom:1.5px solid #1c1c1c;display:inline-block\">March 2027<\u002Fspan>\n              <span style=\"color:#6b6b6b;font-size:14px;letter-spacing:.06em;text-transform:uppercase;padding-top:2px\">Who records<\u002Fspan><span>N. Okafor (Observer)<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:10px;align-items:center;border-top:1.5px solid #1c1c1c;padding-top:14px\">\n            <sc-if value=\"{{ notAdopted }}\" hint-placeholder-val=\"{{ true }}\">\n              <button sc-camel-on-click=\"{{ adopt }}\" style=\"border:1.5px solid #1c1c1c;border-radius:3px;padding:5px 16px;background:oklch(55% 0.16 145);color:#fff\">Adopt with this prediction<\u002Fbutton>\n              <span style=\"font-size:15px;color:#6b6b6b\">Adopting records the prediction. Nothing is “true”; it is outstanding until March.<\u002Fspan>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ adopted }}\" hint-placeholder-val=\"{{ false }}\">\n              <span style=\"border:1.5px solid #1c1c1c;border-radius:3px;padding:1px 10px;font-size:15px;background:#fff\">Prediction outstanding · observable by Mar 2027<\u002Fspan>\n              <button sc-camel-on-click=\"{{ goSteps }}\" style=\"border:1.5px solid #1c1c1c;border-radius:3px;padding:5px 16px;background:oklch(55% 0.16 145);color:#fff\">What stops us? →<\u002Fbutton>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- 5 STEPS -->\n      <sc-if value=\"{{ isSteps }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding:20px 20px 24px;display:flex;flex-direction:column;gap:18px\">\n          <div>\n            <div style=\"font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#6b6b6b\">What stops us, and what next <sc-if value=\"{{ tocNames }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"border:1px solid #6b6b6b;border-radius:3px;padding:0 5px;font-size:12px;margin-left:4px\">Prerequisite Tree · Transition Tree<\u002Fspan><\u002Fsc-if><\u002Fdiv>\n            <div style=\"font-size:24px;line-height:1.2;text-wrap:pretty\">Each contested causal claim gets a test both sides accept.<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"border-bottom:1.5px solid #1c1c1c;padding-bottom:4px;margin-bottom:8px;font-size:13px;letter-spacing:.1em;text-transform:uppercase\">What stops us doing it tomorrow<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:4px;font-size:16px\">\n              <sc-for list=\"{{ obstacles }}\" as=\"o\" hint-placeholder-count=\"4\">\n                <div style=\"display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:10px;padding:3px 4px;border-bottom:1px dashed #b5b2ab;align-items:baseline\"><span style=\"color:{{ o.color }}\">{{ o.mark }}<\u002Fspan><span>{{ o.text }}<\u002Fspan><span style=\"font-size:14px;color:#6b6b6b\">{{ o.status }}<\u002Fspan><\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border:1.5px solid #1c1c1c;border-radius:3px;background:#fff;padding:14px 16px;display:flex;flex-direction:column;gap:10px\">\n            <div style=\"font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#6b6b6b\">Next necessary step<\u002Fdiv>\n            <div style=\"font-size:20px;line-height:1.2;text-wrap:pretty\">Ask each of the six authors: what evidence would make you drop your cause?<\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 18px;font-size:16px\">\n              <span style=\"color:#6b6b6b;font-size:14px;letter-spacing:.06em;text-transform:uppercase;padding-top:2px\">Why this first<\u002Fspan><span>Without it, tests are chosen by critics and rejected by proponents. Every later step needs these six answers.<\u002Fspan>\n              <span style=\"color:#6b6b6b;font-size:14px;letter-spacing:.06em;text-transform:uppercase;padding-top:2px\">Owner<\u002Fspan><span>{{ stepOwner }}<\u002Fspan>\n              <span style=\"color:#6b6b6b;font-size:14px;letter-spacing:.06em;text-transform:uppercase;padding-top:2px\">Done when<\u002Fspan><span>Six answers are recorded against the six claims in the model.<\u002Fspan>\n              <span style=\"color:#6b6b6b;font-size:14px;letter-spacing:.06em;text-transform:uppercase;padding-top:2px\">Makes possible<\u002Fspan><span>Agreeing the tests (obstacle 2) · scheduling them (obstacle 4)<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-top:4px\">\n              <sc-if value=\"{{ notClaimed }}\" hint-placeholder-val=\"{{ true }}\"><button sc-camel-on-click=\"{{ claim }}\" style=\"border:1.5px solid #1c1c1c;border-radius:3px;padding:5px 16px;background:oklch(55% 0.16 145);color:#fff\">Work on this<\u002Fbutton><\u002Fsc-if>\n              <sc-if value=\"{{ claimed }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"border:1.5px solid #1c1c1c;border-radius:3px;padding:1px 10px;font-size:15px\">Owned by {{ stepOwner }} · since today<\u002Fspan><span style=\"font-size:15px;color:#6b6b6b\">The six answers will attach to the six causal claims as evidence.<\u002Fspan><\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- 6 TIMELINE -->\n      <sc-if value=\"{{ isTimeline }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding:20px 20px 24px;display:flex;flex-direction:column;gap:18px\">\n          <div>\n            <div style=\"font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#6b6b6b\">How we got here<\u002Fdiv>\n            <div style=\"font-size:24px;line-height:1.2;text-wrap:pretty\">What we believed, what we expected, what happened, what we changed.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:flex-start;border-top:1.5px solid #1c1c1c;padding-top:10px;gap:0\">\n            <sc-for list=\"{{ events }}\" as=\"ev\" hint-placeholder-count=\"4\">\n              <button sc-camel-on-click=\"{{ ev.pick }}\" style=\"flex:1;min-width:0;border:none;background:transparent;padding:0 6px 0 0;display:flex;flex-direction:column;gap:2px;align-items:flex-start\">\n                <span style=\"display:inline-block;width:14px;height:14px;border:1.5px solid #1c1c1c;border-radius:50%;background:{{ ev.dot }};margin-top:-18px\"><\u002Fspan>\n                <span style=\"font-size:14px;color:#6b6b6b\">{{ ev.date }}<\u002Fspan>\n                <span style=\"font-size:15px;text-wrap:pretty;line-height:1.2\">{{ ev.label }}<\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"border:1.5px dashed #1c1c1c;border-radius:3px;padding:14px 16px;background:#fff;display:flex;flex-direction:column;gap:10px\">\n            <div style=\"font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#6b6b6b\">{{ ev.date }} · {{ ev.title }}<\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 18px;font-size:16px\">\n              <span style=\"color:#6b6b6b;font-size:14px;letter-spacing:.06em;text-transform:uppercase;padding-top:2px\">We believed<\u002Fspan><span style=\"text-wrap:pretty\">{{ ev.believed }}<\u002Fspan>\n              <span style=\"color:#6b6b6b;font-size:14px;letter-spacing:.06em;text-transform:uppercase;padding-top:2px\">So we expected<\u002Fspan><span style=\"text-wrap:pretty\">{{ ev.expected }}<\u002Fspan>\n              <span style=\"color:#6b6b6b;font-size:14px;letter-spacing:.06em;text-transform:uppercase;padding-top:2px\">Reality showed<\u002Fspan><span style=\"text-wrap:pretty\">{{ ev.observed }}<\u002Fspan>\n              <span style=\"color:#6b6b6b;font-size:14px;letter-spacing:.06em;text-transform:uppercase;padding-top:2px\">So we revised<\u002Fspan><span style=\"text-wrap:pretty\">{{ ev.revised }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:15px;color:#6b6b6b\">Nobody is named as wrong here. Model v1 predicted; reality answered; the commons revised.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- 7 DIVERGED -->\n      <sc-if value=\"{{ isDiverged }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding:20px 20px 24px;display:flex;flex-direction:column;gap:18px\">\n          <div>\n            <div style=\"font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#6b6b6b\">What actually happened · observed Aug 2026 by N. Okafor<\u002Fdiv>\n            <div style=\"font-size:24px;line-height:1.2;text-wrap:pretty\">Reality diverged from the model here.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 18px;font-size:16px\">\n            <span style=\"color:#6b6b6b;font-size:14px;letter-spacing:.06em;text-transform:uppercase;padding-top:2px\">We predicted<\u002Fspan><span>Jan 2026: if every proposal states its causal claim explicitly, overlaps become visible and proposals merge to three or fewer by August.<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:2px;font-size:16px;padding-left:4px\">\n            <div><span style=\"color:oklch(45% 0.16 145)\">✓<\u002Fspan> Six proposals restated with explicit causal claims <span style=\"color:#6b6b6b;font-size:14px\">(6 of 6, Apr 2026)<\u002Fspan><\u002Fdiv>\n            <div style=\"color:#6b6b6b;padding-left:12px\">↓<\u002Fdiv>\n            <div><span style=\"color:oklch(45% 0.16 145)\">✓<\u002Fspan> Overlaps visible: four pairs flagged as addressing the same effect<\u002Fdiv>\n            <div style=\"color:#6b6b6b;padding-left:12px\">↓<\u002Fdiv>\n            <div style=\"border:1.5px dashed oklch(45% 0.16 25);border-radius:3px;padding:6px 10px;color:oklch(45% 0.16 25);display:flex;gap:10px;align-items:baseline\"><span style=\"font-family:ui-monospace,Menlo,monospace\">[ ??? ]<\u002Fspan><span>the chain broke between these two steps<\u002Fspan><\u002Fdiv>\n            <div style=\"color:#6b6b6b;padding-left:12px\">↓<\u002Fdiv>\n            <div><span style=\"color:oklch(45% 0.16 25)\">✕<\u002Fspan> Proposals merge <span style=\"color:#6b6b6b;font-size:14px\">(0 merges)<\u002Fspan><\u002Fdiv>\n            <div style=\"color:#6b6b6b;padding-left:12px\">↓<\u002Fdiv>\n            <div><span style=\"color:oklch(45% 0.16 25)\">✕<\u002Fspan> Three or fewer live proposals <span style=\"color:#6b6b6b;font-size:14px\">(still 6)<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 18px;font-size:16px\">\n            <span style=\"color:#6b6b6b;font-size:14px;letter-spacing:.06em;text-transform:uppercase;padding-top:2px\">Held<\u002Fspan><span>Explicitness → visibility. That part of the model is now <b>supported<\u002Fb>.<\u002Fspan>\n            <span style=\"color:#6b6b6b;font-size:14px;letter-spacing:.06em;text-transform:uppercase;padding-top:2px\">Broke<\u002Fspan><span>Visibility → merging. Marked <b>anomalous<\u002Fb>.<\u002Fspan>\n            <span style=\"color:#6b6b6b;font-size:14px;letter-spacing:.06em;text-transform:uppercase;padding-top:2px\">Interviews<\u002Fspan><span>Authors of overlapping proposals said they saw the overlap but rejected each other's account of <i>why<\u002Fi> the effect occurs. (4 interviews, Okafor)<\u002Fspan>\n          <\u002Fdiv>\n          <sc-if value=\"{{ notRevised }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"border:1.5px dashed #1c1c1c;border-radius:3px;padding:14px 16px;background:#fff;display:flex;flex-direction:column;gap:12px\">\n              <div style=\"font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#6b6b6b\">What was missing between “overlap is visible” and “proposals merge”?<\u002Fdiv>\n              <textarea value=\"{{ prose }}\" sc-camel-on-change=\"{{ setProse }}\" rows=\"3\" style=\"width:100%;box-sizing:border-box;border:1.5px solid #1c1c1c;border-radius:3px;padding:10px 12px;background:#fff;resize:vertical;line-height:1.4\"><\u002Ftextarea>\n              <sc-if value=\"{{ notInterpreted }}\" hint-placeholder-val=\"{{ true }}\"><div><button sc-camel-on-click=\"{{ interpret }}\" style=\"border:1.5px solid #1c1c1c;border-radius:3px;padding:5px 16px;background:oklch(55% 0.16 145);color:#fff\">Read it back to me →<\u002Fbutton><\u002Fdiv><\u002Fsc-if>\n              <sc-if value=\"{{ interpreted }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 18px;font-size:16px;border-top:1px dashed #b5b2ab;padding-top:10px\">\n                  <span style=\"color:#6b6b6b;font-size:14px;letter-spacing:.06em;text-transform:uppercase;padding-top:2px\">New condition<\u002Fspan><span style=\"border-bottom:2px solid oklch(55% 0.16 145);display:inline-block\">Authors disagree about the causes themselves, not only about remedies.<\u002Fspan>\n                  <span style=\"color:#6b6b6b;font-size:14px;letter-spacing:.06em;text-transform:uppercase;padding-top:2px\">Sits between<\u002Fspan><span>“Proposals are argued as remedies…” → <b>new<\u002Fb> → “No proposal can be shown to address what another addresses”<\u002Fspan>\n                  <span style=\"color:#6b6b6b;font-size:14px;letter-spacing:.06em;text-transform:uppercase;padding-top:2px\">Old link<\u002Fspan><span>Marked <b>revised<\u002Fb>, kept in history with its prediction and observation.<\u002Fspan>\n                  <span style=\"color:#6b6b6b;font-size:14px;letter-spacing:.06em;text-transform:uppercase;padding-top:2px\">Status<\u002Fspan><span>Working hypothesis. Two new links, both untested.<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"font-size:15px;color:#6b6b6b\">Nothing has changed yet. Revising moves the constraint: the new account must be validated before anyone intervenes.<\u002Fdiv>\n                <div style=\"display:flex;justify-content:flex-end;gap:10px\"><button sc-camel-on-click=\"{{ reinterpret }}\" style=\"border:1.5px solid #1c1c1c;border-radius:3px;padding:5px 16px;background:#fff\">← Say it differently<\u002Fbutton><button sc-camel-on-click=\"{{ revise }}\" style=\"border:1.5px solid #1c1c1c;border-radius:3px;padding:5px 16px;background:oklch(55% 0.16 145);color:#fff\">Revise the model<\u002Fbutton><\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ revised }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;flex-wrap:wrap;gap:10px;align-items:center;border-top:1.5px solid #1c1c1c;padding-top:14px\"><span style=\"border:1.5px solid #1c1c1c;border-radius:3px;padding:1px 10px;font-size:15px;background:#fff\">Revised · model v3 · Sep 2026<\u002Fspan><button sc-camel-on-click=\"{{ goModel }}\" style=\"border:1.5px solid #1c1c1c;border-radius:3px;padding:5px 16px;background:oklch(55% 0.16 145);color:#fff\">See the revised model →<\u002Fbutton><\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <!-- NOTES -->\n    <div style=\"min-width:0;display:flex;flex-direction:column;gap:14px;font-size:15px\">\n      <div style=\"font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#6b6b6b;border-bottom:1.5px solid #1c1c1c;padding-bottom:4px\">This screen · {{ note.title }}<\u002Fdiv>\n      <div style=\"text-wrap:pretty\">{{ note.job }}<\u002Fdiv>\n      <ul style=\"margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px\">\n        <sc-for list=\"{{ note.points }}\" as=\"p\" hint-placeholder-count=\"3\"><li style=\"text-wrap:pretty\">{{ p }}<\u002Fli><\u002Fsc-for>\n      <\u002Ful>\n      <div style=\"font-size:14px;color:#6b6b6b;border-top:1px dashed #b5b2ab;padding-top:10px\">Try the loop: as Participant → Help resolve this → Read it back → Revise the model → click a disputed arrow → Update the model. Then sit as Steward → Show how we got here. Then Expert → conflict → an assumption → Propose → Adopt with this prediction → Work on this.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- CRITIQUE -->\n  <div style=\"padding:8px 24px 48px;max-width:980px;display:flex;flex-direction:column;gap:26px\">\n    <div style=\"font-size:13px;letter-spacing:.1em;text-transform:uppercase;border-bottom:1.5px solid #1c1c1c;padding-bottom:4px\">Requirements critique · what changed and why<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px 32px;font-size:16px\">\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <div style=\"font-size:20px\">One conception: the shared change model<\u002Fdiv>\n        <div style=\"text-wrap:pretty\">The previous prototype's primitive was a <b>question with a governed answer<\u002Fb>. This one's is a <b>goal with a causal account of why it is not yet reached<\u002Fb>, and a record of how that account has changed on contact with reality. Every screen is one face of that object: what is happening, why, what holds us back, why we have not fixed it, what could, what stops us, what happened. There is still no second object type. Proposals, challenges, predictions, observations and steps all modify one structure.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <div style=\"font-size:20px\">Convergence is the verb<\u002Fdiv>\n        <div style=\"text-wrap:pretty\">The old loop was propose → impact → consent. The new one is understand → find common ground → locate the disagreement → find its crux → test → revise. Each arrow carries a <b>Where we stand<\u002Fb> state: aligned, aligned under conditions, unresolved empirical question, unresolved value difference, misunderstanding resolved, decision despite disagreement. Consent is no longer taken as evidence of agreement. The design test for every feature: does it record what people think, or reduce the distance between their models?<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <div style=\"font-size:20px\">The constraint is the home screen<\u002Fdiv>\n        <div style=\"text-wrap:pretty\">Krug's self-evident screen, done by borrowing TOC's own discipline: do not spread attention evenly. The home screen names the goal, the one thing that currently constrains it, what is needed now, and one green button. The queue below it is the invalidation graph plus standing, as before, but its items are now drawn from the constraint. In the demo the constraint <i>moves<\u002Fi>: from an unrevised model after a failed prediction, to validating the revised model, to the conflict behind it.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <div style=\"font-size:20px\">Users speak prose; the commons keeps the structure<\u002Fdiv>\n        <div style=\"text-wrap:pretty\">Kept from the prototype and applied everywhere. Nobody is asked to build a Current Reality Tree, surface an assumption in a cloud, or draft a Prerequisite Tree. They are asked “does A cause B?”, “why do you believe choosing one prevents the other?”, “what was missing here?”, “what stops us doing it tomorrow?”. The system reads back its interpretation as something to correct, never as a form. The TOC names are a tweak, off by default.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <div style=\"font-size:20px\">Predictions are precommitments<\u002Fdiv>\n        <div style=\"text-wrap:pretty\">Causal claims already contain predictions; the design makes them explicit only where they matter: on the injection about to be adopted and on the chain around the constraint. Adoption is gated by two questions asked <i>before<\u002Fi> acting: what do we expect to see, what would make us reconsider. Belief and commitment are kept apart with six statuses: working hypothesis, prediction outstanding, supported, anomalous, revised, decision.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <div style=\"font-size:20px\">The asset is the epistemic delta, not the version<\u002Fdiv>\n        <div style=\"text-wrap:pretty\">“Show how we got here” replaces version history with four fields per event: believed, expected, observed, revised. When reality diverges, the screen says where the chain held and where it broke, not that a strategy failed. Revision reads as “v1 predicted, reality answered, the commons revised,” never as someone having been wrong. This is the institutional memory the forum post is missing: why an earlier model was abandoned.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px 32px;font-size:16px;border-top:1px dashed #b5b2ab;padding-top:20px\">\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <div style=\"font-size:20px\">Cut, and why<\u002Fdiv>\n        <ul style=\"margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px\">\n          <li>“Current answer” as the centre of the page. Answers still exist; they are what a validated, tested synthesis becomes, downstream of this loop.<\u002Fli>\n          <li>Object / Propose narrower scope as the conflict model. Replaced by diagnosing the link: does not cause, only when, hides rather than causes, holds pending test.<\u002Fli>\n          <li>Impact replay as the gate. Its role is taken by the Future Reality chain and the negative branch; replay returns once there are past decisions to replay.<\u002Fli>\n          <li>Tree diagrams, node editors, graph views. One vertical chain per screen, arrows as buttons. The tree is the substrate; the UI is a list.<\u002Fli>\n          <li>A general-purpose contribute button. Every contribution is anchored to an arrow, an assumption, a gap, or an obstacle.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <div style=\"font-size:20px\">Kept from the prototype<\u002Fdiv>\n        <ul style=\"margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px\">\n          <li>Seats and “Why you”; one green button per screen; the queue as the only entry point; “nothing has changed yet”; read-back before commit; adopt ≠ rewrite; history folded into the object.<\u002Fli>\n        <\u002Ful>\n        <div style=\"font-size:20px;margin-top:8px\">Open risks, hardest last<\u002Fdiv>\n        <ul style=\"margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px\">\n          <li>Recording model history and attaching predictions to claims: easy. Recording observations against predictions: manageable.<\u002Fli>\n          <li>Deciding whether an observation actually tests a prediction, and which part of the model should change when it fails: hard. The demo has a human say what was missing; the system only reads it back.<\u002Fli>\n          <li>Getting people to state predictions precisely enough beforehand that failure teaches anything. The precommitment screen is the whole defence. Measure how often “what would make us reconsider” is later argued away.<\u002Fli>\n          <li>Cold start: the home screen has nothing to constrain until there is a goal, effects, and a first causal chain. First weeks are stewarded.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showWhyMe&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Queue&quot;},&quot;tocNames&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Methodology&quot;}}\">\nclass Component extends DCLogic {\n  state = { seat: 'participant', screen: 'home', revised: false, revisedToast: false, sel: null, asm: null, ev: 2, interpreted: false, prose: '', resolved: {}, broken: {}, adopted: false, claimed: false,\n    expect: 'By March 2027 at least four of six claims have an agreed test, and at least two proposals have been withdrawn or merged on the results.',\n    weaken: 'Tests are agreed but their results are disputed after the fact, or all six claims survive their tests and six proposals remain.' };\n  G = '#1c1c1c'; M = '#6b6b6b'; GREEN = 'oklch(45% 0.16 145)'; AMBER = 'oklch(55% 0.16 60)'; RED = 'oklch(45% 0.16 25)';\n  SEATS = {\n    participant: { label: 'Participant', name: 'A. Reyes', panel: 'Member' },\n    expert: { label: 'Expert', name: 'Dr. L. Farah', panel: 'Institutional economics' },\n    owner: { label: 'Owner', name: 'Amina K.', panel: 'Owns the next step' },\n    observer: { label: 'Observer', name: 'N. Okafor', panel: 'Records observations' },\n    steward: { label: 'Steward', name: 'T. Nakamura', panel: 'Model steward' } };\n  NODES = {\n    n1: 'Members diagnose institutional failure from different disciplines (legal, economic, sociological)',\n    n2: 'Each diagnosis implies its own remedy',\n    n3: 'Proposals are argued as remedies, with the diagnosis left implicit',\n    n4: 'Authors disagree about the causes themselves, not only about remedies',\n    n5: 'No proposal can be shown to address what another addresses',\n    n6: 'Six proposals stay live; none is adopted or dropped',\n    root: 'WE CANNOT GIVE PARTNERS ONE COHERENT RESPONSE' };\n  LINKS = {\n    l1: { from: 'n1', to: 'n2', status: 'disputed', stand: 'Unresolved empirical question', standDetail: '3 accept, Farah objects', voices: 'Farah: “Members share a diagnosis and still want different remedies every month.” Reyes: “Only if the diagnosis comes with no theory of intervention.”', settle: 'Two named members with the same diagnosis and different remedies.', prose: 'You can share a diagnosis and still want different remedies. I see it every month. This only holds when the diagnosis already carries a theory of intervention.', rbKind: 'Only when', rbDetail: 'the diagnosis already implies a theory of intervention', rbLabel: 'conditional · only when the diagnosis implies an intervention', rbStand: 'Aligned under conditions' },\n    l2: { from: 'n2', to: 'n3', status: 'accepted', stand: 'Aligned', standDetail: '5 of 5', voices: 'No open objection.', settle: 'Nothing pending. Say what you see to reopen it.', prose: '', rbKind: 'Holds as stated', rbDetail: 'no condition added', rbLabel: 'accepted · 5 of 5', rbStand: 'Aligned' },\n    l3: { from: 'n3', to: 'n4', status: 'disputed', stand: 'Possible misunderstanding', standDetail: '“causes” vs “hides”', voices: 'Farah: “Leaving the diagnosis implicit does not create the disagreement about causes. It hides it.” Reyes: “Fair, but hiding it is why we did not notice for a year.”', settle: 'Agreeing the arrow means “conceals” rather than “produces”; the two may not disagree at all.', prose: 'Leaving the diagnosis implicit does not create the disagreement about causes. It hides it. So this is the reason we did not notice, not the reason it exists.', rbKind: 'Hides, not causes', rbDetail: 'the disagreement pre-exists; implicitness delayed discovering it', rbLabel: 'reworded · conceals rather than produces', rbStand: 'Misunderstanding resolved' },\n    l3old: { from: 'n3', to: 'n5', status: 'anomalous', stand: 'Anomalous', standDetail: 'prediction failed Aug 2026', voices: 'Okafor: “Overlaps became visible; nothing merged.”', settle: 'Say what was missing between the two steps (What actually happened).', prose: '', rbKind: '', rbDetail: '', rbLabel: '', rbStand: '' },\n    l4: { from: 'n4', to: 'n5', status: 'disputed', stand: 'Prediction outstanding', standDetail: 'added Sep 2026, untested', voices: 'Nobody has objected; nobody has tested it. Nakamura: “Treat as working hypothesis until the author interviews are in.”', settle: 'Six authors asked what evidence would make them drop their cause (the next step).', prose: 'Untested. But if authors disagree about causes, then by definition one proposal cannot be shown to address the effect another claims. You would need a shared account first.', rbKind: 'Holds, pending test', rbDetail: 'accepted as working hypothesis; the author interviews are the test', rbLabel: 'working hypothesis · test scheduled', rbStand: 'Aligned under conditions' },\n    l5: { from: 'n5', to: 'n6', status: 'accepted', stand: 'Aligned', standDetail: '5 of 5', voices: 'No open objection.', settle: 'Nothing pending. Say what you see to reopen it.', prose: '', rbKind: 'Holds as stated', rbDetail: 'no condition added', rbLabel: 'accepted · 5 of 5', rbStand: 'Aligned' },\n    l6: { from: 'n6', to: 'root', status: 'disputed', stand: 'Unresolved value difference?', standDetail: 'what partners need', voices: 'Nakamura: “Partners want one recommendation.” Reyes: “Partners want something they can act on; a structured set of three would do.”', settle: 'Ask two partners. If they differ, this is a value choice, and more argument will not settle it.', prose: 'Partners are not asking for one answer. They are asking for something they can act on. A structured set of three would do.', rbKind: 'Only when', rbDetail: 'partners require a single recommendation; a structured set of three may suffice', rbLabel: 'conditional · only when partners require one answer', rbStand: 'Aligned under conditions · value question logged' } };\n  ASMS = [\n    { id: 'a1', text: 'Remedies can only be compared against one agreed cause.', prose: 'If we do not agree what is causing the failure, how can we say one remedy is better than another? We would be comparing answers to different questions.', rb: 'Comparison needs a shared reference, and you take that reference to be the cause. It could instead be the test each cause implies: agree what evidence would count, and remedies become comparable while the causes stay plural.', ifTrue: 'The conflict dissolves. We do not need one diagnosis; we need agreed tests.', cta: 'Propose what could break the impasse →' },\n    { id: 'a2', text: 'Keeping diagnoses open means keeping all remedies open.', prose: 'Every diagnosis has its remedy attached. Drop a remedy and you have dropped its diagnosis.', rb: 'You treat diagnosis and remedy as one unit. The model already splits them (arrow 2). A remedy can fail its test while its diagnosis survives, and the reverse.', ifTrue: 'Remedies can be retired without closing a line of inquiry. Weakens the cloud but does not break it.', cta: 'Record this →' },\n    { id: 'a3', text: 'Partners need one recommendation rather than a structured set.', prose: 'Partners are busy. Give them six links and they read none.', rb: 'This is a claim about partners, not about us, and it is the same claim as the disputed last arrow of the model. It can be asked rather than argued.', ifTrue: 'Nothing changes until two partners are asked. Logged as an empirical question.', cta: 'Log as empirical question →' } ];\n  NOTES = {\n    home: { title: 'What constrains us now', job: 'Job: tell me the one place my attention moves the whole group forward.', points: ['Goal, constraint, needed now, one green button. The queue below is drawn from the constraint plus standing, with “Why you” on every item.', 'The constraint moves as the loop turns. Watch it change after Revise the model, and again once every arrow holds.', 'Pick a different seat above and the queue changes; the constraint does not. Everyone sees the same bottleneck.'] },\n    model: { title: 'Why this keeps happening', job: 'Job: modify a common causal account rather than post under a thread.', points: ['One vertical chain, arrows as buttons. Each arrow carries a Where-we-stand state, who says what, and what would settle it.', 'Prose in, read back as: does not cause, only when, hides rather than causes, holds pending test. Update the model changes one arrow.', 'Node tags are belief statuses (working hypothesis, supported, anomalous, revised), not truth claims.'] },\n    conflict: { title: 'Why we have not fixed it', job: 'Job: find the assumption that makes the conflict look necessary.', points: ['The cloud in plain words: both serve, we need, so some say; we also need, others say.', 'Assumptions are the only clickable things. The question is “why do you believe this?”, never “edit the cloud”.', 'Breaking an assumption leads directly to an injection. Weakening one is recorded. An empirical one is logged as a question.'] },\n    injection: { title: 'What could break the impasse', job: 'Job: adopt a change only after saying what reality should show.', points: ['The predicted chain and one negative branch are shown before the button, not after.', 'Two precommitment questions gate adoption: what we expect, what would make us reconsider. Observable-by and who records are part of the record.', 'Adoption makes the prediction outstanding. It does not make anything true.'] },\n    steps: { title: 'What stops us, what next', job: 'Job: turn the desired change into the one step that unblocks the rest.', points: ['Obstacles are listed as things stopping us tomorrow. The next step names why it is first, its owner, done-when, and what it makes possible.', 'One green button: Work on this. Its output attaches to the model as evidence on the relevant arrows.'] },\n    timeline: { title: 'How we got here', job: 'Job: remember why an earlier model was abandoned.', points: ['Four fields per event: believed, expected, observed, revised. Not a diff, not a version list.', 'Revision is attributed to the commons, not to a person. Model v1 predicted; reality answered.', 'Same object as the model screen, scrubbed backwards.'] },\n    diverged: { title: 'What actually happened', job: 'Job: say where the chain held, where it broke, and what was missing.', points: ['Observations are shown against the predicted chain, step by step. Held steps become supported; the broken one becomes anomalous.', 'The human names the missing condition in prose; the system reads back where it sits and what it changes.', 'Revise the model inserts the condition, marks the old link revised, and moves the constraint to validating the new account.'] } };\n  EVENTS = [\n    { date: 'Nov 2025', label: 'Goal stated, five effects collected', title: 'Goal and effects', believed: 'Six proposals were failing to converge because they had never been put side by side.', expected: 'Listing what is happening that should not be would show which proposals compete and which compose.', observed: 'Five undesirable effects, agreed by all. The list did not by itself show what competed with what.', revised: 'Built the first causal chain (model v1): proposals are not comparable because their causal claims are implicit.' },\n    { date: 'Jan 2026', label: 'Injection adopted: explicit causal claims', title: 'Model v1 · injection adopted', believed: 'Proposals do not merge because their causal claims are implicit, so overlaps are invisible.', expected: 'Once every proposal states its claim, overlaps become visible and proposals merge to three or fewer by Aug 2026. Would weaken: claims explicit, six remain.', observed: 'Outstanding until August.', revised: 'Nothing yet.' },\n    { date: 'Aug 2026', label: 'Prediction failed at overlap → merge', title: 'Observation · prediction failed', believed: 'Visibility of overlap is sufficient for merging.', expected: 'Three or fewer live proposals.', observed: 'Claims explicit (6 of 6). Four overlapping pairs flagged. Zero merges. Six live proposals. Interviews: authors saw the overlap and rejected each other’s account of why the effect occurs.', revised: 'Link “overlap visible → proposals merge” marked anomalous. Model v2 awaits the missing condition.' },\n    { date: 'Sep 2026', label: 'Model v3: disagreement about causes', title: 'Model v3 · revised', believed: 'Authors disagree about the causes themselves, not only about remedies.', expected: 'No prediction yet. The new links must be validated before an intervention is adopted.', observed: 'Nothing yet.', revised: 'Condition inserted between remedies-argued and not-comparable; old link kept as revised. Constraint moved to validating the model.' } ];\n  go(screen, extra) { this.setState({ screen, sel: null, asm: null, interpreted: false, revisedToast: false, ...(extra || {}) }); }\n  linkView(id) { const L = this.LINKS[id]; const r = this.state.resolved[id]; return { ...L, status: r ? 'resolved' : L.status, from: this.NODES[L.from], to: this.NODES[L.to] }; }\n  renderVals() {\n    const { seat, screen, revised, sel, asm, ev, interpreted, resolved, broken, adopted, claimed } = this.state;\n    const S = this.SEATS[seat];\n    const seats = Object.keys(this.SEATS).map(k => ({ label: this.SEATS[k].label, bg: k === seat ? this.G : '#fff', fg: k === seat ? '#fff' : this.G, pick: () => this.setState({ seat: k, screen: 'home', sel: null, asm: null, interpreted: false }) }));\n    const order = revised ? ['n1', 'n2', 'n3', 'n4', 'n5', 'n6', 'root'] : ['n1', 'n2', 'n3', 'n5', 'n6', 'root'];\n    const linkOf = revised ? { n1: 'l1', n2: 'l2', n3: 'l3', n4: 'l4', n5: 'l5', n6: 'l6' } : { n1: 'l1', n2: 'l2', n3: 'l3old', n5: 'l5', n6: 'l6' };\n    const disputedIds = Object.keys(linkOf).map(k => linkOf[k]).filter(id => this.LINKS[id].status !== 'accepted' && !resolved[id]);\n    const disputedCount = disputedIds.length;\n    const STY = { accepted: [this.M, 'solid', 'transparent', 'accepted · 5 of 5'], disputed: [this.AMBER, 'dashed', '#fff', '⚠ disputed · say what you see'], anomalous: [this.RED, 'dashed', '#fff', '✕ anomalous · prediction failed Aug 2026'], resolved: [this.GREEN, 'solid', '#fff', ''] };\n    const chain = order.map((nid, i) => {\n      const lid = linkOf[nid]; const L = lid ? this.LINKS[lid] : null; const st = lid ? (resolved[lid] ? 'resolved' : L.status) : null;\n      const s = st ? STY[st] : null;\n      const isRoot = nid === 'root';\n      return { text: this.NODES[nid], size: isRoot ? '18px' : '16px', bg: isRoot ? '#fff' : (nid === 'n4' ? '#fff' : '#f7f5f0'),\n        tag: isRoot ? 'the effect we set out to remove' : nid === 'n4' ? 'revised · Sep 2026 · working hypothesis' : (nid === 'n1' || nid === 'n2' || nid === 'n3') ? 'supported' : 'working hypothesis',\n        tagColor: nid === 'n4' ? this.GREEN : this.M,\n        hasLink: !!lid, linkLabel: s ? (st === 'resolved' ? '✓ ' + L.rbLabel + ' · ' + L.rbStand : s[3]) : '', linkColor: s ? s[0] : this.M, linkBorder: s ? s[1] : 'solid', linkBg: s ? s[2] : 'transparent',\n        pick: () => this.setState({ sel: lid, interpreted: false, prose: this.LINKS[lid].prose }) };\n    });\n    const selV = sel ? this.linkView(sel) : null;\n    const selOut = selV ? { ...selV, open: !resolved[sel] && sel !== 'l3old', closed: !!resolved[sel], stand: resolved[sel] ? selV.rbStand : selV.stand, standDetail: resolved[sel] ? 'updated today' : selV.standDetail } : {};\n    const asmV = asm ? this.ASMS.find(a => a.id === asm) : null;\n    const assumptions = this.ASMS.map(a => ({ ...a, mark: broken[a.id] ? '✓' : '○', markColor: broken[a.id] ? this.GREEN : this.G, status: broken[a.id] ? (a.id === 'a1' ? 'broken → injection' : a.id === 'a2' ? 'weakened' : 'logged as question') : 'unchallenged', border: asm === a.id ? 'dashed' : 'solid', borderColor: asm === a.id ? this.G : 'transparent', bg: asm === a.id ? '#fff' : 'transparent', pick: () => this.setState({ asm: a.id, interpreted: false, prose: a.prose }) }));\n    const modelDone = revised && disputedCount === 0;\n    let constraint;\n    if (!revised) constraint = { text: 'Our January prediction failed in August. Overlaps between proposals became visible; none merged. The causal model has not been revised, so nobody can say what to change.', needed: 'Say what was missing between “overlap visible” and “proposals merge”.', meta: '1 observation · 4 interviews · 3 people who consented to the prediction', go: () => this.go('diverged', { prose: 'Seeing that two proposals address the same effect is not enough. The authors disagree about what causes the effect, so neither will fold into the other.' }) };\n    else if (!modelDone) constraint = { text: 'We have a revised account of why six proposals stay six, but ' + disputedCount + ' of its links are disputed. Until they hold, no intervention can be justified against it.', needed: 'Validate the causal model.', meta: disputedCount + ' disputed causal links · 3 people with relevant expertise', go: () => this.go('model') };\n    else if (!adopted) constraint = { text: 'The model holds. Behind it is a conflict: commit to one diagnosis, or keep six open. Three assumptions make it look necessary; none has been challenged.', needed: 'Challenge an assumption.', meta: '3 assumptions · 0 challenged', go: () => this.go('conflict') };\n    else constraint = { text: 'An injection is adopted with a prediction outstanding until March 2027. The next step has ' + (claimed ? 'an owner' : 'no owner') + '.', needed: claimed ? 'Nothing. Wait for reality.' : 'Own the next step.', meta: 'Prediction outstanding · observable by Mar 2027', go: () => this.go('steps') };\n    const stages = [\n      { key: 'model', q: 'What’s happening, why?' }, { key: 'home', q: 'What holds us back?' }, { key: 'conflict', q: 'Why not fixed?' }, { key: 'injection', q: 'What could break it?' }, { key: 'steps', q: 'What stops us? Next?' }, { key: 'diverged', q: 'What happened?' } ];\n    const hereKey = !revised ? 'diverged' : !modelDone ? 'model' : !adopted ? 'conflict' : 'steps';\n    const stagesV = stages.map(s => ({ q: s.q, here: s.key === hereKey ? '● here' : '', hereColor: screen === s.key ? '#fff' : this.GREEN, bg: screen === s.key ? this.G : 'transparent', fg: screen === s.key ? '#fff' : this.G, border: screen === s.key ? this.G : (s.key === hereKey ? this.GREEN : '#b5b2ab'), pick: () => this.go(s.key) }));\n    const queue = [];\n    const gm = () => this.go('model');\n    if (seat === 'participant') {\n      if (!revised) queue.push({ kind: 'Reality diverged', title: 'The prediction we made in January failed in August', detail: 'Overlaps became visible; proposals did not merge', why: 'you consented to the prediction', action: 'Say what was missing', go: constraint.go });\n      if (revised && !resolved.l3) queue.push({ kind: 'Disputed link', title: '“Argued as remedies → disagree about causes” is disputed', detail: 'Farah asks whether it causes the disagreement or hides it', why: 'you made the claim', action: 'Answer', go: () => this.go('model', { sel: 'l3', prose: this.LINKS.l3.prose }) });\n      if (adopted) queue.push({ kind: 'Prediction outstanding', title: 'Agree on the tests, not the causes · observable by Mar 2027', detail: 'Adopted with a precommitted prediction', why: 'you consented', action: 'Open', go: () => this.go('injection') });\n    } else if (seat === 'expert') {\n      if (revised && disputedCount) queue.push({ kind: 'Needs judgement', title: disputedCount + ' causal links are disputed in model v3', detail: 'Three are about mechanism, one about partners', why: 'institutional economics is what the links need', action: 'Judge', go: gm });\n      if (!revised) queue.push({ kind: 'Reality diverged', title: 'Model v1 broke at overlap → merge', detail: 'You raised the anomaly in July', why: 'you raised it', action: 'Say what was missing', go: constraint.go });\n      if (modelDone && !adopted) queue.push({ kind: 'Conflict', title: '“Commit to one diagnosis” vs “keep six open”', detail: '3 assumptions, none challenged', why: 'you hold the economic diagnosis', action: 'Challenge one', go: () => this.go('conflict') });\n    } else if (seat === 'owner') {\n      queue.push({ kind: claimed ? 'You own this' : 'Next necessary step', title: 'Ask each author: what evidence would make you drop your cause?', detail: 'Done when six answers are recorded against six claims', why: 'you volunteered for the author interviews', action: claimed ? 'Open' : 'Work on this', go: () => this.go('steps') });\n    } else if (seat === 'observer') {\n      if (!revised) queue.push({ kind: 'Observation recorded', title: 'Aug 2026: prediction failed at overlap → merge', detail: 'The model has not been revised', why: 'you recorded it', action: 'Open', go: constraint.go });\n      if (adopted) queue.push({ kind: 'Prediction outstanding', title: 'Record observations by Mar 2027', detail: 'Signal: ≥4 agreed tests; ≥2 proposals withdrawn or merged', why: 'you record observations', action: 'Open', go: () => this.go('injection') });\n    } else {\n      queue.push({ kind: revised ? 'Constraint moved' : 'Constraint', title: revised ? 'The constraint is now the causal model (' + disputedCount + ' disputed links)' : 'The constraint is an unrevised model after a failed prediction', detail: 'Model v' + (revised ? 3 : 2), why: 'you steward the model', action: 'See how we got here', go: () => this.go('timeline') });\n      queue.push({ kind: 'Conflict surfaced', title: '“Commit to one diagnosis” vs “keep all six open”', detail: '3 assumptions, ' + Object.keys(broken).length + ' challenged', why: 'stewards check the cloud is well-formed', action: 'Open', go: () => this.go('conflict') });\n    }\n    const events = (revised ? this.EVENTS : this.EVENTS.slice(0, 3)).map((e, i) => ({ ...e, dot: i === ev ? this.G : '#fff', pick: () => this.setState({ ev: i }) }));\n    const evV = this.EVENTS[Math.min(ev, events.length - 1)];\n    const obstacles = [\n      { mark: '✓', color: this.GREEN, text: 'No list of the causal claims being contested', status: 'model v3 lists six' },\n      { mark: '○', color: this.G, text: 'Authors have not said what would change their minds', status: 'next step' },\n      { mark: '○', color: this.G, text: 'Nobody owns collecting the answers', status: claimed ? 'Amina K.' : 'unowned' },\n      { mark: '○', color: this.G, text: 'Some claims may have no test that fits in six months', status: 'decide per claim' } ];\n    return {\n      seats, seat: S, version: revised ? 3 : 2, stages: stagesV, constraint, queue, queueCount: queue.length, queueEmpty: queue.length === 0,\n      showWhyMe: this.props.showWhyMe ?? true, tocNames: this.props.tocNames ?? false,\n      isHome: screen === 'home', notHome: screen !== 'home', isModel: screen === 'model', isConflict: screen === 'conflict', isInjection: screen === 'injection', isSteps: screen === 'steps', isTimeline: screen === 'timeline', isDiverged: screen === 'diverged',\n      goHome: e => { e.preventDefault(); this.go('home'); }, goTimeline: e => { e.preventDefault(); this.go('timeline'); }, goModel: gm, goConflict: () => this.go('conflict'), goSteps: () => this.go('steps'),\n      disputedLine: disputedCount ? disputedCount + ' of ' + Object.keys(linkOf).length + ' arrows are disputed.' : 'Every arrow holds.', disputedCount, revisedToast: this.state.revisedToast,\n      chain, hasSel: !!sel, sel: selOut, modelDone,\n      prose: this.state.prose, setProse: e => this.setState({ prose: e.target.value }),\n      interpreted, notInterpreted: !interpreted, interpret: () => this.setState({ interpreted: true }), reinterpret: () => this.setState({ interpreted: false }),\n      updateLink: () => this.setState(s => ({ resolved: { ...s.resolved, [sel]: true }, interpreted: false })),\n      assumptions, hasAsm: !!asm, asm: asmV || {},\n      breakAsm: () => { const id = asm; this.setState(s => ({ broken: { ...s.broken, [id]: true } })); if (id === 'a1') this.go('injection'); else this.setState({ asm: null, interpreted: false }); },\n      injectionBy: (this.state.broken.a1 ? S.name : 'Dr. L. Farah') + ', breaking assumption 1',\n      expect: this.state.expect, setExpect: e => this.setState({ expect: e.target.value }), weaken: this.state.weaken, setWeaken: e => this.setState({ weaken: e.target.value }),\n      adopted, notAdopted: !adopted, adopt: () => this.setState({ adopted: true }),\n      obstacles, stepOwner: claimed ? 'Amina K.' : 'nobody yet', claimed, notClaimed: !claimed, claim: () => this.setState({ claimed: true }),\n      events, ev: evV,\n      revised, notRevised: !revised, revise: () => this.setState({ revised: true, screen: 'model', interpreted: false, sel: null, revisedToast: true, ev: 3 }),\n      note: this.NOTES[screen] };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
