  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';

      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));

    // events at the element — warn only; real JS errors carry message/error.

        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;

      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss

        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }

        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];

        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();

            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;

            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }

        console.error('Failed to decode asset ' + uuid + ':', err);

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];

    for (const entry of extResources) {

    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

o\">\n<span style=\"font-size:15px;font-weight:600;letter-spacing:-.01em\">A better review process<\u002Fspan>\n<span style=\"font-size:11.5px;color:rgba(23,23,26,.6)\">Kestrel team · 5 people · agreed version 18<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:7px\">\n<span style=\"font:600 10.5px/1 'Libre Franklin';letter-spacing:.09em;text-transform:uppercase;color:rgba(23,23,26,.6)\">Detail<\u002Fspan>\n<div style=\"display:flex;border:1px solid rgba(23,23,26,.15);border-radius:5px;overflow:hidden\">\n<span sc-camel-on-click=\"{{ setPlain }}\" style=\"padding:5px 11px;font-size:12.5px;font-weight:500;cursor:pointer;background:{{ plainBg }};color:{{ plainFg }}\">Plain<\u002Fspan>\n<span sc-camel-on-click=\"{{ setFull }}\" style=\"padding:5px 11px;font-size:12.5px;font-weight:500;cursor:pointer;border-left:1px solid rgba(23,23,26,.15);background:{{ fullBg }};color:{{ fullFg }}\">Full record<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-wrap:wrap;gap:2px;padding:8px 14px;border-bottom:1px solid rgba(23,23,26,.11);background:#fff\">\n<sc-for list=\"{{ navItems }}\" as=\"item\" hint-placeholder-count=\"6\">\n<span sc-camel-on-click=\"{{ item.go }}\" style=\"display:flex;align-items:baseline;gap:6px;padding:6px 11px;border-radius:5px;font-size:13.5px;cursor:pointer;background:{{ item.bg }};color:{{ item.fg }};font-weight:{{ item.fw }}\">{{ item.label }}<span style=\"font-size:10.5px;font-weight:600;letter-spacing:.04em;color:{{ item.cfg }}\">{{ item.count }}<\u002Fspan><\u002Fspan>\n<\u002Fsc-for>\n<\u002Fdiv>\n\n<sc-if value=\"{{ isNow }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display:flex;flex-wrap:wrap;align-items:flex-start;gap:0\">\n<div style=\"flex:1 1 560px;min-width:0;padding:22px 24px 26px;display:flex;flex-direction:column;gap:16px\">\n<div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:12px\">\n<span style=\"font:600 10.5px/1 'Libre Franklin';letter-spacing:.1em;text-transform:uppercase;color:rgba(23,23,26,.6)\">What needs you now<\u002Fspan>\n<span style=\"font-size:11.5px;color:rgba(23,23,26,.6)\">1 of 6 · the rest can wait<\u002Fspan>\n<\u002Fdiv>\n\n<div style=\"background:#fff;border:1px solid rgba(156,54,32,.35);border-top:3px solid #9c3620;border-radius:6px;padding:18px 20px 17px;display:flex;flex-direction:column;gap:11px\">\n<span style=\"font:600 10.5px/1 'Libre Franklin';letter-spacing:.09em;text-transform:uppercase;color:#9c3620\">Reality disagreed<\u002Fspan>\n<span style=\"font-size:23px;line-height:1.28;font-weight:500;letter-spacing:-.015em;text-wrap:pretty\">“Naming an owner cuts the wait before a review starts.”<\u002Fspan>\n<span style=\"font-size:14.5px;line-height:1.5;color:rgba(23,23,26,.66);max-width:62ch;text-wrap:pretty\">Your check-in on 12 September came out against this. The claim is still in the model and still says what it always said — nothing was rewritten on your behalf. What it needs is your judgement about why.<\u002Fspan>\n<div style=\"display:flex;flex-wrap:wrap;gap:6px;padding-top:2px\">\n<span style=\"font-size:11.5px;padding:3px 9px;border:1px solid rgba(23,23,26,.14);border-radius:20px;color:rgba(23,23,26,.6)\">The test was fair<\u002Fspan>\n<span style=\"font-size:11.5px;padding:3px 9px;border:1px solid rgba(23,23,26,.14);border-radius:20px;color:rgba(23,23,26,.6)\">Rests on 2 agreed ideas<\u002Fspan>\n<span style=\"font-size:11.5px;padding:3px 9px;border:1px solid rgba(23,23,26,.14);border-radius:20px;color:rgba(23,23,26,.6)\">3 steps lean on it<\u002Fspan>\n<\u002Fdiv>\n<sc-if value=\"{{ full }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:rgba(23,23,26,.11);border:1px solid rgba(23,23,26,.11);border-radius:5px;overflow:hidden;margin-top:2px\">\n<div style=\"background:#fbfaf7;padding:9px 11px;display:flex;flex-direction:column;gap:2px\"><span style=\"font:600 9.5px/1 'Libre Franklin';letter-spacing:.09em;text-transform:uppercase;color:rgba(23,23,26,.6)\">Test validity<\u002Fspan><span style=\"font-size:13px\">conforming<\u002Fspan><\u002Fdiv>\n<div style=\"background:#fbfaf7;padding:9px 11px;display:flex;flex-direction:column;gap:2px\"><span style=\"font:600 9.5px/1 'Libre Franklin';letter-spacing:.09em;text-transform:uppercase;color:rgba(23,23,26,.6)\">Prediction result<\u002Fspan><span style=\"font-size:13px\">mismatched · mechanical<\u002Fspan><\u002Fdiv>\n<div style=\"background:#fbfaf7;padding:9px 11px;display:flex;flex-direction:column;gap:2px\"><span style=\"font:600 9.5px/1 'Libre Franklin';letter-spacing:.09em;text-transform:uppercase;color:rgba(23,23,26,.6)\">Model impact<\u002Fspan><span style=\"font-size:13px\">not yet judged<\u002Fspan><\u002Fdiv>\n<div style=\"background:#fbfaf7;padding:9px 11px;display:flex;flex-direction:column;gap:2px\"><span style=\"font:600 9.5px/1 'Libre Franklin';letter-spacing:.09em;text-transform:uppercase;color:rgba(23,23,26,.6)\">Localised to<\u002Fspan><span style=\"font-size:13px\">owner named → wait falls<\u002Fspan><\u002Fdiv>\n<div style=\"background:#fbfaf7;padding:9px 11px;display:flex;flex-direction:column;gap:2px\"><span style=\"font:600 9.5px/1 'Libre Franklin';letter-spacing:.09em;text-transform:uppercase;color:rgba(23,23,26,.6)\">Sealed against<\u002Fspan><span style=\"font-size:13px\">version 16 · 9 Sep<\u002Fspan><\u002Fdiv>\n<div style=\"background:#fbfaf7;padding:9px 11px;display:flex;flex-direction:column;gap:2px\"><span style=\"font:600 9.5px/1 'Libre Franklin';letter-spacing:.09em;text-transform:uppercase;color:rgba(23,23,26,.6)\">Reliance<\u002Fspan><span style=\"font-size:13px\">caution · not suspended<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:9px;padding-top:4px\">\n<span sc-camel-on-click=\"{{ go.act }}\" style=\"background:#4a3f8f;color:#fff;padding:9px 15px;border-radius:5px;font-size:13.5px;font-weight:500;cursor:pointer\">See what happened<\u002Fspan>\n<span sc-camel-on-click=\"{{ go.decide }}\" style=\"border:1px solid rgba(23,23,26,.22);padding:8px 14px;border-radius:5px;font-size:13.5px;font-weight:500;cursor:pointer\">Revise the claim<\u002Fspan>\n<span sc-camel-on-click=\"{{ go.think }}\" style=\"border:1px solid rgba(23,23,26,.22);padding:8px 14px;border-radius:5px;font-size:13.5px;font-weight:500;cursor:pointer\">Talk it through<\u002Fspan>\n<span style=\"font-size:13px;color:rgba(23,23,26,.6);cursor:pointer;margin-left:2px\">Not now<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:9px\">\n<span style=\"font:600 10.5px/1 'Libre Franklin';letter-spacing:.1em;text-transform:uppercase;color:rgba(23,23,26,.6)\">Also waiting<\u002Fspan>\n<div style=\"background:#fff;border:1px solid rgba(23,23,26,.11);border-radius:6px;overflow:hidden\">\n<sc-for list=\"{{ waiting }}\" as=\"w\" hint-placeholder-count=\"5\">\n<div sc-camel-on-click=\"{{ w.go }}\" style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:12px;padding:12px 16px;border-top:1px solid rgba(23,23,26,.08);cursor:pointer\">\n<span style=\"width:88px;flex:none;font:600 10px/1.3 'Libre Franklin';letter-spacing:.08em;text-transform:uppercase;color:rgba(23,23,26,.6)\">{{ w.kind }}<\u002Fspan>\n<span style=\"flex:1 1 240px;min-width:0;font-size:14.5px;line-height:1.4\">{{ w.text }}<\u002Fspan>\n<span style=\"font-size:11.5px;color:rgba(23,23,26,.6)\">{{ w.meta }}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<span style=\"font-size:12.5px;color:rgba(23,23,26,.6);line-height:1.5\">Six things want you. One of them is holding up three people. That is the only reason it is at the top.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"flex:0 1 316px;min-width:260px;align-self:stretch;border-left:1px solid rgba(23,23,26,.11);background:#fff;padding:22px 20px;display:flex;flex-direction:column;gap:20px\">\n<div style=\"display:flex;flex-direction:column;gap:7px\">\n<span style=\"font:600 10.5px/1 'Libre Franklin';letter-spacing:.1em;text-transform:uppercase;color:rgba(23,23,26,.6)\">What we are after<\u002Fspan>\n<span style=\"font-size:15px;line-height:1.45;font-weight:500\">Code review stops being the reason work waits.<\u002Fspan>\n<div style=\"border:1px solid rgba(74,63,143,.28);background:#f4f3fa;border-radius:6px;padding:11px 12px;display:flex;flex-direction:column;gap:3px\">\n<span style=\"font-size:13.5px;font-weight:600;color:#3a3175\">11 reviews finished a week<\u002Fspan>\n<span style=\"font-size:12px;color:rgba(23,23,26,.6);line-height:1.45\">up from 9 when we started · counted on merge<\u002Fspan>\n<sc-if value=\"{{ full }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:11.5px;color:rgba(23,23,26,.5);line-height:1.45;border-top:1px solid rgba(74,63,143,.2);padding-top:6px;margin-top:3px\">Boundary: from first review request to merge. Counted once, at merge. Read from GitHub. Agreed 14 Aug by Dana.<\u002Fspan><\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:9px\">\n<span style=\"font:600 10.5px/1 'Libre Franklin';letter-spacing:.1em;text-transform:uppercase;color:rgba(23,23,26,.6)\">What reality has said<\u002Fspan>\n<div style=\"display:flex;flex-direction:column;gap:10px\">\n<div style=\"display:flex;gap:9px\"><span style=\"width:3px;flex:none;background:#3f6b56;border-radius:2px\"><\u002Fspan><div style=\"display:flex;flex-direction:column;gap:1px\"><span style=\"font-size:13.5px;line-height:1.4\">Reviewers do claim work when the queue is re-read each morning<\u002Fspan><span style=\"font-size:11.5px;color:rgba(23,23,26,.6)\">agreed with it · 2 check-ins<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;gap:9px\"><span style=\"width:3px;flex:none;background:#9c3620;border-radius:2px\"><\u002Fspan><div style=\"display:flex;flex-direction:column;gap:1px\"><span style=\"font-size:13.5px;line-height:1.4\">Naming an owner cuts the wait before a review starts<\u002Fspan><span style=\"font-size:11.5px;color:#9c3620\">disagreed with it · 12 Sep<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;gap:9px\"><span style=\"width:3px;flex:none;background:rgba(23,23,26,.2);border-radius:2px\"><\u002Fspan><div style=\"display:flex;flex-direction:column;gap:1px\"><span style=\"font-size:13.5px;line-height:1.4\">Rotas survive a busy week<\u002Fspan><span style=\"font-size:11.5px;color:rgba(23,23,26,.6)\">nothing risked on it yet<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<span sc-camel-on-click=\"{{ go.learn }}\" style=\"font-size:12.5px;color:#4a3f8f;cursor:pointer;text-decoration:underline\">How fast are we finding out?<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isThink }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:flex;flex-wrap:wrap;align-items:stretch;gap:0\">\n<div style=\"flex:1 1 560px;min-width:0;padding:22px 24px;display:flex;flex-direction:column;gap:18px\">\n<div style=\"display:flex;flex-direction:column;gap:4px\">\n<span style=\"font-size:14.5px;line-height:1.45;color:rgba(23,23,26,.5)\">Tue 16 Sep · you and the thinking partner<\u002Fspan>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:5px;max-width:64ch\">\n<span style=\"font:600 10.5px/1 'Libre Franklin';letter-spacing:.08em;text-transform:uppercase;color:rgba(23,23,26,.6)\">You · 9:14<\u002Fspan>\n<span style=\"font-size:16px;line-height:1.5;text-wrap:pretty\">Nobody knows which reviews are urgent, so they just sit there. Then someone shouts and it jumps the queue.<\u002Fspan>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:6px;max-width:64ch\">\n<span style=\"font:600 10.5px/1 'Libre Franklin';letter-spacing:.08em;text-transform:uppercase;color:rgba(23,23,26,.6)\">Thinking partner<\u002Fspan>\n<span style=\"font-size:16px;line-height:1.5;text-wrap:pretty\">That is two things: something unwanted that is happening now, and a cause you are already pointing at. Carry on in your own words — I have put a suggestion below that you can keep, reword, or throw away.<\u002Fspan>\n<span style=\"font-size:12px;color:rgba(23,23,26,.6);cursor:pointer\">▸ Looked at the method library (3 passages) and your model (2 ideas) · 1.8s<\u002Fspan>\n<\u002Fdiv>\n\n<div style=\"background:#fff;border:1px solid rgba(23,23,26,.14);border-left:3px solid #4a3f8f;border-radius:6px;padding:15px 17px;display:flex;flex-direction:column;gap:12px;max-width:64ch\">\n<div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:8px\">\n<span style=\"font:600 10.5px/1 'Libre Franklin';letter-spacing:.09em;text-transform:uppercase;color:#4a3f8f\">Suggested · not in the model yet<\u002Fspan>\n<span style=\"font-size:11.5px;color:rgba(23,23,26,.6)\">belongs with what is in the way today<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:6px\">\n<span style=\"border:1px solid rgba(23,23,26,.16);border-radius:5px;padding:9px 12px;font-size:15px;line-height:1.4;background:#fbfaf7\">Review urgency is unclear<\u002Fspan>\n<span style=\"font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:rgba(23,23,26,.6);padding-left:12px\">leads to<\u002Fspan>\n<span style=\"border:1px solid rgba(23,23,26,.16);border-radius:5px;padding:9px 12px;font-size:15px;line-height:1.4;background:#fbfaf7\">Reviews sit unclaimed for days<\u002Fspan>\n<\u002Fdiv>\n<span style=\"font-size:14px;line-height:1.5;color:rgba(23,23,26,.66)\">Only holds if nobody re-reads the queue once a review is filed. <span style=\"color:rgba(23,23,26,.6)\">You can argue with that later without pulling the link out.<\u002Fspan><\u002Fspan>\n<sc-if value=\"{{ full }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:flex;flex-direction:column;gap:4px;border-top:1px solid rgba(23,23,26,.1);padding-top:10px\">\n<span style=\"font-size:12px;color:rgba(23,23,26,.55)\"><strong style=\"font-weight:600\">Kind:<\u002Fstrong> proposition + role (undesirable effect) + relationship, with its assumption. Three decisions, not one.<\u002Fspan>\n<span style=\"font-size:12px;color:rgba(23,23,26,.55)\"><strong style=\"font-weight:600\">Prerequisites:<\u002Fstrong> none. <strong style=\"font-weight:600\">Prompted by:<\u002Fstrong> your message of 9:14. <strong style=\"font-weight:600\">Would take the model to<\u002Fstrong> version 19.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-if>\n<div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:9px\">\n<span sc-camel-on-click=\"{{ go.decide }}\" style=\"background:#4a3f8f;color:#fff;padding:8px 14px;border-radius:5px;font-size:13.5px;font-weight:500;cursor:pointer\">Keep it<\u002Fspan>\n<span style=\"border:1px solid rgba(23,23,26,.22);padding:7px 13px;border-radius:5px;font-size:13.5px;font-weight:500;cursor:pointer\">Say it my way<\u002Fspan>\n<span style=\"font-size:13px;color:rgba(23,23,26,.6);cursor:pointer\">Not this<\u002Fspan>\n<span style=\"font-size:12px;color:rgba(23,23,26,.6);margin-left:auto\">Nothing enters the model until a person keeps it<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:5px;max-width:64ch\">\n<span style=\"font:600 10.5px/1 'Libre Franklin';letter-spacing:.08em;text-transform:uppercase;color:rgba(23,23,26,.6)\">You · 9:21<\u002Fspan>\n<span style=\"font-size:16px;line-height:1.5\">Careful — I think ownership matters more than urgency. Priya will disagree with me on that.<\u002Fspan>\n<\u002Fdiv>\n\n<div style=\"margin-top:auto;display:flex;flex-direction:column;gap:7px;padding-top:6px\">\n<div style=\"background:#fff;border:1px solid rgba(23,23,26,.16);border-radius:6px;padding:12px 14px;font-size:15px;color:rgba(23,23,26,.58)\">Keep going…<\u002Fdiv>\n<span style=\"font-size:12px;color:rgba(23,23,26,.6)\">Plain words are fine. You never have to name a thinking view or fill in a form.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"flex:0 1 288px;min-width:248px;border-left:1px solid rgba(23,23,26,.11);background:#fff;padding:22px 18px;display:flex;flex-direction:column;gap:14px\">\n<div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:8px\">\n<span style=\"font:600 10.5px/1 'Libre Franklin';letter-spacing:.1em;text-transform:uppercase;color:rgba(23,23,26,.6)\">Kept so far<\u002Fspan>\n<span style=\"font-size:11.5px;color:rgba(23,23,26,.6)\">11<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:4px\">\n<span style=\"font-size:11.5px;padding:3px 9px;border-radius:20px;background:#17171a;color:#fff\">In the way 6<\u002Fspan>\n<span style=\"font-size:11.5px;padding:3px 9px;border-radius:20px;border:1px solid rgba(23,23,26,.14);color:rgba(23,23,26,.6)\">After 2<\u002Fspan>\n<span style=\"font-size:11.5px;padding:3px 9px;border-radius:20px;border:1px solid rgba(23,23,26,.14);color:rgba(23,23,26,.6)\">Bind 0<\u002Fspan>\n<span style=\"font-size:11.5px;padding:3px 9px;border-radius:20px;border:1px solid rgba(23,23,26,.14);color:rgba(23,23,26,.6)\">Change 3<\u002Fspan>\n<span style=\"font-size:11.5px;padding:3px 9px;border-radius:20px;border:1px solid rgba(23,23,26,.14);color:rgba(23,23,26,.6)\">Needs 0<\u002Fspan>\n<span style=\"font-size:11.5px;padding:3px 9px;border-radius:20px;border:1px solid rgba(23,23,26,.14);color:rgba(23,23,26,.6)\">Steps 0<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:11px\">\n<div style=\"display:flex;gap:8px\"><span style=\"width:3px;flex:none;background:rgba(23,23,26,.22);border-radius:2px\"><\u002Fspan><span style=\"font-size:13.5px;line-height:1.4\">Review priority is unclear<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;gap:8px\"><span style=\"width:3px;flex:none;background:#9c3620;border-radius:2px\"><\u002Fspan><div style=\"display:flex;flex-direction:column;gap:1px\"><span style=\"font-size:13.5px;line-height:1.4\">Naming an owner cuts the wait<\u002Fspan><span style=\"font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#9c3620\">reality disagreed<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;gap:8px\"><span style=\"width:3px;flex:none;background:rgba(23,23,26,.22);border-radius:2px\"><\u002Fspan><div style=\"display:flex;flex-direction:column;gap:1px\"><span style=\"font-size:13.5px;line-height:1.4\">Ownership is the main cause of delay<\u002Fspan><span style=\"font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:rgba(23,23,26,.5)\">Priya doubts this<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;gap:8px\"><span style=\"width:3px;flex:none;background:rgba(23,23,26,.22);border-radius:2px\"><\u002Fspan><span style=\"font-size:13.5px;line-height:1.4\">Reviews sit unclaimed for days<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<span sc-camel-on-click=\"{{ go.model }}\" style=\"font-size:12.5px;color:#4a3f8f;cursor:pointer;text-decoration:underline\">Read the whole model<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isModel }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"padding:22px 24px 28px;display:flex;flex-direction:column;gap:16px\">\n<div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:12px\">\n<div style=\"display:flex;border:1px solid rgba(23,23,26,.15);border-radius:5px;overflow:hidden;background:#fff\">\n<span sc-camel-on-click=\"{{ setWritten }}\" style=\"padding:6px 13px;font-size:13px;font-weight:500;cursor:pointer;background:{{ writtenBg }};color:{{ writtenFg }}\">As an account<\u002Fspan>\n<span sc-camel-on-click=\"{{ setDrawing }}\" style=\"padding:6px 13px;font-size:13px;font-weight:500;cursor:pointer;border-left:1px solid rgba(23,23,26,.15);background:{{ drawingBg }};color:{{ drawingFg }}\">As a drawing<\u002Fspan>\n<\u002Fdiv>\n<span style=\"font-size:12.5px;color:rgba(23,23,26,.5)\">Version 18 · agreed 15 Sep · nothing chosen, showing all 11 ideas<\u002Fspan>\n<span style=\"font-size:12.5px;color:#4a3f8f;cursor:pointer;text-decoration:underline;margin-left:auto\">See it as it stood at version 16<\u002Fspan>\n<\u002Fdiv>\n\n<sc-if value=\"{{ modelWritten }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start\">\n<div style=\"flex:1 1 520px;min-width:0;background:#fff;border:1px solid rgba(23,23,26,.11);border-radius:6px;padding:24px 28px;display:flex;flex-direction:column;gap:22px\">\n<div style=\"display:flex;flex-direction:column;gap:7px\">\n<span style=\"font:600 10.5px/1 'Libre Franklin';letter-spacing:.1em;text-transform:uppercase;color:rgba(23,23,26,.6)\">What we are after<\u002Fspan>\n<span style=\"font-size:18px;line-height:1.5;max-width:66ch;text-wrap:pretty\">Code review stops being the reason work waits. For that to count, <span style=\"border-bottom:1px dotted rgba(23,23,26,.6)\">reviewers must not be worse off<\u002Fspan> and <span style=\"border-bottom:1px dotted rgba(23,23,26,.6)\">quality must not drop<\u002Fspan>.<sc-if value=\"{{ full }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:13px;color:rgba(23,23,26,.5)\"> — goal + 2 necessary conditions, agreed v3, unchanged since.<\u002Fspan><\u002Fsc-if><\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:7px\">\n<span style=\"font:600 10.5px/1 'Libre Franklin';letter-spacing:.1em;text-transform:uppercase;color:rgba(23,23,26,.6)\">What is in the way today<\u002Fspan>\n<span style=\"font-size:18px;line-height:1.5;max-width:66ch;text-wrap:pretty\">Reviews sit unclaimed for days. We think that is because <strong style=\"font-weight:600\">review urgency is unclear<\u002Fstrong> — a filed review looks the same as an urgent one — and because <strong style=\"font-weight:600\">nobody owns the queue<\u002Fstrong>. <span style=\"background:#f7ece8;padding:1px 5px;border-radius:3px;color:#7d2b19;font-size:16px;white-space:nowrap\">Priya doubts the second<\u002Fspan>: she has seen the queue claimed quickly when the team was small, with no owner at all.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:7px\">\n<span style=\"font:600 10.5px/1 'Libre Franklin';letter-spacing:.1em;text-transform:uppercase;color:rgba(23,23,26,.6)\">What we would change<\u002Fspan>\n<span style=\"font-size:18px;line-height:1.5;max-width:66ch;text-wrap:pretty\">Publish a weekly review-owner rota, so that every open review has a named owner within a day. <span style=\"background:#f7ece8;padding:1px 5px;border-radius:3px;color:#7d2b19;font-size:16px\">Reality disagreed with the claim underneath this<\u002Fspan> on 12 September, and we have not yet said what that means for the rota.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:7px\">\n<span style=\"font:600 10.5px/1 'Libre Franklin';letter-spacing:.1em;text-transform:uppercase;color:rgba(23,23,26,.6)\">Not decided yet<\u002Fspan>\n<span style=\"font-size:18px;line-height:1.5;max-width:66ch;color:rgba(23,23,26,.55);text-wrap:pretty\">Nobody has written down the bind — what pulls us away from doing this — and there are no steps beyond the rota. Two suggestions are waiting in Decide.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:0 1 244px;min-width:220px;display:flex;flex-direction:column;gap:9px\">\n<span style=\"font:600 10.5px/1 'Libre Franklin';letter-spacing:.1em;text-transform:uppercase;color:rgba(23,23,26,.6)\">Jump to<\u002Fspan>\n<div style=\"background:#fff;border:1px solid rgba(23,23,26,.11);border-radius:6px;overflow:hidden\">\n<div style=\"padding:9px 12px;font-size:13.5px;border-top:1px solid rgba(23,23,26,.08)\">What we are after <span style=\"color:rgba(23,23,26,.6)\">3<\u002Fspan><\u002Fdiv>\n<div style=\"padding:9px 12px;font-size:13.5px;border-top:1px solid rgba(23,23,26,.08)\">In the way today <span style=\"color:rgba(23,23,26,.6)\">6<\u002Fspan><\u002Fdiv>\n<div style=\"padding:9px 12px;font-size:13.5px;border-top:1px solid rgba(23,23,26,.08);color:rgba(23,23,26,.6)\">The bind <span style=\"color:rgba(23,23,26,.6)\">0<\u002Fspan><\u002Fdiv>\n<div style=\"padding:9px 12px;font-size:13.5px;border-top:1px solid rgba(23,23,26,.08)\">What we would change <span style=\"color:rgba(23,23,26,.6)\">2<\u002Fspan><\u002Fdiv>\n<div style=\"padding:9px 12px;font-size:13.5px;border-top:1px solid rgba(23,23,26,.08);color:rgba(23,23,26,.6)\">What that needs <span style=\"color:rgba(23,23,26,.6)\">0<\u002Fspan><\u002Fdiv>\n<div style=\"padding:9px 12px;font-size:13.5px;border-top:1px solid rgba(23,23,26,.08)\">Steps <span style=\"color:rgba(23,23,26,.6)\">1<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<span style=\"font-size:12.5px;line-height:1.5;color:rgba(23,23,26,.5)\">Six purposes, one document. They are places in a page, not six screens to navigate.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ modelDrawing }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"background:#fff;border:1px solid rgba(23,23,26,.11);border-radius:6px;padding:20px;display:flex;flex-direction:column;gap:0\">\n<div style=\"display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding-bottom:14px;border-bottom:1px solid rgba(23,23,26,.09)\">\n<span style=\"font-size:13px;color:rgba(23,23,26,.55)\">Showing the whole model. Choose an idea to narrow it.<\u002Fspan>\n<span style=\"font-size:12.5px;padding:3px 9px;border:1px solid rgba(23,23,26,.14);border-radius:20px;color:rgba(23,23,26,.6)\">Marks: mine (3 of 11)<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column\">\n<div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:16px 0;border-bottom:1px solid rgba(23,23,26,.07)\">\n<span style=\"width:150px;flex:none;font:600 10.5px/1.3 'Libre Franklin';letter-spacing:.09em;text-transform:uppercase;color:rgba(23,23,26,.6)\">What we are after<\u002Fspan>\n<span style=\"border:1px solid rgba(23,23,26,.2);border-radius:5px;padding:8px 11px;font-size:14px;background:#fbfaf7\">Review stops being the reason work waits<\u002Fspan>\n<span style=\"color:rgba(23,23,26,.45)\">·<\u002Fspan>\n<span style=\"border:1px dashed rgba(23,23,26,.28);border-radius:5px;padding:8px 11px;font-size:14px;color:rgba(23,23,26,.6)\">Reviewers not worse off<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:16px 0;border-bottom:1px solid rgba(23,23,26,.07)\">\n<span style=\"width:150px;flex:none;font:600 10.5px/1.3 'Libre Franklin';letter-spacing:.09em;text-transform:uppercase;color:rgba(23,23,26,.6)\">In the way today<\u002Fspan>\n<span style=\"border:1px solid rgba(23,23,26,.2);border-radius:5px;padding:8px 11px;font-size:14px;background:#fbfaf7\">Urgency is unclear<\u002Fspan>\n<span style=\"font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:rgba(23,23,26,.6)\">leads to →<\u002Fspan>\n<span style=\"border:1px solid rgba(23,23,26,.2);border-radius:5px;padding:8px 11px;font-size:14px;background:#fbfaf7\">Reviews sit unclaimed<\u002Fspan>\n<span style=\"border:1px solid rgba(156,54,32,.4);border-left:3px solid #9c3620;border-radius:5px;padding:8px 11px;font-size:14px;background:#fdf7f5\">Nobody owns the queue <span style=\"font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:#9c3620\">doubted<\u002Fspan><\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:16px 0;border-bottom:1px solid rgba(23,23,26,.07)\">\n<span style=\"width:150px;flex:none;font:600 10.5px/1.3 'Libre Franklin';letter-spacing:.09em;text-transform:uppercase;color:rgba(23,23,26,.6)\">The bind<\u002Fspan>\n<span style=\"font-size:13.5px;color:rgba(23,23,26,.6)\">Nothing here yet. The partner will ask about it when the problem is clearer.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:16px 0;border-bottom:1px solid rgba(23,23,26,.07)\">\n<span style=\"width:150px;flex:none;font:600 10.5px/1.3 'Libre Franklin';letter-spacing:.09em;text-transform:uppercase;color:rgba(23,23,26,.6)\">What we would change<\u002Fspan>\n<span style=\"border:1px solid rgba(23,23,26,.2);border-radius:5px;padding:8px 11px;font-size:14px;background:#fbfaf7\">Weekly owner rota<\u002Fspan>\n<span style=\"border:1px dotted rgba(74,63,143,.5);border-radius:5px;padding:8px 11px;font-size:14px;color:#3a3175;background:#f4f3fa\">Suggested · re-read the queue each morning<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:16px 0\">\n<span style=\"width:150px;flex:none;font:600 10.5px/1.3 'Libre Franklin';letter-spacing:.09em;text-transform:uppercase;color:rgba(23,23,26,.6)\">Steps<\u002Fspan>\n<span style=\"border:1px solid rgba(23,23,26,.2);border-radius:5px;padding:8px 11px;font-size:14px;background:#fbfaf7\">Publish the rota <span style=\"font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:rgba(23,23,26,.6)\">Dana · ready<\u002Fspan><\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isDecide }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"padding:22px 24px 28px;display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start\">\n<div style=\"flex:1 1 560px;min-width:0;display:flex;flex-direction:column;gap:20px\">\n<div style=\"display:flex;flex-direction:column;gap:3px\">\n<span style=\"font-size:19px;font-weight:600;letter-spacing:-.015em\">What is ready to decide<\u002Fspan>\n<span style=\"font-size:13.5px;color:rgba(23,23,26,.55)\">4 ready · 2 waiting on something else · 1 needs another look. Deciding is the only way the model changes.<\u002Fspan>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:9px\">\n<span style=\"font:600 10.5px/1 'Libre Franklin';letter-spacing:.1em;text-transform:uppercase;color:rgba(23,23,26,.6)\">Ready now<\u002Fspan>\n<div style=\"background:#fff;border:1px solid rgba(23,23,26,.14);border-radius:6px;padding:17px 19px;display:flex;flex-direction:column;gap:14px\">\n<div style=\"display:flex;flex-direction:column;gap:4px\">\n<span style=\"font-size:16px;line-height:1.45;font-weight:500\">Your message of 9:14 became three separate things.<\u002Fspan>\n<span style=\"font-size:13.5px;color:rgba(23,23,26,.55)\">Decide them one at a time. Agreeing that something is true is not the same as agreeing what it is.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:1px;background:rgba(23,23,26,.1);border:1px solid rgba(23,23,26,.1);border-radius:5px;overflow:hidden\">\n<div style=\"background:#fbfaf7;padding:12px 13px;display:flex;flex-wrap:wrap;align-items:center;gap:11px\">\n<span style=\"flex:1 1 260px;min-width:0;font-size:14.5px;line-height:1.4\">“Review urgency is unclear” is true<\u002Fspan>\n<span style=\"border:1px solid rgba(23,23,26,.22);padding:5px 12px;border-radius:5px;font-size:13px;font-weight:500;cursor:pointer;background:#fff\">Agree<\u002Fspan>\n<span style=\"font-size:12.5px;color:rgba(23,23,26,.6);cursor:pointer\">No<\u002Fspan>\n<\u002Fdiv>\n<div style=\"background:#fbfaf7;padding:12px 13px;display:flex;flex-wrap:wrap;align-items:center;gap:11px\">\n<span style=\"flex:1 1 260px;min-width:0;font-size:14.5px;line-height:1.4\">…and it is something unwanted, not just a fact<\u002Fspan>\n<span style=\"border:1px solid rgba(23,23,26,.22);padding:5px 12px;border-radius:5px;font-size:13px;font-weight:500;cursor:pointer;background:#fff\">Agree<\u002Fspan>\n<span style=\"font-size:12.5px;color:rgba(23,23,26,.6);cursor:pointer\">No<\u002Fspan>\n<\u002Fdiv>\n<div style=\"background:#f6f5f2;padding:12px 13px;display:flex;flex-wrap:wrap;align-items:center;gap:11px\">\n<span style=\"flex:1 1 260px;min-width:0;font-size:14.5px;line-height:1.4;color:rgba(23,23,26,.55)\">…and it is what makes reviews sit unclaimed<\u002Fspan>\n<span style=\"font-size:12px;color:rgba(23,23,26,.5)\">waiting on the first one<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:10px\">\n<span style=\"background:#4a3f8f;color:#fff;padding:9px 15px;border-radius:5px;font-size:13.5px;font-weight:500;cursor:pointer\">Agree to all three<\u002Fspan>\n<span style=\"border:1px solid rgba(23,23,26,.22);padding:8px 14px;border-radius:5px;font-size:13.5px;font-weight:500;cursor:pointer\">Say it our way first<\u002Fspan>\n<span style=\"font-size:12.5px;color:rgba(23,23,26,.6)\">One version of the model, not three<\u002Fspan>\n<\u002Fdiv>\n<sc-if value=\"{{ full }}\" hint-placeholder-val=\"{{ false }}\">\n<span style=\"font-size:12px;line-height:1.5;color:rgba(23,23,26,.55);border-top:1px solid rgba(23,23,26,.1);padding-top:10px\">Prepared against version 17; current is 18. Checked on acceptance — if it no longer fits you will be told rather than rebased. Proposed by the partner from your message; the assumption “nobody re-reads the queue” rides with the relationship.<\u002Fspan>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:9px\">\n<span style=\"font:600 10.5px/1 'Libre Franklin';letter-spacing:.1em;text-transform:uppercase;color:rgba(23,23,26,.6)\">Ready, with something worth knowing<\u002Fspan>\n<div style=\"background:#fff;border:1px solid rgba(23,23,26,.11);border-radius:6px;padding:15px 17px;display:flex;flex-wrap:wrap;align-items:center;gap:12px\">\n<div style=\"flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:3px\">\n<span style=\"font-size:15px;line-height:1.4\">A change: re-read the review queue every morning<\u002Fspan>\n<span style=\"font-size:13px;color:rgba(23,23,26,.55)\">No diagnosis has been agreed yet, so this is a guess at a fix. You can still agree to it.<\u002Fspan>\n<\u002Fdiv>\n<span style=\"border:1px solid rgba(23,23,26,.22);padding:7px 13px;border-radius:5px;font-size:13px;font-weight:500;cursor:pointer\">Decide<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:9px\">\n<span style=\"font:600 10.5px/1 'Libre Franklin';letter-spacing:.1em;text-transform:uppercase;color:rgba(23,23,26,.6)\">Needs another look<\u002Fspan>\n<div style=\"background:#fff;border:1px solid rgba(156,54,32,.3);border-left:3px solid #9c3620;border-radius:6px;padding:15px 17px;display:flex;flex-wrap:wrap;align-items:center;gap:12px\">\n<div style=\"flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:3px\">\n<span style=\"font-size:15px;line-height:1.4\">“Naming an owner cuts the wait before a review starts”<\u002Fspan>\n<span style=\"font-size:13px;color:rgba(23,23,26,.6)\">Reality disagreed on 12 Sep under a fair test. Confirm it, narrow it, replace it, or retire it.<\u002Fspan>\n<\u002Fdiv>\n<span style=\"background:#9c3620;color:#fff;padding:8px 14px;border-radius:5px;font-size:13px;font-weight:500;cursor:pointer\">Respond<\u002Fspan>\n<\u002Fdiv>\n<span style=\"font-size:12.5px;line-height:1.5;color:rgba(23,23,26,.5);max-width:70ch\">Narrowing a claim without risking anything new is recorded as saving it, and it stays marked. If you narrow it, the app will ask what would make the narrower version fail.<\u002Fspan>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:9px\">\n<span style=\"font:600 10.5px/1 'Libre Franklin';letter-spacing:.1em;text-transform:uppercase;color:rgba(23,23,26,.6)\">Waiting on something else<\u002Fspan>\n<div style=\"background:#fff;border:1px solid rgba(23,23,26,.11);border-radius:6px;overflow:hidden\">\n<div style=\"padding:13px 17px;display:flex;flex-wrap:wrap;align-items:baseline;gap:12px;border-top:1px solid rgba(23,23,26,.08)\">\n<span style=\"flex:1 1 300px;min-width:0;font-size:14.5px;line-height:1.4;color:rgba(23,23,26,.7)\">“Every review has an owner within a day” is what success requires<\u002Fspan>\n<span style=\"font-size:12.5px;color:rgba(23,23,26,.5)\">waiting for the goal it belongs to<\u002Fspan>\n<\u002Fdiv>\n<div style=\"padding:13px 17px;display:flex;flex-wrap:wrap;align-items:baseline;gap:12px;border-top:1px solid rgba(23,23,26,.08)\">\n<span style=\"flex:1 1 300px;min-width:0;font-size:14.5px;line-height:1.4;color:rgba(23,23,26,.7)\">The rota resolves the bind between speed and care<\u002Fspan>\n<span style=\"font-size:12.5px;color:rgba(23,23,26,.5)\">waiting for the bind to be written down<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"flex:0 1 268px;min-width:236px;display:flex;flex-direction:column;gap:10px\">\n<span style=\"font:600 10.5px/1 'Libre Franklin';letter-spacing:.1em;text-transform:uppercase;color:rgba(23,23,26,.6)\">Not this list<\u002Fspan>\n<div style=\"background:#fff;border:1px solid rgba(23,23,26,.11);border-radius:6px;padding:14px 15px;display:flex;flex-direction:column;gap:7px\">\n<span style=\"font-size:14px;line-height:1.45;font-weight:500\">1 step is ready to do<\u002Fspan>\n<span style=\"font-size:13px;line-height:1.5;color:rgba(23,23,26,.6)\">Agreeing to a step is not the same as being ready to act on it, and neither is the same as it having happened.<\u002Fspan>\n<span sc-camel-on-click=\"{{ go.act }}\" style=\"font-size:12.5px;color:#4a3f8f;cursor:pointer;text-decoration:underline\">Go to what we are doing<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isAct }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"padding:22px 24px 28px;display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start\">\n<div style=\"flex:1 1 540px;min-width:0;display:flex;flex-direction:column;gap:18px\">\n<div style=\"display:flex;flex-direction:column;gap:3px\">\n<span style=\"font-size:19px;font-weight:600;letter-spacing:-.015em\">What we did, and what happened<\u002Fspan>\n<span style=\"font-size:13.5px;color:rgba(23,23,26,.55)\">One check-in is due. Say what you saw; the app will not decide what it means about the model.<\u002Fspan>\n<\u002Fdiv>\n\n<div style=\"background:#fff;border:1px solid rgba(23,23,26,.14);border-radius:6px;overflow:hidden\">\n<div style=\"padding:16px 19px;border-bottom:1px solid rgba(23,23,26,.09);display:flex;flex-direction:column;gap:9px\">\n<span style=\"font:600 10.5px/1 'Libre Franklin';letter-spacing:.09em;text-transform:uppercase;color:rgba(23,23,26,.6)\">What we promised to look for · sealed 9 Sep, cannot be edited now<\u002Fspan>\n<span style=\"font-size:16px;line-height:1.45\">Within two weeks of the rota going up, <strong style=\"font-weight:600\">the median wait before a review starts falls below 8 hours<\u002Fstrong>.<\u002Fspan>\n<div style=\"display:flex;flex-wrap:wrap;gap:16px;padding-top:2px\">\n<div style=\"display:flex;flex-direction:column;gap:1px\"><span style=\"font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:rgba(23,23,26,.6)\">Read from<\u002Fspan><span style=\"font-size:13.5px\">GitHub review timestamps<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:1px\"><span style=\"font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:rgba(23,23,26,.6)\">Window<\u002Fspan><span style=\"font-size:13.5px\">9 – 23 Sep<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:1px\"><span style=\"font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:rgba(23,23,26,.6)\">Would change our mind<\u002Fspan><span style=\"font-size:13.5px\">8h or worse, two weeks running<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<sc-if value=\"{{ full }}\" hint-placeholder-val=\"{{ false }}\">\n<span style=\"font-size:12px;line-height:1.5;color:rgba(23,23,26,.55);border-top:1px solid rgba(23,23,26,.09);padding-top:9px\">Fair test needs: rota published on time, no freeze week, at least 12 reviews in the window. Sealed against version 16, targeting the relationship “owner named → wait falls”. The comparison against 8h is evaluated mechanically; what it means for the model is a separate, human decision.<\u002Fspan>\n<\u002Fsc-if>\n<\u002Fdiv>\n<div style=\"padding:17px 19px;display:flex;flex-direction:column;gap:14px\">\n<span style=\"font:600 10.5px/1 'Libre Franklin';letter-spacing:.09em;text-transform:uppercase;color:rgba(23,23,26,.6)\">Your check-in<\u002Fspan>\n<div style=\"display:flex;flex-direction:column;gap:6px\">\n<span style=\"font-size:13.5px;color:rgba(23,23,26,.66)\">What did we actually do?<\u002Fspan>\n<div style=\"border:1px solid rgba(23,23,26,.16);border-radius:5px;padding:10px 12px;font-size:14.5px;line-height:1.45\">Rota published 9 Sep, one week late for two people who were on leave.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:14px\">\n<div style=\"flex:0 1 180px;display:flex;flex-direction:column;gap:6px\">\n<span style=\"font-size:13.5px;color:rgba(23,23,26,.66)\">Median wait we saw<\u002Fspan>\n<div style=\"border:1px solid rgba(23,23,26,.16);border-radius:5px;padding:10px 12px;font-size:14.5px\">11.5 hours<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:1 1 200px;display:flex;flex-direction:column;gap:6px\">\n<span style=\"font-size:13.5px;color:rgba(23,23,26,.66)\">Over what period<\u002Fspan>\n<div style=\"border:1px solid rgba(23,23,26,.16);border-radius:5px;padding:10px 12px;font-size:14.5px\">9 – 20 Sep · 19 reviews<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background:#fdf7f5;border:1px solid rgba(156,54,32,.3);border-radius:5px;padding:12px 14px;display:flex;flex-direction:column;gap:4px\">\n<span style=\"font-size:14px;font-weight:600;color:#7d2b19\">This comes out against what we promised to look for.<\u002Fspan>\n<span style=\"font-size:13.5px;line-height:1.5;color:rgba(23,23,26,.68)\">11.5 hours is worse than the 8 we set. The test looks fair, so this will count. It marks one claim as disagreed with — it does not remove it, and it does not touch the goal.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:10px\">\n<span sc-camel-on-click=\"{{ go.decide }}\" style=\"background:#4a3f8f;color:#fff;padding:9px 15px;border-radius:5px;font-size:13.5px;font-weight:500;cursor:pointer\">Record this check-in<\u002Fspan>\n<span style=\"border:1px solid rgba(23,23,26,.22);padding:8px 14px;border-radius:5px;font-size:13.5px;font-weight:500;cursor:pointer\">The test was not fair<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"flex:0 1 296px;min-width:250px;display:flex;flex-direction:column;gap:18px\">\n<div style=\"display:flex;flex-direction:column;gap:9px\">\n<span style=\"font:600 10.5px/1 'Libre Franklin';letter-spacing:.1em;text-transform:uppercase;color:rgba(23,23,26,.6)\">Ready to do<\u002Fspan>\n<div style=\"background:#fff;border:1px solid rgba(23,23,26,.11);border-radius:6px;overflow:hidden\">\n<div style=\"padding:12px 14px;display:flex;flex-direction:column;gap:3px;border-top:1px solid rgba(23,23,26,.08)\"><span style=\"font-size:14px;line-height:1.4\">Publish next week’s rota<\u002Fspan><span style=\"font-size:12px;color:rgba(23,23,26,.5)\">Dana · you asked her · not started<\u002Fspan><\u002Fdiv>\n<div style=\"padding:12px 14px;display:flex;flex-direction:column;gap:3px;border-top:1px solid rgba(23,23,26,.08)\"><span style=\"font-size:14px;line-height:1.4;color:rgba(23,23,26,.55)\">Brief the on-call reviewers<\u002Fspan><span style=\"font-size:12px;color:rgba(23,23,26,.5)\">waiting on a check-in for the step before<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:9px\">\n<span style=\"font:600 10.5px/1 'Libre Franklin';letter-spacing:.1em;text-transform:uppercase;color:rgba(23,23,26,.6)\">Done, not yet checked<\u002Fspan>\n<div style=\"background:#fff;border:1px solid rgba(23,23,26,.11);border-radius:6px;padding:13px 14px;display:flex;flex-direction:column;gap:4px\">\n<span style=\"font-size:14px;line-height:1.4\">Publish the first rota<\u002Fspan>\n<span style=\"font-size:12.5px;line-height:1.45;color:rgba(23,23,26,.55)\">Closed in GitHub on 9 Sep by Dana. Nothing about the model changed when it closed.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<span style=\"font-size:12.5px;line-height:1.55;color:rgba(23,23,26,.5)\">Closing a work item says the work was done. Only a check-in says whether it worked.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isLearn }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"padding:22px 24px 28px;display:flex;flex-direction:column;gap:18px\">\n<div style=\"display:flex;flex-direction:column;gap:3px\">\n<span style=\"font-size:19px;font-weight:600;letter-spacing:-.015em\">How fast are we finding out?<\u002Fspan>\n<span style=\"font-size:13.5px;color:rgba(23,23,26,.55)\">All of this is read from what the team actually recorded. Nobody scores anything by hand.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"background:#fff;border:1px solid rgba(23,23,26,.14);border-left:3px solid #4a3f8f;border-radius:6px;padding:18px 20px;display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start\">\n<div style=\"flex:1 1 380px;min-width:0;display:flex;flex-direction:column;gap:7px\">\n<span style=\"font:600 10.5px/1 'Libre Franklin';letter-spacing:.09em;text-transform:uppercase;color:#4a3f8f\">What is holding us up<\u002Fspan>\n<span style=\"font-size:20px;line-height:1.35;font-weight:500;letter-spacing:-.01em\">Checking in. Ten promises came due without anyone saying what happened.<\u002Fspan>\n<span style=\"font-size:14px;line-height:1.5;color:rgba(23,23,26,.62);max-width:62ch\">Not thinking, not deciding — the team agrees and acts faster than it looks. Reality is answering, and nobody is writing the answer down. Median time from a window closing to a check-in: 19 days.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"flex:0 1 200px;display:flex;flex-direction:column;gap:8px\">\n<div style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"font-size:12px;color:rgba(23,23,26,.55)\">Thinking → suggestion<\u002Fspan><span style=\"font-size:13.5px;font-weight:500\">under a minute<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"font-size:12px;color:rgba(23,23,26,.55)\">Suggestion → decided<\u002Fspan><span style=\"font-size:13.5px;font-weight:500\">1.4 days<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"font-size:12px;color:rgba(23,23,26,.55)\">Window closed → checked in<\u002Fspan><span style=\"font-size:13.5px;font-weight:600;color:#9c3620\">19 days<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"font-size:12px;color:rgba(23,23,26,.55)\">Disagreement → answered<\u002Fspan><span style=\"font-size:13.5px;font-weight:500\">5 days<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:12px\">\n<div style=\"background:#fff;border:1px solid rgba(23,23,26,.11);border-radius:6px;padding:15px 16px;display:flex;flex-direction:column;gap:4px\"><span style=\"font-size:12.5px;color:rgba(23,23,26,.55)\">Claims we could be wrong about<\u002Fspan><span style=\"font-size:22px;font-weight:600;letter-spacing:-.02em\">4 of 7<\u002Fspan><span style=\"font-size:12px;line-height:1.45;color:rgba(23,23,26,.5)\">The other 3 carry weight with nothing risked on them.<\u002Fspan><\u002Fdiv>\n<div style=\"background:#fff;border:1px solid rgba(23,23,26,.11);border-radius:6px;padding:15px 16px;display:flex;flex-direction:column;gap:4px\"><span style=\"font-size:12.5px;color:rgba(23,23,26,.55)\">Disagreements not yet answered<\u002Fspan><span style=\"font-size:22px;font-weight:600;letter-spacing:-.02em\">1<\u002Fspan><span style=\"font-size:12px;line-height:1.45;color:rgba(23,23,26,.5)\">Oldest is 5 days. None older than a fortnight.<\u002Fspan><\u002Fdiv>\n<div style=\"background:#fff;border:1px solid rgba(23,23,26,.11);border-radius:6px;padding:15px 16px;display:flex;flex-direction:column;gap:4px\"><span style=\"font-size:12.5px;color:rgba(23,23,26,.55)\">“The test was not fair”<\u002Fspan><span style=\"font-size:22px;font-weight:600;letter-spacing:-.02em\">1 in 9<\u002Fspan><span style=\"font-size:12px;line-height:1.45;color:rgba(23,23,26,.5)\">Three in a row on one claim would prompt a question.<\u002Fspan><\u002Fdiv>\n<div style=\"background:#fff;border:1px solid rgba(23,23,26,.11);border-radius:6px;padding:15px 16px;display:flex;flex-direction:column;gap:4px\"><span style=\"font-size:12.5px;color:rgba(23,23,26,.55)\">Reviews finished a week<\u002Fspan><span style=\"font-size:22px;font-weight:600;letter-spacing:-.02em\">11<\u002Fspan><span style=\"font-size:12px;line-height:1.45;color:rgba(23,23,26,.5)\">The goal’s own rate. Baseline 9, on 1 Aug.<\u002Fspan><\u002Fdiv>\n<div style=\"background:#fff;border:1px solid rgba(23,23,26,.11);border-radius:6px;padding:15px 16px;display:flex;flex-direction:column;gap:4px\"><span style=\"font-size:12.5px;color:rgba(23,23,26,.55)\">Steps carried through<\u002Fspan><span style=\"font-size:22px;font-weight:600;letter-spacing:-.02em\">1 of 4<\u002Fspan><span style=\"font-size:12px;line-height:1.45;color:rgba(23,23,26,.5)\">Movement through the plan. Not the same as the rate above.<\u002Fspan><\u002Fdiv>\n<div style=\"background:#fff;border:1px solid rgba(23,23,26,.11);border-radius:6px;padding:15px 16px;display:flex;flex-direction:column;gap:4px\"><span style=\"font-size:12.5px;color:rgba(23,23,26,.55)\">Support resting on the partner alone<\u002Fspan><span style=\"font-size:22px;font-weight:600;letter-spacing:-.02em\">18%<\u002Fspan><span style=\"font-size:12px;line-height:1.45;color:rgba(23,23,26,.5)\">Agreed because it sounded right, with no human evidence behind it.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<sc-if value=\"{{ full }}\" hint-placeholder-val=\"{{ false }}\">\n<span style=\"font-size:12.5px;line-height:1.6;color:rgba(23,23,26,.55);max-width:80ch\">Goal throughput, transition flow and learning flow are three different measures and none substitutes for another. One current step has lost its work-item mapping; projection coverage is 15 of 16 and the divergence is listed for repair.<\u002Fspan>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isFirst }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"padding:60px 24px 70px;display:flex;justify-content:center\">\n<div style=\"width:100%;max-width:620px;display:flex;flex-direction:column;gap:22px\">\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<span style=\"font-size:28px;line-height:1.25;font-weight:500;letter-spacing:-.02em\">What is on your mind?<\u002Fspan>\n<span style=\"font-size:15.5px;line-height:1.55;color:rgba(23,23,26,.6)\">Start with the untidy version. You do not need to know the method, and you do not need to put anything in the right place — that comes out of the conversation, and you decide what sticks.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"background:#fff;border:1px solid rgba(23,23,26,.16);border-radius:6px;padding:15px 16px;min-height:96px;font-size:16px;color:rgba(23,23,26,.5)\">Reviews are taking a week and nobody knows why…<\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:10px\">\n<span sc-camel-on-click=\"{{ go.think }}\" style=\"background:#4a3f8f;color:#fff;padding:10px 17px;border-radius:5px;font-size:14px;font-weight:500;cursor:pointer\">Begin<\u002Fspan>\n<span style=\"font-size:13.5px;color:rgba(23,23,26,.5)\">or <span style=\"color:#4a3f8f;text-decoration:underline;cursor:pointer\">bring in a plan you already have<\u002Fspan><\u002Fspan>\n<\u002Fdiv>\n<div style=\"border-top:1px solid rgba(23,23,26,.1);padding-top:18px;display:flex;flex-direction:column;gap:10px\">\n<span style=\"font:600 10.5px/1 'Libre Franklin';letter-spacing:.1em;text-transform:uppercase;color:rgba(23,23,26,.6)\">This space will fill up with six kinds of thinking<\u002Fspan>\n<div style=\"display:flex;flex-wrap:wrap;gap:7px\">\n<span style=\"font-size:13.5px;padding:6px 12px;border:1px solid rgba(23,23,26,.14);border-radius:20px;color:rgba(23,23,26,.62);cursor:pointer\">What we are after<\u002Fspan>\n<span style=\"font-size:13.5px;padding:6px 12px;border:1px solid rgba(23,23,26,.14);border-radius:20px;color:rgba(23,23,26,.62);cursor:pointer\">What is in the way<\u002Fspan>\n<span style=\"font-size:13.5px;padding:6px 12px;border:1px solid rgba(23,23,26,.14);border-radius:20px;color:rgba(23,23,26,.62);cursor:pointer\">The bind<\u002Fspan>\n<span style=\"font-size:13.5px;padding:6px 12px;border:1px solid rgba(23,23,26,.14);border-radius:20px;color:rgba(23,23,26,.62);cursor:pointer\">What we would change<\u002Fspan>\n<span style=\"font-size:13.5px;padding:6px 12px;border:1px solid rgba(23,23,26,.14);border-radius:20px;color:rgba(23,23,26,.62);cursor:pointer\">What that needs<\u002Fspan>\n<span style=\"font-size:13.5px;padding:6px 12px;border:1px solid rgba(23,23,26,.14);border-radius:20px;color:rgba(23,23,26,.62);cursor:pointer\">Steps<\u002Fspan>\n<\u002Fdiv>\n<span style=\"font-size:13px;line-height:1.55;color:rgba(23,23,26,.5)\">Tap any of them to ask what it is for. All six stay empty and out of your way until you have something to put in them.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isGh }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"padding:22px 24px 28px;display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start\">\n<div style=\"flex:1 1 560px;min-width:0;display:flex;flex-direction:column;gap:12px\">\n<span style=\"font-size:13.5px;color:rgba(23,23,26,.55)\">What a participant who never opens Reason Commons sees:<\u002Fspan>\n<div style=\"background:#fff;border:1px solid rgba(23,23,26,.14);border-radius:6px;overflow:hidden\">\n<div style=\"padding:16px 19px;border-bottom:1px solid rgba(23,23,26,.09);display:flex;flex-direction:column;gap:9px\">\n<span style=\"font-size:19px;line-height:1.35;font-weight:500\">Publish a weekly review-owner rota <span style=\"color:rgba(23,23,26,.6);font-weight:400\">#214<\u002Fspan><\u002Fspan>\n<div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n<span style=\"font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;background:#edebf6;color:#3a3175;border:1px solid rgba(74,63,143,.25)\">rc:ready<\u002Fspan>\n<span style=\"font-size:11.5px;padding:3px 9px;border-radius:20px;border:1px solid rgba(23,23,26,.16);color:rgba(23,23,26,.6)\">step 3 of 16<\u002Fspan>\n<span style=\"font-size:11.5px;padding:3px 9px;border-radius:20px;border:1px solid rgba(23,23,26,.16);color:rgba(23,23,26,.6)\">assignee: dana<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding:17px 19px;display:flex;flex-direction:column;gap:12px\">\n<div style=\"border:1px dashed rgba(23,23,26,.25);border-radius:5px;padding:14px 15px;background:#fbfaf7;display:flex;flex-direction:column;gap:11px\">\n<span style=\"font:600 10px/1 'Libre Franklin';letter-spacing:.09em;text-transform:uppercase;color:rgba(23,23,26,.6)\">Kept in step with Reason Commons — edits here are replaced<\u002Fspan>\n<div style=\"display:flex;flex-direction:column;gap:9px\">\n<div style=\"display:flex;flex-direction:column;gap:1px\"><span style=\"font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:rgba(23,23,26,.6)\">Because, today<\u002Fspan><span style=\"font-size:14.5px;line-height:1.45\">Reviews have no named owner.<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:1px\"><span style=\"font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:rgba(23,23,26,.6)\">What is needed<\u002Fspan><span style=\"font-size:14.5px;line-height:1.45\">Somebody accountable for the queue each week.<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:1px\"><span style=\"font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:rgba(23,23,26,.6)\">Do this<\u002Fspan><span style=\"font-size:14.5px;line-height:1.45\">Publish a weekly review-owner rota in #eng-reviews every Monday.<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:1px\"><span style=\"font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:rgba(23,23,26,.6)\">Should produce<\u002Fspan><span style=\"font-size:14.5px;line-height:1.45\">Every open review has a named owner within 24 hours.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<span style=\"font-size:13.5px;color:#4a3f8f;text-decoration:underline\">Open this step in Reason Commons →<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;gap:11px;padding-top:2px\">\n<span style=\"width:26px;height:26px;flex:none;border-radius:50%;background:rgba(23,23,26,.12)\"><\u002Fspan>\n<div style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"font-size:13px;color:rgba(23,23,26,.5)\"><strong style=\"font-weight:600;color:#17171a\">priya<\u002Fstrong> commented 2 days ago<\u002Fspan><span style=\"font-size:14.5px;line-height:1.5\">Rota is up but two people were on leave — worth noting when we check whether this worked.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:0 1 268px;min-width:236px;display:flex;flex-direction:column;gap:10px\">\n<span style=\"font:600 10.5px/1 'Libre Franklin';letter-spacing:.1em;text-transform:uppercase;color:rgba(23,23,26,.6)\">What the labels mean<\u002Fspan>\n<div style=\"background:#fff;border:1px solid rgba(23,23,26,.11);border-radius:6px;overflow:hidden\">\n<div style=\"padding:10px 13px;border-top:1px solid rgba(23,23,26,.08);display:flex;flex-direction:column;gap:1px\"><span style=\"font-size:13px;font-weight:600\">rc:ready<\u002Fspan><span style=\"font-size:12px;color:rgba(23,23,26,.55)\">nothing is stopping it<\u002Fspan><\u002Fdiv>\n<div style=\"padding:10px 13px;border-top:1px solid rgba(23,23,26,.08);display:flex;flex-direction:column;gap:1px\"><span style=\"font-size:13px;font-weight:600\">rc:blocked<\u002Fspan><span style=\"font-size:12px;color:rgba(23,23,26,.55)\">an earlier step has not been checked<\u002Fspan><\u002Fdiv>\n<div style=\"padding:10px 13px;border-top:1px solid rgba(23,23,26,.08);display:flex;flex-direction:column;gap:1px\"><span style=\"font-size:13px;font-weight:600\">rc:pending-change<\u002Fspan><span style=\"font-size:12px;color:rgba(23,23,26,.55)\">somebody proposed changing this step<\u002Fspan><\u002Fdiv>\n<div style=\"padding:10px 13px;border-top:1px solid rgba(23,23,26,.08);display:flex;flex-direction:column;gap:1px\"><span style=\"font-size:13px;font-weight:600\">rc:awaiting-outcome<\u002Fspan><span style=\"font-size:12px;color:rgba(23,23,26,.55)\">done, not yet checked<\u002Fspan><\u002Fdiv>\n<div style=\"padding:10px 13px;border-top:1px solid rgba(23,23,26,.08);display:flex;flex-direction:column;gap:1px\"><span style=\"font-size:13px;font-weight:600\">rc:superseded<\u002Fspan><span style=\"font-size:12px;color:rgba(23,23,26,.55)\">replaced; the successor has its own issue<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<span style=\"font-size:12.5px;line-height:1.55;color:rgba(23,23,26,.5)\">No YAML, no graph, no account needed. Closing the issue records that the work was done — never that it worked.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<div style=\"margin-top:auto;display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:12px 20px;border-top:1px solid rgba(23,23,26,.11);background:#fff\">\n<span style=\"font-size:12px;color:rgba(23,23,26,.6)\">Other states:<\u002Fspan>\n<span sc-camel-on-click=\"{{ go.first }}\" style=\"font-size:12.5px;color:#4a3f8f;cursor:pointer;text-decoration:underline\">A space with nothing in it<\u002Fspan>\n<span sc-camel-on-click=\"{{ go.gh }}\" style=\"font-size:12.5px;color:#4a3f8f;cursor:pointer;text-decoration:underline\">The work item in GitHub<\u002Fspan>\n<span style=\"font-size:12px;color:rgba(23,23,26,.6);margin-left:auto\">Plain wording throughout · switch to Full record for provenance, seals and state<\u002Fspan>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280},&quot;startScreen&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;now&quot;,&quot;think&quot;,&quot;model&quot;,&quot;decide&quot;,&quot;act&quot;,&quot;learn&quot;,&quot;first&quot;,&quot;gh&quot;],&quot;default&quot;:&quot;now&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Prototype&quot;},&quot;startMode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;plain&quot;,&quot;full&quot;],&quot;default&quot;:&quot;plain&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Prototype&quot;}}\">\nclass Component extends DCLogic {\n  constructor(p) {\n    super(p);\n    this.state = { screen: p.startScreen || \"now\", mode: p.startMode || \"plain\", model: \"written\" };\n  }\n  renderVals() {\n    const s = this.state.screen, full = this.state.mode === \"full\";\n    const go = k => () => this.setState({ screen: k });\n    const on = \"#17171a\", off = \"transparent\";\n    const nav = [\n      [\"now\", \"Now\", \"1 waiting\"],\n      [\"think\", \"Thinking\", \"\"],\n      [\"model\", \"Model\", \"v18\"],\n      [\"decide\", \"Decide\", \"4\"],\n      [\"act\", \"Act & learn\", \"1 due\"],\n      [\"learn\", \"Learning\", \"\"]\n    ].map(([k, label, count]) => ({\n      label, count, go: go(k),\n      bg: s === k ? \"#f0eef8\" : off,\n      fg: s === k ? \"#3a3175\" : \"rgba(23,23,26,.62)\",\n      fw: s === k ? 600 : 400,\n      cfg: s === k ? \"#6b5fb8\" : \"rgba(23,23,26,.6)\"\n    }));\n    const waiting = [\n      { kind: \"Decide\", text: \"Two suggestions are ready — one of them adds a step to the plan\", meta: \"since yesterday\", go: go(\"decide\") },\n      { kind: \"Do\", text: \"A step is ready and nobody has taken it on\", meta: \"8 days\", go: go(\"act\") },\n      { kind: \"Check in\", text: \"“Reviews get claimed within a day” — we said we would look by Thursday\", meta: \"due Thu\", go: go(\"act\") },\n      { kind: \"Disagreement\", text: \"Priya doubts a link that three steps lean on\", meta: \"5 days open\", go: go(\"model\") },\n      { kind: \"Measure\", text: \"No agreed way to tell whether the goal itself is moving\", meta: \"blocks nothing\", go: go(\"learn\") }\n    ];\n    return {\n      navItems: nav,\n      waiting,\n      go: { now: go(\"now\"), think: go(\"think\"), model: go(\"model\"), decide: go(\"decide\"), act: go(\"act\"), learn: go(\"learn\"), first: go(\"first\"), gh: go(\"gh\") },\n      isNow: s === \"now\", isThink: s === \"think\", isModel: s === \"model\", isDecide: s === \"decide\",\n      isAct: s === \"act\", isLearn: s === \"learn\", isFirst: s === \"first\", isGh: s === \"gh\",\n      full,\n      setPlain: () => this.setState({ mode: \"plain\" }),\n      setFull: () => this.setState({ mode: \"full\" }),\n      plainBg: full ? \"#fff\" : on, plainFg: full ? \"rgba(23,23,26,.6)\" : \"#fff\",\n      fullBg: full ? on : \"#fff\", fullFg: full ? \"#fff\" : \"rgba(23,23,26,.6)\",\n      modelWritten: this.state.model === \"written\", modelDrawing: this.state.model === \"drawing\",\n      setWritten: () => this.setState({ model: \"written\" }),\n      setDrawing: () => this.setState({ model: \"drawing\" }),\n      writtenBg: this.state.model === \"written\" ? on : \"transparent\",\n      writtenFg: this.state.model === \"written\" ? \"#fff\" : \"rgba(23,23,26,.6)\",\n      drawingBg: this.state.model === \"drawing\" ? on : \"transparent\",\n      drawingFg: this.state.model === \"drawing\" ? \"#fff\" : \"rgba(23,23,26,.6)\"\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
