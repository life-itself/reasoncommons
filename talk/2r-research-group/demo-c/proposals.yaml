meta:
  title: Demo C — rehearsal · sample contributions
  event: Second Renaissance Research Group
  date: 2026-09-04
  model_source: ltp/ltp-model.yaml
  contributions_source: skills/contribution-proposals/examples/contributions.sample.txt
  attribution: name

proposals:
  - id: PROP-001
    source:
      contributor: Wendy Nakamura
      text: >-
        I think we're assuming everyone has to move through the same progression. First contact, then practice, then contributing, then stewarding. But the communities I work with wouldn't recognise that shape at all — some of them start with the doing and never get near the discourse. A single path is going to lose them at step one.
    interpretation:
      statement: The path from first contact to sustained practice has to be able to take different shapes in different communities, rather than one progression everybody runs.
    proposal:
      operation: add_entity
      entity:
        type: necessary_condition
        status: provisional
        statement: Entry paths can take different shapes in different community contexts
      placement:
        view: goal-tree
        connects_to: NC-2
        relation: necessary_for
      rationale: NC-2 already requires a transparent path from first contact to sustained practice, but says nothing about whether that path can vary. This is a condition on NC-2 rather than a rival to it.
      confidence: high
    review:
      status: pending

  - id: PROP-002
    source:
      contributor: Tomás Herrera
      text: >-
        it's in the small tents that the actual work happens. big gatherings are good for morale and terrible for anything else. every real change I've seen came out of five people who kept showing up.
    interpretation:
      statement: Dense small groups, not large gatherings, are where practice actually takes hold — offered from Tomás's own experience.
    proposal:
      operation: support_entity
      placement:
        view: goal-tree
        connects_to: NC-5
      rationale: NC-5 already holds that dense practice containers need sangha support. This is first-hand testimony for it, which the condition currently lacks — its evidence is all documentary.
      confidence: high
      alternatives:
        - target: NC-3
          confidence: low
          note: Also touches repeated practice, but the contribution is about group size rather than depth.
    review:
      status: pending

  - id: PROP-003
    source:
      contributor: Marta Oyelaran
      text: >-
        I run a permaculture cooperative outside Coimbra, eleven of us, going on six years now. I'll be honest, I came to this because a friend sent it to me and I'm not sure I follow all the language in your documents. But here is what I know. We spent the first two years talking about values. Reading, discussing, going on retreats. Nothing changed. What changed us was the third year, when we took on four hectares of degraded land and had to actually feed ourselves from it. You learn cooperation very fast when the irrigation fails in August. People who could not agree in a meeting agreed in a field. So I think something is being missed here, which is that most people do not change their views and then change their lives. They change their lives, usually because they have to, and the views follow after. If you want the durable thing you keep talking about, I suspect you need people doing something together that has real consequences if they get it wrong.
    interpretation:
      statement: Durable change comes from shared practical work with real consequences, and the change in views follows it rather than preceding it.
      note: The contribution is mostly an account of one cooperative and never uses the model's vocabulary. The operative claim is the causal order in its last three sentences; the account is the evidence for it, not a second claim.
    proposal:
      operation: add_entity
      entity:
        type: necessary_condition
        status: provisional
        statement: People take on shared practical work with real consequences, from which changed views follow
      placement:
        view: goal-tree
        connects_to: CSF-1
        relation: necessary_for
      rationale: CSF-1 requires that people durably embody wiser views, values, practices, and ways of acting, but is silent on how that comes about. Marta's claim is that consequential shared work is what produces it, which makes it a condition on CSF-1.
      confidence: medium
      alternatives:
        - target: NC-3
          confidence: medium
          note: Could instead be read as a challenge to NC-3's "progressively deeper levels", which implies practice deepens by repetition rather than by consequence.
    review:
      status: pending

  - id: PROP-004
    source:
      contributor: Kwame Boateng
      text: >-
        Adding to what Marta said, because I think it's the same point from a different angle. I trained as a carpenter. Nobody learns carpentry from a book and nobody learns it alone. You stand next to someone for two years and you ruin a lot of wood. Whatever this group is trying to pass on, if there isn't an apprenticeship shape to it — someone experienced, someone new, real work between them, and time — it will not pass on.
    interpretation:
      statement: The shared practical work has to be organised as apprenticeship — an experienced person, a newer person, real work between them, over time — or nothing transmits.
    proposal:
      operation: add_entity
      entity:
        type: necessary_condition
        status: provisional
        statement: The work is learned by apprenticeship — an experienced person, a newer person, and real work between them over time
      placement:
        view: goal-tree
        connects_to: PROP-003
        relation: necessary_for
      rationale: Kwame says explicitly that he is extending Marta's point, and he is — this is a condition on the shared consequential work she proposes, not on CSF-1 directly. It hangs off her claim, so the room decides hers first.
      confidence: medium
      alternatives:
        - target: NC-4
          confidence: medium
          note: If PROP-003 is rejected, this reads instead as a condition on NC-4, contributors developing into facilitators and stewards.
    review:
      status: pending

  - id: PROP-005
    source:
      contributor: Priya Raghavan
      text: >-
        Honestly I don't think "throughput" can be defined here without becoming a metric someone games. The moment you count adoption events you get people producing adoption events. I know the doc says it won't reduce to activity counts but I've never seen that hold once there's a number.
    interpretation:
      statement: Any operational definition of throughput will be gamed, so NC-1 may be requiring something that cannot survive contact with the group's own incentives.
    proposal:
      operation: challenge_entity
      placement:
        view: goal-tree
        connects_to: NC-1
      rationale: NC-1 asserts throughput can be operationally defined without reducing transformation to activity counts. This says the qualifier will not hold in practice. It disputes the condition itself, not its placement.
      confidence: high
    review:
      status: pending

  - id: PROP-006
    source:
      contributor: Dev Chaudhary
      text: >-
        The maps being versioned and challengeable is good but that on its own doesn't make the group learn anything. You can have a beautifully maintained wiki that nobody's mind is ever changed by. Learning happens when someone is actually made to answer an objection, and that's a social practice, not a document format.
    interpretation:
      statement: Governing the maps as a versioned commons is not sufficient for the group to learn; the link from NC-6 to CSF-2 assumes a social practice that the condition does not name.
    proposal:
      operation: challenge_link
      placement:
        view: goal-tree
        link: L-009
      rationale: The challenge is aimed at the arrow, not at either end of it. NC-6 can be fully satisfied and CSF-2 still fail, which is what a challenge to a necessity link means.
      confidence: high
    review:
      status: pending

  - id: PROP-007
    source:
      contributor: Ana Beatriz Lima
      text: >-
        I want to talk about money, but not in the way people usually mean it here. I've spent nine years working on mutual credit systems in Belo Horizonte, and the thing I keep seeing is that the currency people use decides what they are able to do with each other. If you need euros to take part, then taking part is rationed by who has euros, and that isn't a values problem, it's a plumbing problem. Everyone in our network can trade hours without having to earn first, and it changed who showed up — completely. What I notice in your model is that it assumes people can give time to practice and to stewarding. But the people who most need what you're describing are exactly the ones whose hours are already sold. I don't know where this goes in your diagram. I just don't think you can leave it out.
    interpretation:
      statement: Taking part depends on unpaid time, so it is rationed to people whose hours are not already sold — which narrows who can practise and who can steward.
      note: The mutual credit material is the contributor's evidence for the mechanism rather than a proposal to adopt mutual credit, and is read that way here. Read otherwise, this would be an injection for the future-reality tree and a different proposal entirely.
    proposal:
      operation: add_entity
      entity:
        type: root_cause
        status: provisional
        statement: Participation depends on unpaid time, so it is rationed to those whose hours are not already sold
      placement:
        view: current-reality
        connects_to: UDE-3
        relation: causes
      rationale: UDE-3 observes that core organizers carry too much of the work and risk burnout. If only people with spare unpaid hours can take part, the pool of people who could carry it is small by construction — a cause of UDE-3 the tree does not currently hold. Note this is a different claim from Sam's about who funds the work.
      confidence: medium
    review:
      status: pending

  - id: PROP-008
    source:
      contributor: Joachim Weber
      text: >-
        Facilitator development isn't just about replication — the people who learn to facilitate are the ones who end up noticing what isn't working and saying so. That's how the group learns. Feels like it should point at both.
    interpretation:
      statement: Developing facilitators feeds the group's capacity to learn and revise strategy, not only its capacity to transmit practice.
    proposal:
      operation: add_link
      placement:
        view: goal-tree
        from: NC-4
        to: CSF-2
        relation: contributes_to
      rationale: NC-4 currently hangs only under CSF-3, transmissibility. The contribution claims a second parent, which the model can hold — a necessary condition may serve more than one success factor.
      confidence: medium
    review:
      status: pending

  - id: PROP-009
    source:
      contributor: Sam Okonkwo
      text: >-
        None of this addresses who is paying for any of it. Every group I've been part of that ignored that ended up quietly run by whoever happened to have savings, and nobody voted for that. I'd want to see the funding model before I'd want to see another tree.
    interpretation:
      statement: The model says nothing about how the work is funded, and unexamined funding quietly decides who holds authority.
    proposal:
      operation: unplaced
      placement:
        view: goal-tree
      rationale: No entity in the model concerns resourcing, funding, or the authority that follows it. The nearest, NC-6 on governance, is about how maps are governed rather than how the work is paid for. Ana Beatriz's contribution is about participants' own hours and does have an address; this one is about who funds the group and who thereby ends up in charge, and attaching it anywhere would hide exactly the thing Sam is pointing at.
      confidence: high
    review:
      status: pending
