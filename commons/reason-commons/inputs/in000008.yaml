  text: 'Reconstructed stage 8: Preserve development in the app


    A dogfood interface needs more than a store of source documents. It must preserve
    the path from purpose, through obstacles and conflict, to the implemented interface
    injection. The goal, trees, sources, earlier formulations and adoption decisions
    make that path inspectable. Participants must be able to challenge the interpretation,
    and choose automatic admission or explicit review. These are reconstructed design
    implications of persistence and minimal participation burden; no invented manual
    protocol is presented as a historical law.


    Reason for the next step: An easy-to-decode account lets builders continue rather
    than repeat the development reasoning.'
