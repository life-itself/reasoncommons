  text: 'Reconstructed stage 6: Use RC manually on RC


    In the stipulated pre-history, the manual record system already works: its builders
    use it to further RC. But keeping the record by hand is tedious. This is a concrete
    operating constraint in the dogfood system itself. Existing artifacts carry prior
    reasoning; re-entering them would reproduce that burden. The interface is a response
    to this constraint, not the origin of RC’s purpose.


    Reason for the next step: The need for an app arises from using the manual system
    on real development work.'
