    intervention:
      decision: Review and use the contribution receipt
      goal_ref: G1@1
      kind: recommendation
      options: []
      primary_prompt: 'Next: review the change your report led to. The Transition
        tree has the two actions (a lasting receipt and update markers); their implementation
        waits for your review at https://github.com/life-itself/reason-commons-tui/pull/40.
        Once it is merged, send your next contribution and say whether you could tell
        what it did: a saved note, which consultant, waiting proposals or changed
        trees.'
      purpose: continuation
      rationale: Your report is the undesirable effect. The receipt and markers are
        the candidate injection; automated checks show they behave as specified, but
        only your next real use can show whether they make the outcome clear (S191)
        or just add noise.
      required_context_refs:
      - tt_receipt
      - tt_markers
      - frt_benefit
