- data:
    decision: Choose the first dogfood move
    goal_ref: G1@1
    kind: recommendation
    options: []
    primary_prompt: 'Next: trace why manual RC led to this interface, what the interface
      was meant to change, and what would make that change fail. Use that chain to
      identify the first improvement to RC itself.'
    purpose: continuation
    rationale: A legible record only helps throughput when builders can use it. Following
      one implemented decision tests the interface’s ability to support continued
      reasoning, while revealing where explanation or navigation is still missing.
    required_context_refs:
    - N1@1
